# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  default:
    cmds:
      - task: run

  run:
    desc: "run"
    ignore_error: true
    interactive: true
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  check:
    desc: "check Rust and Python workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo check --workspace --all-targets {{.CLI_ARGS}}
      - task: check:py

  check:rust:
    desc: "check cargo workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo check --workspace --all-targets {{.CLI_ARGS}}

  check:py:
    desc: "typecheck Python bridge"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - uvx --from mypy==1.18.2 --with protobuf==6.33.5 --with types-protobuf==6.32.1.20260221 --with numpy==2.3.5 mypy {{.CLI_ARGS}}

  check:fc:
    desc: "check cargo workspace for all combinations of features"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo fc check --workspace --all-targets {{.CLI_ARGS}}
      - task: check:py

  clean:
    desc: "clean cargo workspace"
    cmds:
      - cargo clean {{.CLI_ARGS}}

  docs:
    desc: "open documentation preview"
    env:
      RUSTDOCFLAGS: "--cfg docsrs"
    cmds:
      - cargo +nightly watchdoc --all-features {{.CLI_ARGS}}

  outdated:
    desc: "check for outdated cargo workspace dependencies"
    cmds:
      - cargo outdated --workspace --ignore-external-rel --exit-code 1 -v {{.CLI_ARGS}}

  unused:
    desc: "check for unused cargo workspace dependencies"
    aliases: [unused-dependencies]
    cmds:
      - cargo +nightly udeps {{.CLI_ARGS}}

  audit:
    desc: "audit cargo workspace dependencies"
    cmds:
      - cargo audit {{.CLI_ARGS}}

  format:
    desc: "format Rust, Python, JavaScript, and protobuf schemas"
    cmds:
      - task: format:rust
      - task: format:py
      - task: format:js
      - task: format:proto

  format:rust:
    desc: "format cargo workspace"
    cmds:
      - cargo fmt --all {{.CLI_ARGS}}

  format:py:
    desc: "format Python bridge code"
    cmds:
      - uvx --from ruff==0.14.8 ruff format --cache-dir .ruff_cache --force-exclude web/bridge.py pybuild/setup.py qt/make_demo.py typings {{.CLI_ARGS}}

  format:js:
    desc: "format JavaScript bridge code"
    cmds:
      - bunx --bun prettier@3.6.2 --write --cache --cache-location node_modules/.cache/prettier/.prettier-cache web/bridge.js web/bridge_worker.js pybuild/smoke-test.mjs package.json {{.CLI_ARGS}}

  format:proto:
    desc: "format protobuf schemas"
    cmds:
      - buf format -w

  test:
    desc: "test cargo workspace"
    cmds:
      - cargo nextest run --workspace --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:fc:
    desc: "test cargo workspace for all combinations of features"
    cmds:
      - cargo fc nextest run --workspace --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:doc:
    desc: "run doctests in cargo workspace"
    cmds:
      - cargo test --doc --workspace {{.CLI_ARGS}}

  lint:ast-grep:
    desc: "lint with ast-grep rules"
    cmds: []
      # - sg scan

  lint:py:
    desc: "lint Python bridge with ruff"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uvx --from ruff==0.14.8 ruff check --cache-dir .ruff_cache --force-exclude web/bridge.py pybuild/setup.py qt/make_demo.py typings {{.CLI_ARGS}}

  lint:
    desc: "lint Rust and Python workspace"
    cmds:
      - cargo lint --workspace --all-features {{.CLI_ARGS}}
      - task: lint:ast-grep
      - task: lint:py

  lint:fc:
    desc: "lint Rust (all feature combinations) and Python workspace"
    cmds:
      - cargo fc lint {{.CLI_ARGS}}
      - task: lint:ast-grep
      - task: lint:py

  lint:fix:
    desc: "lint and fix cargo workspace"
    aliases: [fix]
    cmds:
      - cargo fixit --workspace --all-features {{.CLI_ARGS}}
      - task: lint:ast-grep

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  pyodide:build-pthread:
    desc: "EXPERIMENTAL: build a pthread-enabled Pyodide in Docker (see docker/pyodide-pthread/README.md)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/build.sh
