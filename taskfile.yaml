# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  default:
    cmds:
      - task: run

  run:
    desc: "run the web app (delegates to `mise run serve`)"
    ignore_error: true
    interactive: true
    cmds:
      - mise run serve

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  check:
    desc: "check Rust, Python and TypeScript"
    dir: "{{.ROOT_DIR}}"
    cmds:
      # The desktop app is intentionally unsupported; the host pass keeps only
      # the library + native tests buildable, while the wasm pass below checks
      # the real browser entrypoint and bridge.
      - cargo c --workspace --all-features --lib --tests {{.CLI_ARGS}}
      - task: check:threads
      - task: check:py
      - task: check:ts

  check:rust:
    desc: "check cargo workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo c --workspace --all-features --lib --tests {{.CLI_ARGS}}

  check:py:
    desc: "typecheck Python bridge"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - uvx --from mypy==1.18.2 --with protobuf==7.34.1 --with types-protobuf==7.34.1.20260518 --with numpy==2.4.3 mypy {{.CLI_ARGS}}

  check:ts:
    desc: "typecheck the TypeScript bridge glue (incl. generated protobuf messages)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - bunx tsc --noEmit -p tsconfig.json

  check:fc:
    desc: "check cargo workspace for all combinations of features"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo fc check --workspace --lib --tests {{.CLI_ARGS}}
      - task: check:py

  check:threads:
    desc: "type-check the threaded wasm build (the `threads` feature, excluded from the fc matrix)"
    dir: "{{.ROOT_DIR}}"
    # The actual threaded wasm build still needs build-std so std is rebuilt with
    # atomics. This closes the gap left by the generic feature matrix.
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
    cmds:
      - cargo c --target wasm32-unknown-unknown --features threads {{.CLI_ARGS}}

  clean:
    desc: "clean cargo workspace"
    cmds:
      - cargo clean {{.CLI_ARGS}}

  docs:
    desc: "open documentation preview"
    env:
      RUSTDOCFLAGS: "--cfg docsrs"
    cmds:
      - cargo watchdoc --all-features {{.CLI_ARGS}}

  outdated:
    desc: "check for outdated cargo workspace dependencies"
    cmds:
      - cargo outdated --workspace --ignore-external-rel --exit-code 1 -v {{.CLI_ARGS}}

  unused:
    desc: "check for unused cargo workspace dependencies"
    aliases: [unused-dependencies]
    cmds:
      - cargo udeps {{.CLI_ARGS}}

  audit:
    desc: "audit cargo workspace dependencies"
    cmds:
      - cargo audit {{.CLI_ARGS}}

  format:
    desc: "format Rust, Python, JavaScript, and protobuf schemas"
    cmds:
      - task: format:rust
      - task: format:py
      - task: format:js
      - task: format:proto

  format:rust:
    desc: "format cargo workspace"
    cmds:
      - cargo fmt --all {{.CLI_ARGS}}

  format:py:
    desc: "format Python bridge code"
    cmds:
      - uvx --from ruff==0.14.8 ruff format --cache-dir .ruff_cache --force-exclude web/bridge.py pybuild/setup.py qt/make_demo.py typings {{.CLI_ARGS}}

  format:js:
    desc: "format JavaScript bridge code"
    cmds:
      - bunx --bun prettier@3.6.2 --write --cache --cache-location node_modules/.cache/prettier/.prettier-cache web/bridge.ts web/bridge_worker.ts package.json {{.CLI_ARGS}}

  format:proto:
    desc: "format protobuf schemas"
    cmds:
      - buf format -w

  test:
    desc: "test cargo workspace"
    cmds:
      - cargo nextest run --workspace --all-features --lib --tests --no-tests "warn" {{.CLI_ARGS}}

  test:fc:
    desc: "test cargo workspace for all combinations of features"
    cmds:
      - cargo fc nextest run --workspace --lib --tests --no-tests "warn" {{.CLI_ARGS}}

  test:doc:
    desc: "run doctests in cargo workspace"
    cmds:
      - cargo test --doc --workspace {{.CLI_ARGS}}

  lint:ast-grep:
    desc: "lint with ast-grep rules"
    cmds: []
      # - sg scan

  lint:py:
    desc: "lint Python bridge with ruff"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uvx --from ruff==0.14.8 ruff check --cache-dir .ruff_cache --force-exclude web/bridge.py pybuild/setup.py qt/make_demo.py typings {{.CLI_ARGS}}

  lint:
    desc: "lint Rust (host + wasm32) and Python workspace"
    cmds:
      # The host pass keeps the native-test surface clean without rebuilding the
      # intentionally unsupported desktop binary.
      - cargo lint --workspace --all-features --lib --tests {{.CLI_ARGS}}
      # wasm32 is the real app target — the bridge/UI entrypoint live here.
      - cargo lint --workspace --all-features --target wasm32-unknown-unknown --lib {{.CLI_ARGS}}
      - task: lint:ast-grep
      - task: lint:py

  lint:fc:
    desc: "lint Rust (all feature combinations, host + wasm32) and Python workspace"
    cmds:
      - cargo fc clippy --workspace --lib --tests --no-deps {{.CLI_ARGS}}
      # Same feature matrix on wasm32 — catches wasm-only code (the bridge/UI)
      # that the host pass never compiles.
      - cargo fc clippy --workspace --target wasm32-unknown-unknown --lib --no-deps {{.CLI_ARGS}}
      # The fc matrix excludes `threads` (it still needs build-std); compile-
      # check that build separately so the real threaded path cannot rot.
      - task: check:threads
      - task: lint:ast-grep
      - task: lint:py

  lint:fix:
    desc: "lint and fix cargo workspace"
    aliases: [fix]
    cmds:
      - cargo fixit --workspace --all-features --lib --tests {{.CLI_ARGS}}
      - task: lint:ast-grep

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  pyodide:build-pthread:
    desc: "EXPERIMENTAL: build a pthread-enabled Pyodide in Docker (see docker/pyodide-pthread/README.md)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/build.sh

  pyodide:smoke-pthread:
    desc: "EXPERIMENTAL: threaded-C-ext smoke test for the pthread Pyodide (needs build-pthread first)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/smoke/run.sh

  pyodide:bench-pthread:
    desc: "EXPERIMENTAL: benchmark real pyrocko parstack OpenMP speedup in the pthread Pyodide"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/bench/run.sh
