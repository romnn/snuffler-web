# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    cmds:
      - task: serve

  fetch:pyrocko:
    desc: "clone pyrocko at the pinned commit into sources/ (gitignored)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - mise exec -- ./pybuild/fetch-pyrocko.sh

  build:examples:
    desc: "pack examples/ into the dataset bundles the app fetches on demand"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - python3 scripts/build-examples.py {{.CLI_ARGS}}

  # Trunk canonicalizes every ignored watch path when its watcher starts and
  # aborts if one is missing.
  # `trunk build` never resolves the list, which is why CI does not hit this.
  # The Pyodide builder creates this scratch tree only after it has run locally.
  internal:dev-dirs:
    internal: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - mkdir -p docker/pyodide-mt/.work

  pyodide:build:
    desc: "build the custom threaded Pyodide 314 in Docker (about an hour)"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    cmds:
      - docker/pyodide-mt/build-all.sh

  # Pages publishes exactly the runtime directory assembled by stage-web.sh, so
  # local development can download it instead of rebuilding Pyodide for an hour.
  pyodide:fetch:
    desc: "download the deployed Pyodide 314 runtime"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-mt/fetch-web.sh

  # The threaded egui build runs heavy resvg export on a wasm-bindgen-rayon pool.
  # The wasm atomics/link flags live in .cargo/config.toml.
  # Build-std stays scoped to these tasks because the precompiled wasm32 standard
  # library is single-threaded and host-native Cargo commands do not need it.
  # The post-build hook rewrites wasm-bindgen-rayon's worker import, which would
  # otherwise mismatch Trunk's subresource-integrity hash for that snippet.
  # The serve profile keeps release-grade codegen without ship-only fat LTO.
  # Task exports NO_COLOR=1 when color is disabled, but Trunk requires a literal
  # boolean, so each command overrides it at the process boundary.
  serve:
    desc: "run the optimized, threaded web app"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko", "internal:dev-dirs"]
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      TRUNK_BUILD_NO_SRI: "true"
    interactive: true
    cmds:
      - NO_COLOR=true trunk serve --config crates/snuffler-web-egui/Trunk.toml --cargo-profile serve --features threads {{.CLI_ARGS}}

  build:
    desc: "build the threaded web app for release"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      TRUNK_BUILD_NO_SRI: "true"
    cmds:
      - NO_COLOR=true trunk build --config crates/snuffler-web-egui/Trunk.toml --release --features threads {{.CLI_ARGS}}

  # Lean builds fetch SeisBench weights from SNUFFLER_ONNX_MODEL_BASE_URL.
  # SNUFFLER_EMBED_DATA must track `--no-default-features` because setting only
  # one makes the app request model files the build did not stage.
  serve:lean:
    desc: "run the web app without bundled SeisBench weights; requires SNUFFLER_ONNX_MODEL_BASE_URL"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko", "internal:dev-dirs"]
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      TRUNK_BUILD_NO_SRI: "true"
      SNUFFLER_EMBED_DATA: "0"
    interactive: true
    cmds:
      - NO_COLOR=true trunk serve --config crates/snuffler-web-egui/Trunk.toml --no-default-features --features gf,threads {{.CLI_ARGS}}

  build:lean:
    desc: "build the web app without bundled SeisBench weights; requires SNUFFLER_ONNX_MODEL_BASE_URL"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      TRUNK_BUILD_NO_SRI: "true"
      SNUFFLER_EMBED_DATA: "0"
    cmds:
      - NO_COLOR=true trunk build --config crates/snuffler-web-egui/Trunk.toml --release --no-default-features --features gf,threads {{.CLI_ARGS}}

  # The web image consumes the prebuilt Pyodide runtime rather than rebuilding
  # it, so changing that runtime only repeats its staging and compression layers.
  docker:build:
    desc: "build the snuffler-web and snuffler-proxy container images"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    preconditions:
      - sh: test -d docker/pyodide-mt/served
        msg: "docker/pyodide-mt/served is missing - run 'task pyodide:fetch' first"
    cmds:
      - docker build -f docker/web/Dockerfile -t snuffler-web .
      - docker build -f docker/proxy/Dockerfile -t snuffler-proxy .

  docker:serve:
    desc: "run the containerized stack on ports 17683 and 17684"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmds:
      - docker compose up

  snuffler:
    desc: "run the pinned native PyQt5 snuffler"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    cmds:
      - uv run --project qt snuffler {{.CLI_ARGS}}

  snuffler:example:
    desc: "open a repository example in the native PyQt5 snuffler"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    requires:
      vars: [EXAMPLE]
    preconditions:
      - sh: test -f "examples/{{.EXAMPLE}}/{{.EXAMPLE}}.mseed"
        msg: "unknown example: {{.EXAMPLE}}"
      - sh: test -f "examples/{{.EXAMPLE}}/catalog.yaml"
        msg: "example has no event catalog: {{.EXAMPLE}}"
      - sh: test -d "examples/{{.EXAMPLE}}/meta"
        msg: "example has no StationXML directory: {{.EXAMPLE}}"
    cmds:
      - uv run --project qt snuffler {{.CLI_ARGS}} --events "examples/{{.EXAMPLE}}/catalog.yaml" --stationxml "examples/{{.EXAMPLE}}/meta/*.xml" "examples/{{.EXAMPLE}}/{{.EXAMPLE}}.mseed"

  # The same as snuffler:example, without a display: qt/driver.py then takes
  # commands such as `screenshot`, `menu` and `set` until it is told to `quit`.
  snuffler:headless:example:
    desc: "run the native snuffler headless on an example, driven by qt/driver.py"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    requires:
      vars: [EXAMPLE]
    preconditions:
      - sh: test -f "examples/{{.EXAMPLE}}/{{.EXAMPLE}}.mseed"
        msg: "unknown example: {{.EXAMPLE}}"
    cmds:
      - uv run --project qt python qt/driver.py serve -- --events "examples/{{.EXAMPLE}}/catalog.yaml" --stationxml "examples/{{.EXAMPLE}}/meta/*.xml" "examples/{{.EXAMPLE}}/{{.EXAMPLE}}.mseed"

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  check:
    desc: "check Rust, Python and TypeScript"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo c -p accesskit-dom -p egui-a11y -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      - task: check:threads
      - task: check:py
      - task: check:ts

  check:rust:
    desc: "check cargo workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo c -p accesskit-dom -p egui-a11y -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      - task: check:threads

  check:py:
    desc: "typecheck Python bridge"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - uv run python tests/codegen_missing_activity.py
      - uv run mypy {{.CLI_ARGS}}

  check:ts:
    desc: "typecheck the TypeScript bridge glue (incl. generated protobuf messages) and the browser test suites"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - bunx tsc --noEmit -p tsconfig.json
      # Separate project: the tests need node globals the browser-side bridge
      # code must not see (and they run at full strictness).
      - bunx tsc --noEmit -p tests/tsconfig.json
      # Pure and synchronous, so the cancellation state machine's transition
      # table is pinned on every check rather than only in browser suites.
      - bun tests/execution_control_validate.ts

  check:fc:
    desc: "check cargo workspace for all combinations of features"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo fc check --all-targets {{.CLI_ARGS}}
      - task: check:py

  check:threads:
    desc: "type-check the threaded wasm build (the `threads` feature, excluded from the fc matrix)"
    dir: "{{.ROOT_DIR}}"
    # The actual threaded wasm build still needs build-std so std is rebuilt with
    # atomics. This closes the gap left by the generic feature matrix.
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
    cmds:
      - cargo c -p snuffler-web-egui --target wasm32-unknown-unknown --features threads {{.CLI_ARGS}}

  clean:
    desc: "clean cargo workspace"
    cmds:
      - cargo clean {{.CLI_ARGS}}

  docs:
    desc: "open documentation preview"
    env:
      RUSTDOCFLAGS: "--cfg docsrs"
    cmds:
      - cargo watchdoc --all-features {{.CLI_ARGS}}

  outdated:
    desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
    cmds:
      - "cooldown outdated --sync {{.CLI_ARGS}}"

  outdated:minor:
    desc: "list outdated deps within the current major only"
    cmds:
      - "cooldown outdated --no-major --sync {{.CLI_ARGS}}"

  upgrade:
    desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
    aliases: [update]
    cmds:
      - "cooldown upgrade --major --sync {{.CLI_ARGS}}"

  upgrade:minor:
    desc: "upgrade all deps within their current major, within the cooldown"
    cmds:
      - "cooldown upgrade --no-major --sync {{.CLI_ARGS}}"

  upgrade:latest:
    desc: "upgrade ignoring the cooldown window — use deliberately"
    prompt:
      - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly
        compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
    cmds:
      - "cooldown upgrade --latest {{.CLI_ARGS}}"

  mise:upgrade:
    desc: "upgrade mise-managed tools and refresh the lockfile"
    env:
      # A fresh release is invisible for up to an hour behind mise's remote-versions cache
      # (fetch_remote_versions_cache = "1h"); upgrading is exactly when the listing must be live.
      MISE_FETCH_REMOTE_VERSIONS_CACHE: "0s"
      # mise resolves `latest` for GitHub tools through its hosted version index, which trails a
      # fresh release even with that cache off.
      # Asking GitHub directly lets an upgrade adopt a release the moment it is published.
      MISE_USE_VERSIONS_HOST: "0"
    cmds:
      - mise upgrade {{.CLI_ARGS}}
      - mise lock

  # Both delegate to the cargo aliases, which own the flag sets; see .cargo/config.toml.
  unused:
    desc: "check for unused cargo workspace dependencies by scanning sources (cargo-shear)"
    aliases: [unused-dependencies]
    cmds:
      - cargo unused {{.CLI_ARGS}}

  unused:deep:
    desc: "check for unused cargo workspace dependencies by compiling (cargo-udeps)"
    cmds:
      - cargo unused-deep {{.CLI_ARGS}}

  audit:
    desc: "audit cargo workspace dependencies"
    cmds:
      - cargo audit {{.CLI_ARGS}}

  format:
    desc: "format Rust, Python, JavaScript, and protobuf schemas"
    cmds:
      - task: format:rust
      - task: format:py
      - task: format:js
      - task: format:proto

  format:rust:
    desc: "format cargo workspace"
    cmds:
      - cargo fmt --all {{.CLI_ARGS}}

  format:py:
    desc: "format Python bridge code"
    cmds:
      - uv run ruff format --cache-dir .ruff_cache --force-exclude {{.CLI_ARGS}}

  format:js:
    desc: "format JavaScript bridge code"
    cmds:
      - bunx --bun prettier@3.6.2 --write --cache --cache-location node_modules/.cache/prettier/.prettier-cache web/bridge.ts web/bridge_worker.ts web/execution_control.ts web/worker_protocol.ts web/ort_worker.ts scripts/patch-trunk-loader.mjs tests/seisbench_browser_validate.ts tests/a11y_browser_validate.ts tests/parity/inventory_web.ts tests/parity/scenario_web.ts tests/parity/parity_browser.ts tests/parity/parity_keys.ts package.json {{.CLI_ARGS}}

  format:proto:
    desc: "format protobuf schemas"
    cmds:
      - buf format -w

  test:
    desc: "test cargo workspace"
    cmds:
      - cargo nextest run -p accesskit-dom -p egui-a11y -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests --no-tests "warn" {{.CLI_ARGS}}

  test:fc:
    desc: "test native support crates for all combinations of features"
    cmds:
      - cargo fc --no-targets nextest run -p accesskit-dom -p egui-a11y -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --lib --tests --no-tests "warn" {{.CLI_ARGS}}

  test:doc:
    desc: "run doctests in cargo workspace"
    cmds:
      - cargo test --doc --workspace {{.CLI_ARGS}}

  lint:boundaries:
    desc: "keep the shared Rust crates free of every UI toolkit, so any frontend can build on them"
    vars:
      # Toolkits and the windowing/GPU stacks under them. ecolor and emath are
      # plain colour and geometry types and stay allowed.
      TOOLKITS: "egui[a-z_-]*|eframe|epaint|winit|glow|glutin|wgpu[a-z_-]*|gpui|leptos[a-z_-]*"
    cmds:
      # accesskit-dom is a toolkit-agnostic AccessKit -> DOM adapter; only the
      # egui-a11y bridge may know about egui.
      # --target all: without it cargo tree resolves for the host only, which
      # would miss a toolkit dependency added under a wasm32 cfg section.
      - |
        for crate in snuffler-web-core snuffler-web-render accesskit-dom; do
          tree=$(cargo tree -p "$crate" -e normal --target all --prefix none) || exit 1
          found=$(printf '%s\n' "$tree" | rg -o "^({{.TOOLKITS}}) v" | sort -u)
          if [ -n "$found" ]; then
            echo "$crate must stay toolkit-free (adr/0005), but depends on: $found"
            exit 1
          fi
        done

  lint:py:
    desc: "lint Python bridge with ruff"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uv run ruff check --cache-dir .ruff_cache --force-exclude {{.CLI_ARGS}}

  test:seisbench:
    desc: "validate exported SeisBench ONNX models against pinned seisbench"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uv run --no-project --with seisbench==0.11.7 --with torch --with obspy --with onnxruntime --with numpy python tests/seisbench_validate.py {{.CLI_ARGS}}

  test:seisbench:browser:
    desc: "validate SeisBench inference in the served wasm app (requires http://127.0.0.1:17683 or SNUFFLER_BROWSER_URL)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun tests/seisbench_browser_validate.ts {{.CLI_ARGS}}

  test:a11y:browser:
    desc: "validate the accessibility overlay in the served wasm app (requires http://127.0.0.1:17683 or SNUFFLER_BROWSER_URL)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun tests/a11y_browser_validate.ts {{.CLI_ARGS}}

  # Parity against the original Qt snuffler. All three tiers run pyrocko built from
  # sources/ at the PYROCKO_REF pin rather than from PyPI, so the Qt side only moves
  # when the pin is deliberately bumped — and the pinned numpy keeps the corpus
  # generator's RNG stream fixed. See tests/parity/README.md.
  test:parity:
    desc: "tier 1 parity: Qt snuffler's own paint output vs web/bridge.py, plus the bridge snuffling tests; headless, no browser"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    env:
      QT_QPA_PLATFORM: offscreen
    cmds:
      # The harness self-test runs first: the tiers trust gaps.evaluate to hold
      # findings to the register, so its edge cases are proven before any scenario
      # relies on them.
      # CLI_ARGS is cleared for both, because it carries scenario names for the oracle.
      - task: test:parity:unit
        vars: { CLI_ARGS: "" }
      - task: test:parity:bridge
        vars: { CLI_ARGS: "" }
      - uv run --project qt --group parity python tests/parity/run_oracle.py --png {{.CLI_ARGS}}

  render:parity:tier1:
    desc: "render browserless Tier 1 web waveform artifacts from oracle output"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo run --quiet -p snuffler-web-render --example parity_artifacts -- {{.CLI_ARGS}}

  test:parity:unit:
    desc: "unit tests for the parity harness's own enforcement (gaps.evaluate, Register.load, the reload keep-list)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uv run --project qt --only-group parity python -m pytest -q tests/parity/test_gaps.py tests/parity/test_reload_keep.py {{.CLI_ARGS}}

  test:parity:bridge:
    desc: "bridge behaviour against real pyrocko, no browser: snuffling marker scope, aggregation, failure contracts, and the Adaptive visible length"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    cmds:
      - buf generate
      - uv run --project qt --group parity python -m pytest -q tests/parity/test_bridge_snufflings.py tests/parity/test_adaptive_visible_length.py tests/parity/test_view_span_order.py {{.CLI_ARGS}}

  test:parity:inventory:
    desc: "tier 2 parity: diff the two command surfaces (requires http://127.0.0.1:17683 or SNUFFLER_BROWSER_URL)"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    env:
      QT_QPA_PLATFORM: offscreen
    cmds:
      - uv run --project qt --group parity python tests/parity/run_inventory.py {{.CLI_ARGS}}

  test:parity:scenarios:
    desc: "tier 3 parity: one scenario through both GUIs (requires http://127.0.0.1:17683 or SNUFFLER_BROWSER_URL)"
    dir: "{{.ROOT_DIR}}"
    deps: ["fetch:pyrocko"]
    env:
      QT_QPA_PLATFORM: offscreen
    cmds:
      - buf generate
      - uv run --project qt --group parity python tests/parity/run_scenarios.py {{.CLI_ARGS}}

  lint:
    desc: "lint Rust (host + wasm32) and Python workspace"
    cmds:
      - cargo lint -p accesskit-dom -p egui-a11y -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      # wasm32 is the app target — the bridge/UI entrypoint lives here.
      - cargo lint -p snuffler-web-egui -p egui-a11y -p accesskit-dom --all-features --target wasm32-unknown-unknown --lib {{.CLI_ARGS}}
      - task: lint:boundaries
      - task: lint:py

  lint:fc:
    desc: "lint Rust (all feature combinations, host + wasm32) and Python workspace"
    cmds:
      # cargo-fc reads per-package targets from Cargo.toml: snuffler-web-egui is wasm
      # only; proxy crates are checked on Linux, macOS, and Windows GNU.
      - cargo fc lint --all-targets {{.CLI_ARGS}}
      - task: lint:boundaries
      # The fc matrix excludes `threads` (it still needs build-std); compile-
      # check that build separately so the real threaded path cannot rot.
      - task: check:threads
      - task: lint:py

  lint:fix:
    desc: "lint and fix cargo workspace"
    aliases: [fix]
    cmds:
      - cargo fixit -p accesskit-dom -p egui-a11y -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint
