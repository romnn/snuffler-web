# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The entry point: the checks and lints that span every language, and the
# taskfiles under tasks/, one per concern.
# Every include is flattened, so a task keeps its plain name (`task serve`,
# `task lint:charts`), and runs from the repository root.
includes:
  web: { taskfile: ./tasks/web.yaml, dir: ./, flatten: true }
  pyodide: { taskfile: ./tasks/pyodide.yaml, dir: ./, flatten: true }
  docker: { taskfile: ./tasks/docker.yaml, dir: ./, flatten: true }
  qt: { taskfile: ./tasks/qt.yaml, dir: ./, flatten: true }
  rust: { taskfile: ./tasks/rust.yaml, dir: ./, flatten: true }
  python: { taskfile: ./tasks/python.yaml, dir: ./, flatten: true }
  typescript: { taskfile: ./tasks/typescript.yaml, dir: ./, flatten: true }
  parity: { taskfile: ./tasks/parity.yaml, dir: ./, flatten: true }
  deps: { taskfile: ./tasks/deps.yaml, dir: ./, flatten: true }

vars:
  # Every crate that builds for the host.
  # snuffler-web-egui is wasm only, so the wasm tasks name it separately.
  # prettier-ignore
  HOST_CRATES: >-
    -p accesskit-dom
    -p egui-a11y
    -p snuffler-web-core
    -p snuffler-web-render
    -p snuffler-web-proto
    -p cors-proxy
    -p tcp-over-ws-proxy
    -p snuffler-web-proxy

tasks:
  default:
    cmds:
      - task: serve

  check:
    desc: "check Rust, Python and TypeScript"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: check:rust
      - task: check:py
      - task: check:ts

  lint:
    desc: "lint Rust (host + wasm32) and Python workspace"
    cmds:
      - cargo lint {{.HOST_CRATES}} --all-features --lib --tests {{.CLI_ARGS}}
      # wasm32 is the app's own target.
      # prettier-ignore
      - >
        cargo lint -p snuffler-web-egui -p egui-a11y -p accesskit-dom
        --all-features
        --target wasm32-unknown-unknown
        --lib
        {{.CLI_ARGS}}
      - task: lint:boundaries
      - task: lint:py

  # cargo-fc reads each crate's targets from its Cargo.toml: snuffler-web-egui
  # is wasm only, the proxies are checked for Linux, macOS and Windows.
  lint:fc:
    desc: "lint Rust (all feature combinations, host + wasm32) and Python workspace"
    cmds:
      - cargo fc lint --all-targets {{.CLI_ARGS}}
      - task: lint:boundaries
      - task: check:threads
      - task: lint:py

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  format:
    desc: "format Rust, Python, JavaScript, and protobuf schemas"
    cmds:
      - task: format:rust
      - task: format:py
      - task: format:js
      - task: format:proto

  format:proto:
    desc: "format protobuf schemas"
    cmds:
      - buf format -w
