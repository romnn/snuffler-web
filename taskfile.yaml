# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  default:
    cmds:
      - task: run

  run:
    desc: "run the web app (delegates to `mise run serve`)"
    ignore_error: true
    interactive: true
    cmds:
      - mise run serve

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  check:
    desc: "check Rust, Python and TypeScript"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo c -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      - task: check:threads
      - task: check:py
      - task: check:ts

  check:rust:
    desc: "check cargo workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo c -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      - task: check:threads

  check:py:
    desc: "typecheck Python bridge"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - uvx --from mypy==1.18.2 --with protobuf==7.34.1 --with types-protobuf==7.34.1.20260518 --with numpy==2.4.3 mypy {{.CLI_ARGS}}

  check:ts:
    desc: "typecheck the TypeScript bridge glue (incl. generated protobuf messages)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - buf generate
      - bunx tsc --noEmit -p tsconfig.json

  check:fc:
    desc: "check cargo workspace for all combinations of features"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo fc check --all-targets {{.CLI_ARGS}}
      - task: check:py

  check:threads:
    desc: "type-check the threaded wasm build (the `threads` feature, excluded from the fc matrix)"
    dir: "{{.ROOT_DIR}}"
    # The actual threaded wasm build still needs build-std so std is rebuilt with
    # atomics. This closes the gap left by the generic feature matrix.
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
    cmds:
      - cargo c -p snuffler-web-egui --target wasm32-unknown-unknown --features threads {{.CLI_ARGS}}

  clean:
    desc: "clean cargo workspace"
    cmds:
      - cargo clean {{.CLI_ARGS}}

  docs:
    desc: "open documentation preview"
    env:
      RUSTDOCFLAGS: "--cfg docsrs"
    cmds:
      - cargo watchdoc --all-features {{.CLI_ARGS}}

  outdated:
    desc: "check for outdated cargo workspace dependencies"
    cmds:
      - cargo outdated --workspace --ignore-external-rel --exit-code 1 -v {{.CLI_ARGS}}

  unused:
    desc: "check for unused cargo workspace dependencies"
    aliases: [unused-dependencies]
    cmds:
      - cargo +nightly fc udeps --maximal-features --all-targets {{.CLI_ARGS}}

  audit:
    desc: "audit cargo workspace dependencies"
    cmds:
      - cargo audit {{.CLI_ARGS}}

  format:
    desc: "format Rust, Python, JavaScript, and protobuf schemas"
    cmds:
      - task: format:rust
      - task: format:py
      - task: format:js
      - task: format:proto

  format:rust:
    desc: "format cargo workspace"
    cmds:
      - cargo fmt --all {{.CLI_ARGS}}

  format:py:
    desc: "format Python bridge code"
    cmds:
      - uvx --from ruff==0.14.8 ruff format --cache-dir .ruff_cache --force-exclude web/bridge.py web/seisbench_infer.py pybuild/export_seisbench_models.py pybuild/setup.py qt/make_demo.py tests/seisbench_validate.py typings {{.CLI_ARGS}}

  format:js:
    desc: "format JavaScript bridge code"
    cmds:
      - bunx --bun prettier@3.6.2 --write --cache --cache-location node_modules/.cache/prettier/.prettier-cache web/bridge.ts web/bridge_worker.ts web/ort_worker.ts scripts/patch-trunk-loader.mjs tests/seisbench_browser_validate.mjs package.json {{.CLI_ARGS}}

  format:proto:
    desc: "format protobuf schemas"
    cmds:
      - buf format -w

  test:
    desc: "test cargo workspace"
    cmds:
      - cargo nextest run -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests --no-tests "warn" {{.CLI_ARGS}}

  test:fc:
    desc: "test native support crates for all combinations of features"
    cmds:
      - cargo fc --no-targets nextest run -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --lib --tests --no-tests "warn" {{.CLI_ARGS}}

  test:doc:
    desc: "run doctests in cargo workspace"
    cmds:
      - cargo test --doc --workspace {{.CLI_ARGS}}

  lint:ast-grep:
    desc: "lint with ast-grep rules"
    cmds: []
      # - sg scan

  lint:boundaries:
    desc: "keep shared Rust crates independent from egui, eframe, and epaint"
    cmds:
      # --target all: without it cargo tree resolves for the host only, which
      # would miss a toolkit dependency added under a wasm32 cfg section.
      - 'if cargo tree -p snuffler-web-core -e normal --target all | rg -q "(^| )(egui|eframe|epaint) v"; then exit 1; fi'
      - 'if cargo tree -p snuffler-web-render -e normal --target all | rg -q "(^| )(egui|eframe|epaint) v"; then exit 1; fi'

  lint:py:
    desc: "lint Python bridge with ruff"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uvx --from ruff==0.14.8 ruff check --cache-dir .ruff_cache --force-exclude web/bridge.py web/seisbench_infer.py pybuild/export_seisbench_models.py pybuild/setup.py qt/make_demo.py tests/seisbench_validate.py typings {{.CLI_ARGS}}

  test:seisbench:
    desc: "validate exported SeisBench ONNX models against pinned seisbench"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - uv run --with seisbench==0.11.7 --with torch --with obspy --with onnxruntime --with numpy python tests/seisbench_validate.py {{.CLI_ARGS}}

  test:seisbench:browser:
    desc: "validate SeisBench inference in the served wasm app (requires http://127.0.0.1:17683 or SNUFFLER_BROWSER_URL)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun tests/seisbench_browser_validate.mjs {{.CLI_ARGS}}

  lint:
    desc: "lint Rust (host + wasm32) and Python workspace"
    cmds:
      - cargo lint -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      # wasm32 is the app target — the bridge/UI entrypoint lives here.
      - cargo lint -p snuffler-web-egui --all-features --target wasm32-unknown-unknown --lib {{.CLI_ARGS}}
      - task: lint:boundaries
      - task: lint:ast-grep
      - task: lint:py

  lint:fc:
    desc: "lint Rust (all feature combinations, host + wasm32) and Python workspace"
    cmds:
      # cargo-fc reads per-package targets from Cargo.toml: snuffler-web-egui is wasm
      # only; proxy crates are checked on Linux, macOS, and Windows GNU.
      - cargo fc clippy --all-targets --no-deps {{.CLI_ARGS}}
      - task: lint:boundaries
      # The fc matrix excludes `threads` (it still needs build-std); compile-
      # check that build separately so the real threaded path cannot rot.
      - task: check:threads
      - task: lint:ast-grep
      - task: lint:py

  lint:fix:
    desc: "lint and fix cargo workspace"
    aliases: [fix]
    cmds:
      - cargo fixit -p snuffler-web-core -p snuffler-web-render -p snuffler-web-proto -p snuffler-web-cors-proxy -p snuffler-web-tcp-ws-proxy -p snuffler-web-proxy --all-features --lib --tests {{.CLI_ARGS}}
      - task: lint:ast-grep

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  pyodide:build-pthread:
    desc: "EXPERIMENTAL: build a pthread-enabled Pyodide in Docker (see docker/pyodide-pthread/README.md)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/build.sh

  pyodide:smoke-pthread:
    desc: "EXPERIMENTAL: threaded-C-ext smoke test for the pthread Pyodide (needs build-pthread first)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/smoke/run.sh

  pyodide:bench-pthread:
    desc: "EXPERIMENTAL: benchmark real pyrocko parstack OpenMP speedup in the pthread Pyodide"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker/pyodide-pthread/bench/run.sh
