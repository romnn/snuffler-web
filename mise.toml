# Self-contained, reproducible toolchain.
# Mise installs dependencies; Task owns every repository workflow:
#
#   mise install                    # node, bun, uv, trunk, binaryen, protoc (pinned)
#   task fetch:pyrocko              # clone pyrocko (pinned) into sources/
#   task pyodide:fetch              # download the deployed Pyodide 314 into py-mt
#   task serve                      # trunk serve
#
# Pyrocko is NOT vendored: `task fetch:pyrocko` clones it at PYROCKO_REF into the
# gitignored sources/, pulled on demand by the relevant Task workflows.
#
# The Pyodide runtime is our CUSTOM threaded Pyodide 314 build (py3.14 /
# emscripten 5.0.3, pthread + OpenMP + SIMD), built in docker (docker/pyodide-mt)
# — NOT via a host emsdk or xbuildenv — and produced by build-all.sh. (A
# single-threaded wheel for a future non-threaded build is opt-in: BUILD_CDN=1.)
# Building it takes an hour and needs Docker, so `task pyodide:fetch` downloads the
# one Pages deploys instead.
# `task pyodide:build` is for changing the runtime itself.
# So mise here pins only the *web* tooling around Rust (trunk/binaryen for the
# wasm app, node/bun/uv for JS + the ruff/mypy tooling) plus buf + protoc — the
# Rust toolchain itself is pinned by rust-toolchain.toml.
[tools]
# Developer tools
task = "latest"          # The single workflow runner for local development and CI.
typos = "latest"
actionlint = "latest"
rg = "latest"            # `task lint:boundaries` greps the dependency tree
"github:romnn/cooldown" = { version = "latest", minimum_release_age = "0" }
"github:romnn/bumpversion" = { version = "latest", matching = "bumpversion", minimum_release_age = "0" }
"github:romnn/micromux" = { version = "latest", minimum_release_age = "0" }

# Web and Python tooling
# Host Python for the root uv tooling project.
# 3.14 matches the wasm
# interpreter (pyodide-lock's info.python), which docker/pyodide-mt/precompile.sh
# needs: bytecode magic numbers are fixed per minor version, so only a 3.14 host
# can emit .pyc the browser's interpreter accepts.
python = "3.14"
node = "24"
bun = "latest"           # bunx prettier (JS/markdown formatting)
uv = "latest"            # Project environments for Python tooling and the native Qt oracle.
"github:trunk-rs/trunk" = "0.21.14"
# binaryen/wasm-opt for the trunk post-build hook (see Trunk.toml). The
# emsdk-bundled wasm-opt is too old for the post-MVP wasm features modern rustc
# emits, so we pin a recent binaryen here for a reproducible build.
"aqua:WebAssembly/binaryen" = "130"

# Protobuf
buf = "latest"           # `buf generate` (trunk pre_build hook) — proto -> Rust + Python stubs
protoc = "34.1"          # libprotoc 34.1 -> protobuf-python 7.34.1 gencode, matching
                         # the runtime on both paths; the proto build script (prost) + buf generate use it

# Cargo plugins
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"github:romnn/cargo-feature-combinations" = { version = "latest", matching = "cargo-fc", minimum_release_age = "0" }  # provides `cargo fc`
"aqua:rustsec/rustsec/cargo-audit" = "latest"
"github:est31/cargo-udeps" = "latest"
"github:romnn/cargo-watchdoc" = { version = "latest", minimum_release_age = "0" }

# cargo-fc drives cargo-zigbuild for its non-host targets, with zig as the C toolchain
zig = "latest"
"github:rust-cross/cargo-zigbuild" = "latest"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[env]
# pyrocko source pin (not vendored — fetched on demand into gitignored sources/).
# Known-good commit on main: v2026.06.02-24-g64ae99fb (2026-06-12).
PYROCKO_REPO = "https://github.com/pyrocko/pyrocko.git"
PYROCKO_REF = "64ae99fb2c65fbd32836d83d00de05cf405a4ff9"
