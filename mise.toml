# Self-contained, reproducible toolchain. A new contributor needs only `mise`:
#
#   mise install                    # node, bun, uv, trunk, binaryen, protoc (pinned)
#   mise run fetch-pyrocko          # clone pyrocko (pinned) into sources/
#   docker/pyodide-mt/build-all.sh  # build the custom Pyodide 314 (both wheels + py-mt)
#   mise run serve                  # trunk serve
#
# pyrocko is NOT vendored: `fetch-pyrocko` clones it (pinned to PYROCKO_REF) into
# the gitignored sources/, pulled on demand by fetch-pyrocko/serve.
#
# The Pyodide runtime is our CUSTOM threaded Pyodide 314 build (py3.14 /
# emscripten 5.0.3, pthread + OpenMP + SIMD), built in docker (docker/pyodide-mt)
# — NOT via a host emsdk or xbuildenv — and produced by build-all.sh. (A
# single-threaded wheel for a future non-threaded build is opt-in: BUILD_CDN=1.)
# So mise here pins only the *web* tooling around Rust (trunk/binaryen for the
# wasm app, node/bun/uv for JS + the ruff/mypy tooling) plus buf + protoc — the
# Rust toolchain itself is pinned by rust-toolchain.toml.
[tools]
python = "3.12"          # host Python for the uvx-run tooling (ruff, mypy)
node = "24"
bun = "1.3.14"           # bunx prettier (JS/markdown formatting)
uv = "0.11.21"           # uv + uvx; uvx runs ruff/mypy + the mypy-protobuf Buf plugin
task = "3.51.1"          # go-task: the check:*/lint:* tasks in taskfile.yaml (CI runs them too)
zig = "0.15.2"           # cargo-zigbuild backend for cargo-fc cross-target checks
buf = "1.71.0"           # `buf generate` (trunk pre_build hook) — proto -> Rust + Python stubs
protoc = "34.1"          # libprotoc 34.1 -> protobuf-python 7.34.1 gencode, matching
                         # the runtime on both paths; build.rs (prost) + buf generate use it
"github:romnn/cargo-feature-combinations" = { version = "latest", matching = "cargo-fc", minimum_release_age = "0" }  # provides `cargo fc`
"github:trunk-rs/trunk" = "0.21.14"
# binaryen/wasm-opt for the trunk post-build hook (see Trunk.toml). The
# emsdk-bundled wasm-opt is too old for the post-MVP wasm features modern rustc
# emits, so we pin a recent binaryen here for a reproducible build.
"github:WebAssembly/binaryen" = "version_130"

[env]
# pyrocko source pin (not vendored — fetched on demand into gitignored sources/).
# Known-good commit on main: v2026.06.02-24-g64ae99fb (2026-06-12).
PYROCKO_REPO = "https://git.pyrocko.org/pyrocko/pyrocko.git"
PYROCKO_REF = "64ae99fb2c65fbd32836d83d00de05cf405a4ff9"

[tasks.fetch-pyrocko]
description = "Clone pyrocko at the pinned commit into sources/ (gitignored)"
run = "./pybuild/fetch-pyrocko.sh"

[tasks.build-pyodide]
description = "Build the custom threaded Pyodide 314 (py-mt; BUILD_CDN=1 also builds the single-threaded wheel)"
depends = ["fetch-pyrocko"]
run = "./docker/pyodide-mt/build-all.sh"

# The web app is built THREADED: the egui wasm runs the heavy resvg PNG export on
# a wasm-bindgen-rayon worker pool (the `threads` feature) so a big export never
# freezes the UI. The wasm atomics/link flags live in .cargo/config.toml. The only
# knob that must stay build-scoped here is `-Z build-std`: the precompiled wasm32
# std is single-threaded, so std is rebuilt with atomics, and build-std is global
# enough that we do not want it on every host-native cargo command.
# NO_SRI: the post_build hook rewrites wasm-bindgen-rayon's worker import (see
# Trunk.toml), which would otherwise mismatch Trunk's subresource-integrity hash
# for that snippet. SRI on a same-origin, self-hosted bundle adds little anyway.
[tasks.serve]
description = "Run the web app (trunk serve) — threaded (off-main-thread PNG export)"
depends = ["fetch-pyrocko"]
env.CARGO_UNSTABLE_BUILD_STD = "std,panic_abort"
env.TRUNK_BUILD_NO_SRI = "true"
env.SNUFFLER_EMBED_DATA = "1"
env.NO_COLOR = "true"
run = "trunk serve --config crates/snuffler-web-egui/Trunk.toml --features threads"

[tasks.build]
description = "Build the web app for release — threaded (off-main-thread PNG export)"
depends = ["fetch-pyrocko"]
env.CARGO_UNSTABLE_BUILD_STD = "std,panic_abort"
env.TRUNK_BUILD_NO_SRI = "true"
env.SNUFFLER_EMBED_DATA = "1"
env.NO_COLOR = "true"
run = "trunk build --config crates/snuffler-web-egui/Trunk.toml --release --features threads"

# Lean builds do not bundle `web/assets/models/*.onnx`; set
# SNUFFLER_ONNX_MODEL_BASE_URL at build time to an HTTP directory containing the
# files named in web/assets/seisbench_models.json. bridge.py proxies those remote
# fetches through the local snuffler proxy when running on localhost.
[tasks.serve-lean]
description = "Run the web app without bundled SeisBench model weights; requires SNUFFLER_ONNX_MODEL_BASE_URL"
depends = ["fetch-pyrocko"]
env.CARGO_UNSTABLE_BUILD_STD = "std,panic_abort"
env.TRUNK_BUILD_NO_SRI = "true"
env.NO_COLOR = "true"
run = "trunk serve --config crates/snuffler-web-egui/Trunk.toml --no-default-features --features svg-raster,gf,threads"

[tasks.build-lean]
description = "Build the web app without bundled SeisBench model weights; requires SNUFFLER_ONNX_MODEL_BASE_URL"
depends = ["fetch-pyrocko"]
env.CARGO_UNSTABLE_BUILD_STD = "std,panic_abort"
env.TRUNK_BUILD_NO_SRI = "true"
env.NO_COLOR = "true"
run = "trunk build --config crates/snuffler-web-egui/Trunk.toml --release --no-default-features --features svg-raster,gf,threads"

# --- Qt frontend track: the ORIGINAL PyQt5 snuffler, streamed to the browser ---
# Fully independent of the egui frontend (own Docker image + port). Needs Docker.
# See qt/README.md and plan/qt-frontend-feasibility.md.
[tasks.qt-build]
description = "Build the snuffler-qt Docker image (original PyQt5 snuffler + noVNC)"
run = "docker build -t snuffler-qt qt"

[tasks.qt-serve]
description = "Run snuffler-qt -> open http://127.0.0.1:6080/vnc.html?autoconnect=true&resize=remote"
run = "docker run --rm --name snuffler-qt -p 6080:8080 -v \"$PWD/qt/make_demo.py:/opt/snuffler/make_demo.py:ro\" snuffler-qt"
