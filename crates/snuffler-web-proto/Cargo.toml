[package]
name = "snuffler-web-proto"
version.workspace = true
edition.workspace = true
publish = false
build = "build/main.rs"

[package.metadata.cargo-shear]
# Only the build script's submodules (build/activity.rs and build/client.rs) use
# these, and cargo-shear reads build/main.rs without following its `mod` items.
ignored = ["heck", "quote"]

[lints]
workspace = true

[dependencies]
prost = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
color-eyre = { workspace = true }

[build-dependencies]
color-eyre = { workspace = true }
heck = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
prost-build = { workspace = true }
prost-reflect = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
