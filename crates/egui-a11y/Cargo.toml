[package]
name = "egui-a11y"
version.workspace = true
authors = ["Roman Dahm <contact@romnn.com>"]
edition.workspace = true
description = "Web accessibility for egui: wires an egui app to the accesskit-dom projection"
# Independent of eframe: the app wires the runner's per-pass AccessKit update hook itself.
# Unpublished until the crate name and license are settled.
publish = false

[package.metadata.cargo-fc]
# `keys` (DOM key names -> egui events) and the live-region helpers are
# target-independent and unit-tested on the host; only `web` is wasm-only.
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
]

[lints]
workspace = true

[features]
default = []
metrics = ["accesskit-dom/metrics"]
tree-json = ["accesskit-dom/tree-json"]

[dependencies]
accesskit-dom = { path = "../accesskit-dom" }
egui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
