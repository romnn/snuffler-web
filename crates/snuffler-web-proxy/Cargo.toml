[package]
name = "snuffler-web-proxy"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "snuffler-web-proxy"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http2", "ws"] }
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true, features = [
    "http2",
    "rustls",
    "stream",
] }
snuffler-web-cors-proxy = { path = "../snuffler-web-cors-proxy" }
snuffler-web-tcp-ws-proxy = { path = "../snuffler-web-tcp-ws-proxy" }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
