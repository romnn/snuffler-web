<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>snuffler-web — seismic waveform inspector</title>

    <!-- Cross-origin isolation is always on. The app is a single threaded build:
         the egui wasm runs its PNG export on a wasm-bindgen-rayon worker pool and
         the Pyodide runtime is our py-mt (pthread + OpenMP + SIMD) build — both
         need SharedArrayBuffer, which requires COI. The coi-serviceworker shim
         uses COEP credentialless so the cross-origin map tiles + FDSN keep
         loading. There is no runtime toggle: a non-threaded build, if ever
         needed, is produced via the `threads` build-time feature and hosted on a
         separate path so the two never interfere. -->
    <!-- Not quiet: on a browser where isolation cannot be reached the shim's own
         messages ("perhaps due to private mode", "a secure context is required")
         are the only explanation there is, and it returns early, without ever
         registering, on engines that predate `crossOriginIsolated`. -->
    <script>
        (function () {
            window.coi = {
                coepCredentialless: function () { return true; },
                shouldRegister: function () { return true; },
                shouldDeregister: function () { return false; },
                quiet: false,
            };
        })();
    </script>
    <script src="coi-serviceworker.js"></script>

    <!-- the egui/eframe wasm binary. Trunk's built-in wasm-opt is off because it
         can't pass `-all` (needed for the post-MVP wasm features rustc emits);
         wasm-opt runs instead as a Trunk post-build hook with a mise-pinned
         binaryen (see Trunk.toml). -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <base data-trunk-public-url />
    <!-- pyrocko/snuffler boar mark, matching the favicon on pyrocko.org -->
    <link data-trunk rel="icon" href="assets/favicon.png" />
    <!-- same boar mark, copied verbatim for the loading-screen logo (<img> below) -->
    <link data-trunk rel="copy-file" href="assets/favicon.png" />

    <!-- runtime assets fetched by web/bridge.js (the py-mt Pyodide runtime +
         wheels are staged into py-mt/ by Trunk.toml's post_build hook) -->
    <!-- the Python bridge package; the worker fetches its modules one by one -->
    <link data-trunk rel="copy-dir" href="../../web/snuffler_bridge" data-target-path="snuffler_bridge" />
    <!-- SeisBench picker pre/post-processing; ONNX Runtime and model assets are
         staged by Trunk.toml post_build hooks. -->
    <link data-trunk rel="copy-file" href="../../web/seisbench_infer.py" />
    <!-- Python side of the worker's boot: defers pyrocko's module-scope scipy
         imports and reports import progress (imported before the bridge) -->
    <link data-trunk rel="copy-file" href="../../web/bootstrap.py" />
    <link data-trunk rel="copy-file" href="../../web/gen/bridge_worker.js" />
    <link data-trunk rel="copy-file" href="../../web/gen/ort_worker.js" />
    <!-- cross-origin isolation shim (configured by the script in <head>) -->
    <link data-trunk rel="copy-file" href="../../web/coi-serviceworker.js" />
    <link data-trunk rel="copy-dir" href="../../web/proto" data-target-path="proto" />
    <!-- Bird (2003) tectonic plate boundaries for the map overlay (pyrocko's own KML) -->
    <link data-trunk rel="copy-file"
        href="../../sources/pyrocko/src/gui/snuffler/snufflings/map/plates.kml" />
    <!-- cake earth models for theoretical arrivals (loaded by path, so no
         pyrocko data dir is needed in the minimal wheel); ~120 KB of .nd files
         staged into the Pyodide FS by ensureEarthModels in bridge.js -->
    <link data-trunk rel="copy-dir"
        href="../../sources/pyrocko/src/data/earthmodels" data-target-path="earthmodels" />

    <style>
        :root {
            --bg: #fafafa;
            --fg: #1c1e22;
            --muted: #6b7280;
            --track: #e6e8eb;
            --accent: #3465a4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181b;
                --fg: #e6e8ec;
                --muted: #9aa0a8;
                --track: #2c3036;
                --accent: #6aa3ff;
            }
        }

        html { touch-action: manipulation; }

        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
        }

        canvas {
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        #loading.done {
            opacity: 0;
        }

        #loading .panel {
            width: min(340px, 82vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        #loading .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 22px;
            user-select: none;
            -webkit-user-drag: none;
        }

        #loading .title {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--fg);
        }

        #loading .title span { color: var(--accent); }

        #loading .sub {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            margin-bottom: 26px;
        }

        #loading .bar {
            height: 6px;
            width: 100%;
            background: var(--track);
            border-radius: 999px;
            overflow: hidden;
        }

        #loading #bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        #loading .row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        #loading #pct {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--fg);
        }

        #unsupported {
            display: none;
            text-align: left;
            font-size: 13px;
            line-height: 1.5;
            color: var(--fg);
        }

        #unsupported strong {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        #unsupported code {
            font-size: 12px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <!-- the id is hardcoded in main.rs; keep them in sync -->
    <canvas id="the_canvas_id"></canvas>

    <div id="loading">
        <div class="panel">
            <img class="logo" src="favicon.png" width="80" height="80" alt="pyrocko" />
            <div class="title">snuffler<span>-web</span></div>
            <div class="sub">seismic waveform inspector</div>
            <div class="bar"><div id="bar-fill"></div></div>
            <div class="row"><span id="pct">0%</span><span id="stage">starting…</span></div>
            <div id="unsupported"></div>
        </div>
    </div>

    <script>
        // What the app cannot run without, probed rather than inferred from a
        // version or a user-agent string.
        //
        // The blocking capability is WebAssembly SHARED MEMORY, not the
        // SharedArrayBuffer constructor: the app wasm is linked --shared-memory
        // --import-memory, so instantiating it needs a shared WebAssembly.Memory.
        // Chrome grants that on a non-isolated page while withholding the SAB
        // constructor (verified), so testing for SAB would report a failure on a
        // browser that runs the app fine. Test the memory itself.
        //
        // SIMD is checked too, but is not fatal here: it is the wheels that need
        // it (numpy/pyrocko are built -msimd128), so it fails later, while
        // packages install, rather than at wasm startup.
        const snufflerCapabilities = (function () {
            const sharedMemory = (function () {
                try {
                    return new WebAssembly.Memory({ initial: 1, maximum: 1, shared: true })
                        .buffer.byteLength > 0;
                } catch (_e) {
                    return false;
                }
            })();
            // Canonical wasm-feature-detect probe: a module returning v128.
            const simd = WebAssembly.validate(new Uint8Array([
                0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0,
                10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11,
            ]));
            return {
                sharedMemory,
                simd,
                // `undefined` (not false) on engines with no notion of isolation —
                // the case where coi-serviceworker gives up without registering.
                crossOriginIsolated: window.crossOriginIsolated,
                secureContext: window.isSecureContext,
                serviceWorker: !!navigator.serviceWorker,
            };
        })();
        console.log("[snuffler] capabilities", snufflerCapabilities);

        function snufflerMissing() {
            const missing = [];
            if (!snufflerCapabilities.sharedMemory) {
                missing.push(
                    "WebAssembly shared memory, which needs cross-origin isolation " +
                    "(Safari supports it from 15.2)"
                );
            }
            if (!snufflerCapabilities.simd) {
                missing.push("WebAssembly SIMD, which the numpy/pyrocko builds need " +
                    "(Safari supports it from 16.4)");
            }
            return missing;
        }

        // Replace the bar with what went wrong. Called from the loader when the wasm
        // fails to instantiate, which is the real, immediate signal — the engine tells
        // us outright, so nothing here has to be inferred from elapsed time.
        let snufflerFailureShown = false;
        window.__snufflerLoadFailed = function (error) {
            if (snufflerFailureShown) return;
            snufflerFailureShown = true;
            const missing = snufflerMissing();
            const el = document.getElementById("unsupported");
            if (!el) return;
            const bar = document.querySelector("#loading .bar");
            const row = document.querySelector("#loading .row");
            if (bar) bar.style.display = "none";
            if (row) row.style.display = "none";
            // Only blame the browser when a capability is actually absent; a failed
            // download reaches here too, and telling someone to update their OS over
            // a dropped request would send them off fixing the wrong thing.
            el.innerHTML =
                (missing.length
                    ? "<strong>This browser cannot run snuffler-web.</strong>" +
                      "It is missing " + missing.join(", and ") + "." +
                      "<br><br>On iPhone and iPad every browser uses the system WebKit, " +
                      "so updating iOS/iPadOS — or using a different device — is what " +
                      "changes this."
                    : "<strong>snuffler-web failed to start.</strong>" +
                      "The browser supports everything the app needs, so this is most " +
                      "likely a network or hosting problem. Reloading may fix it.") +
                "<br><br><code>" + String(error && error.message ? error.message : error) +
                "<br>" + JSON.stringify(snufflerCapabilities) + "</code>";
            el.style.display = "block";
            console.error("[snuffler] startup failed:", error, snufflerCapabilities);
        };

        // Backstop for a failure that never raises: a worker that silently refuses to
        // start, or a fetch that hangs. Only speaks up when a REQUIRED capability is
        // genuinely absent, so a slow connection is never mistaken for an unsupported
        // browser — and a page that is merely waiting to reload into isolation, which
        // is what coi-serviceworker does, gets the time to do it.
        const SNUFFLER_STALL_MS = 20000;
        let snufflerLastProgressMs = Date.now();
        setInterval(function () {
            if (snufflerFailureShown || snufflerLoadingFraction >= 1) return;
            if (Date.now() - snufflerLastProgressMs < SNUFFLER_STALL_MS) return;
            if (!snufflerMissing().length) return;
            window.__snufflerLoadFailed(new Error("stalled with no progress"));
        }, 2000);

        let snufflerLoadingFraction = 0;

        // Driven first by the patched Trunk loader, then by web/bridge.js as
        // Python + pyrocko load.
        window.__snufflerProgress = function (frac, label) {
            const requested = Math.max(0, Math.min(1, frac));
            if (requested > snufflerLoadingFraction) snufflerLastProgressMs = Date.now();
            snufflerLoadingFraction = Math.max(snufflerLoadingFraction, requested);
            const f = snufflerLoadingFraction;
            const fill = document.getElementById("bar-fill");
            const pct = document.getElementById("pct");
            const stage = document.getElementById("stage");
            if (fill) fill.style.width = (f * 100).toFixed(0) + "%";
            if (pct) pct.textContent = (f * 100).toFixed(0) + "%";
            if (stage && label) stage.textContent = label;
            if (f >= 1) {
                const el = document.getElementById("loading");
                if (el) {
                    el.classList.add("done");
                    el.setAttribute("aria-hidden", "true");
                    setTimeout(() => el.remove(), 450);
                }
            }
        };

        // Start the Pyodide worker HERE, not from web/bridge.js: bridge.js is
        // imported by the app wasm, so waiting for it would queue the ~47 MB
        // Python download behind the ~13 MB wasm download + instantiate. The
        // worker boots Python on module load (see web/bridge_worker.ts), so
        // creating it is enough; bridge.js adopts this instance and drains the
        // messages queued below, which are otherwise dropped for want of a
        // listener.
        //
        // Only when the page is ALREADY cross-origin isolated: without it the
        // pthread Pyodide cannot come up at all, and on the Pages deploy the
        // coi-serviceworker shim reloads the page to get there — so starting a
        // download now would just be thrown away by that reload.
        if (window.crossOriginIsolated) {
            const epoch = 0;
            const worker = new Worker(`bridge_worker.js?epoch=${epoch}`, { type: "module" });
            const queue = [];
            // A worker whose module script fails to load (404, syntax error)
            // reports it through `error`, not `message`; park that too, or the
            // failure is silent until bridge.js's five-minute boot deadline.
            const early = { worker, queue, epoch, failure: null };
            worker.onmessage = (event) => queue.push(event);
            worker.onerror = (event) => {
                early.failure = (event && event.message) || "the Python worker script failed to load";
            };
            window.__snufflerWorker = early;
        }
    </script>
</body>

</html>
