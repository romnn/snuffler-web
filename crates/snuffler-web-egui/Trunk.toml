[build]
dist = "../../dist"

# `trunk serve` (local dev) sets the cross-origin-isolation headers directly, so
# the page is COI from the first byte and the threaded Pyodide + wasm-bindgen-rayon
# get SharedArrayBuffer WITHOUT registering coi-serviceworker.js at all (it no-ops
# when the page is already isolated — it bails on `crossOriginIsolated !== false`).
# That keeps snuffler from adding its own service worker to the localhost origin,
# so it can't collide with another app's SW you've run on the same port. COEP
# credentialless keeps cross-origin map tiles + FDSN loading. Only affects
# `trunk serve`; the GitHub Pages build still relies on coi-serviceworker (Pages
# can't set response headers). NOTE: this does not evict a *foreign* SW that is
# already controlling the origin — so we also serve on a deliberately uncommon,
# snuffler-unique port (below) to avoid sharing the origin (and its service-worker
# namespace) with other dev servers in the first place.
#
# Port 17683: clear of the crowded dev range (3000-9100), below Linux's ephemeral
# outbound range (32768-60999) so it won't clash with OS-assigned ports either,
# not a registered service port — and mnemonic: 7683 = "SNUF" on a phone keypad.
# `Cache-Control: no-cache` means "always revalidate", not "never store": assets
# stay in the browser cache and a reload turns into cheap conditional requests
# answered with 304, which matters for the ~54 MB py-mt runtime.
#
# Without it, several assets served here have a STABLE url but build-specific
# contents — `snippets/.../workerHelpers.js` has the hashed wasm module name baked
# into it by scripts/trunk-post-build.sh, and bridge_worker.js, ort_worker.js and
# bridge.py are regenerated in place. Trunk sends no cache validators of its own,
# so the browser applies heuristic freshness and can reuse an old copy after a
# rebuild. That is not merely stale, it is inconsistent: wasm-bindgen-rayon hands
# each worker the WebAssembly.Module already compiled on the main thread, so a
# cached workerHelpers.js pointing at the previous build makes a worker link fresh
# wasm against a stale JS shim, and the pool dies with a LinkError naming whatever
# import was added last. Only affects `trunk serve`; the Pages build is unaffected.
[serve]
port = 17683
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "credentialless", "Cache-Control" = "no-cache" }

# The pre_build hooks below GENERATE code into the source tree (buf generate ->
# web/proto, bun build -> web/gen). trunk watches the project for changes, so
# without ignoring these, each build's own hook output is seen as a change and
# retriggers the build — an endless rebuild loop that never lets the page finish
# loading. Ignore only the generated output dirs; the .ts/.proto SOURCES
# (web/bridge*.ts / web/ort_worker.ts, proto/) stay watched, so real edits still
# rebuild + regenerate.
#
# docker/pyodide-mt/.work is the Pyodide builder's scratch tree: it churns for
# hours while build-all.sh runs, which would otherwise rebuild the app on every
# intermediate file it writes. Its output (served/) stays watched, so the
# post_build hook re-stages py-mt/ once the build lands.
[watch]
# Trunk's default watch covers only this crate's directory (plus asset inputs),
# so edits in the sibling workspace crates the wasm is built from — verified by
# touching accesskit-dom with the server healthy — never triggered a rebuild and
# the server kept serving stale wasm. List the app's actual inputs explicitly.
watch = [
    ".",
    "../accesskit-dom",
    "../egui-a11y",
    "../snuffler-web-core",
    "../snuffler-web-render",
    "../../web",
    "../../proto",
    # Dependency changes (e.g. bumping the egui fork pin) rebuild too; the lock
    # only changes on resolution changes, so this does not churn on plain builds.
    "../../Cargo.toml",
    "../../Cargo.lock",
]
ignore = [
    "../../web/gen",
    "../../web/proto",
    "../../docker/pyodide-mt/.work",
]

# Generate the protobuf code (web/proto) and bundle the TypeScript bridge glue
# with bun (pinned in mise) into self-contained ESM: web/bridge.ts ->
# web/gen/bridge.js (the wasm-bindgen module), web/bridge_worker.ts ->
# web/gen/bridge_worker.js, and web/ort_worker.ts -> web/gen/ort_worker.js. ONE
# hook, run in order: trunk runs multiple same-stage hooks CONCURRENTLY, and the
# bun build imports the generated *_pb.ts, so `buf generate` MUST finish first —
# separate hooks race (bun build ran before buf generate had written web/proto,
# failing CI). Each bundle is built separately so it stays fully self-contained
# (no shared chunks for the workers).
[[hooks]]
stage = "pre_build"
command = "bash"
command_arguments = [
    "-c",
    "set -eu; cd \"$TRUNK_SOURCE_DIR/../..\"; buf generate; bun build web/bridge.ts --outfile web/gen/bridge.js --format esm --target browser; bun build web/bridge_worker.ts --outfile web/gen/bridge_worker.js --format esm --target browser; bun build web/ort_worker.ts --outfile web/gen/ort_worker.js --format esm --target browser",
]

# The post-build work is kept in one ordered hook because Trunk runs multiple
# same-stage hooks concurrently. The script stages onnxruntime-web's WebGPU/JSEP
# runtime and the tiny SeisBench manifest, stages the model weights the default
# embed-data build fetches locally, optimizes the fresh app wasm from the staging
# directory, patches wasm-bindgen-rayon's worker import, and stages the optional
# threaded Pyodide runtime.
#
# wasm-opt runs as a post-build hook rather than Trunk's built-in pass: the
# edition-2024 rustc emits post-MVP WebAssembly features (bulk-memory, sign-ext,
# …) and wasm-opt must be told to accept them with `-all`, which Trunk's built-in
# invocation does not pass. binaryen is pinned via mise
# (aqua:WebAssembly/binaryen in mise.toml) for reproducibility, and invoked
# through `mise exec` because the emsdk-provided wasm-opt on PATH is far too old.
# `-Oz` optimizes the wasm for size (download size matters more than CPU here —
# all heavy computation runs in Pyodide). It runs for release builds only; the
# script skips it otherwise, since it is ~60s of pure latency in the serve watch
# loop for a size win nobody downloads over localhost.
#
# Point wasm-bindgen-rayon's worker at the real (hashed) main JS module. Its
# workerHelpers.js does `import('../../..')`, which assumes a wasm-pack `pkg/`
# layout where that resolves to the package's main module; under Trunk's flat,
# hashed layout it resolves to the site root (index.html) and the worker fails to
# load — so the rayon pool never comes up. We rewrite it to the actual
# `snuffler-web-<hash>.js`. No-op on the non-threaded build (no workerHelpers).
# The threaded build also passes --no-sri (see taskfile.yaml) so this edit doesn't
# trip Trunk's subresource-integrity hash for the snippet.
#
# The threaded Pyodide 314 runtime + wheels are staged into py-mt/ (loaded by
# web/bridge_worker.js, which has no other runtime to fall back to). This is a
# post-build copy rather than a `copy-dir` asset because the ~54 MB directory is a
# gitignored build artifact (docker/pyodide-mt/stage-web.sh) and so is absent on a
# fresh checkout — where the build still succeeds but the app cannot boot past
# "Downloading Python runtime…" until `task pyodide:fetch` has downloaded the
# deployed runtime (or build-all.sh has built one). The copy is skipped per file
# when unchanged, to keep rebuilds cheap.
[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = [
    "-c",
    "bash \"$TRUNK_SOURCE_DIR/../../scripts/trunk-post-build.sh\"",
]
