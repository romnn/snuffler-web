[build]
dist = "../../dist"

# `trunk serve` (local dev) sets the cross-origin-isolation headers directly, so
# the page is COI from the first byte and the threaded Pyodide + wasm-bindgen-rayon
# get SharedArrayBuffer without coi-serviceworker.js ever registering (it bails on
# `crossOriginIsolated !== false`).
# That keeps snuffler from adding its own service worker to the localhost origin,
# where it could collide with another app's service worker on the same port.
# COEP credentialless keeps cross-origin map tiles + FDSN loading.
# The GitHub Pages build still relies on coi-serviceworker, since Pages cannot set
# response headers.
# The headers do not evict a *foreign* service worker already controlling the
# origin, which plain `trunk serve` on 8000 can share with other dev servers.
# micromux avoids that: it serves each checkout at its own hostname, and passes the
# session's own port in TRUNK_SERVE_PORT, which wins over this one.
#
# `Cache-Control: no-cache` means "always revalidate", not "never store": assets
# stay in the browser cache and a reload turns into cheap conditional requests
# answered with 304, which matters for the ~54 MB py-mt runtime.
# Several assets have a stable URL but build-specific contents:
# `snippets/.../workerHelpers.js` has the hashed wasm module name baked into it by
# scripts/trunk-post-build.sh, and bridge_worker.js, ort_worker.js and the Python
# bridge package (web/snuffler_bridge/) are regenerated in place.
# Trunk sends no cache validators, so heuristic freshness could reuse an old copy
# after a rebuild; a stale workerHelpers.js then links fresh wasm against an old JS
# shim and the rayon pool dies with a LinkError.
[serve]
port = 8000
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "credentialless", "Cache-Control" = "no-cache" }

# The pre_build hook below generates code into the source tree (buf generate ->
# web/proto, bun build -> web/gen).
# Trunk watches the project, so without ignoring that output each build's own hook
# output would retrigger the build in an endless loop.
# Only the generated directories are ignored; the .ts/.proto sources stay watched,
# so real edits still rebuild and regenerate.
#
# docker/pyodide-mt/.work is the Pyodide builder's scratch tree: it churns for
# hours while build-all.sh runs, which would otherwise rebuild the app on every
# intermediate file it writes.
# Its output (served/) stays watched, so the post_build hook re-stages py-mt/ once
# the build lands.
[watch]
# Trunk's default watch covers only this crate's directory (plus asset inputs), so
# edits in the sibling workspace crates the wasm is built from would not rebuild.
# List the app's actual inputs explicitly.
watch = [
    ".",
    "../accesskit-dom",
    "../egui-a11y",
    "../snuffler-web-core",
    "../snuffler-web-render",
    "../../web",
    "../../proto",
    # Dependency changes (e.g. bumping the egui fork pin) rebuild too; the lock
    # only changes on resolution changes, so this does not churn on plain builds.
    "../../Cargo.toml",
    "../../Cargo.lock",
]
ignore = [
    "../../web/gen",
    "../../web/proto",
    "../../docker/pyodide-mt/.work",
]

# Generate the protobuf code (web/proto) and bundle the TypeScript bridge glue
# with bun (pinned in mise) into self-contained ESM: web/bridge.ts ->
# web/gen/bridge.js (the wasm-bindgen module), web/bridge_worker.ts ->
# web/gen/bridge_worker.js, and web/ort_worker.ts -> web/gen/ort_worker.js.
# One hook, run in order: Trunk runs same-stage hooks concurrently, and the bun
# build imports the generated *_pb.ts, so `buf generate` must finish first.
# Each bundle is built separately so it stays fully self-contained (no shared
# chunks for the workers).
[[hooks]]
stage = "pre_build"
command = "bash"
command_arguments = [
    "-c",
    '''
set -eu
cd "$TRUNK_SOURCE_DIR/../.."
buf generate
bun build web/bridge.ts --outfile web/gen/bridge.js --format esm --target browser
bun build web/bridge_worker.ts --outfile web/gen/bridge_worker.js --format esm --target browser
bun build web/ort_worker.ts --outfile web/gen/ort_worker.js --format esm --target browser
''',
]

# The post-build work is kept in one ordered hook, because Trunk runs multiple
# same-stage hooks concurrently.
# The script, in order:
#
# - stages onnxruntime-web's WebGPU/JSEP runtime and the tiny SeisBench manifest;
# - stages the model weights the default embed-data build fetches locally;
# - optimizes the fresh app wasm from the staging directory;
# - patches wasm-bindgen-rayon's worker import;
# - stages the optional threaded Pyodide runtime.
#
# wasm-opt runs here rather than as Trunk's built-in pass.
# The edition-2024 rustc emits post-MVP WebAssembly features (bulk-memory,
# sign-ext, …), and wasm-opt must be told to accept them with `-all`, which
# Trunk's built-in invocation does not pass.
# binaryen is pinned via mise (aqua:WebAssembly/binaryen in mise.toml), and invoked
# through `mise exec` because the emsdk-provided wasm-opt on PATH is far too old.
# `-Oz` optimizes for size: download size matters more than CPU here, since all
# heavy computation runs in Pyodide.
# It runs for release builds only, since it is ~60s of pure latency in the serve
# watch loop for a size win nobody downloads over localhost.
#
# The worker patch points wasm-bindgen-rayon's worker at the real (hashed) main JS
# module.
# Its workerHelpers.js does `import('../../..')`, which assumes a wasm-pack `pkg/`
# layout where that resolves to the package's main module.
# Under Trunk's flat, hashed layout it resolves to the site root (index.html), the
# worker fails to load, and the rayon pool never comes up.
# The hook rewrites it to the actual `snuffler-web-<hash>.js`, and is a no-op on
# the non-threaded build (no workerHelpers).
# The threaded build also passes --no-sri (see tasks/web.yaml), so this edit does
# not trip Trunk's subresource-integrity hash for the snippet.
#
# The threaded Pyodide 314 runtime and wheels are staged into py-mt/, loaded by
# web/bridge_worker.js, which has no other runtime to fall back to.
# This is a post-build copy rather than a `copy-dir` asset because the ~54 MB
# directory is a gitignored build artifact (docker/pyodide-mt/stage-web.sh).
# On a fresh checkout it is absent: the build still succeeds, but the app cannot
# boot past "Downloading Python runtime…" until `task pyodide:fetch` has
# downloaded the deployed runtime (or build-all.sh has built one).
# The copy is skipped per file when unchanged, to keep rebuilds cheap.
[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = [
    "-c",
    "bash \"$TRUNK_SOURCE_DIR/../../scripts/trunk-post-build.sh\"",
]
