[package]
name = "snuffler-web-core"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata.cargo-fc]
# The browser bridge is cfg-gated inside this crate, so dependency compilation
# through the egui package cannot lint its spawn and transport boundaries.
targets = { add = ["wasm32-unknown-unknown"] }

[lints]
workspace = true

[features]
default = ["gf", "embed-data"]
embed-data = []
gf = []

[dependencies]
ecolor = { workspace = true }
snuffler-web-proto = { path = "../snuffler-web-proto" }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
tracing = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
    # The ':' command line keeps its history in localStorage, the browser's
    # counterpart to snuffler's `$HOME/.pyrocko/.snuffler_history`.
    "Storage",
    "Window",
] }
