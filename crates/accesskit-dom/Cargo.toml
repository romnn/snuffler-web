[package]
name = "accesskit-dom"
version.workspace = true
authors = ["Roman Dahm <contact@romnn.com>"]
edition.workspace = true
description = "Project an AccessKit tree into live DOM elements: a web adapter for AccessKit"
# Free of egui/eframe (enforced by `task lint:boundaries`), so any AccessKit producer can
# drive it.
# Unpublished until the crate name and license are settled.
publish = false

[package.metadata.cargo-fc]
# The planning half is target-independent (and unit-tested on the host); only
# the DOM projection itself is wasm-only.
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
]

[lints]
workspace = true

[features]
default = []
# Per-pass timing and DOM write counters, exposed via `Adapter::stats`.
metrics = ["web-sys/Performance"]
# Publish each changed tree as JSON on a caller-chosen window global.
tree-json = []

[dependencies]
accesskit = "0.24"
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
thiserror.workspace = true

[dev-dependencies]
color-eyre.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "KeyboardEvent",
    "Node",
    "ResizeObserver",
    "Window",
] }
