# The local stack in containers: the site on http://127.0.0.1:8000 and the proxy on 9000.
#
# The browser reaches the proxy itself, at the address the site's config.js names
# (web/config.js documents it), so the two containers never talk to each other.
# Here that is the host's 9000, where the proxy is published.
#
#   docker compose up --build        # build both images from this checkout
#   docker compose up                # run the published images

services:
  web:
    image: ghcr.io/romnn/snuffler-web/web:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "127.0.0.1:8000:8080"
    read_only: true
    # nginx.conf keeps the pid and every temp path under /tmp precisely so the
    # rest of the filesystem can be mounted read-only.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    configs:
      - source: snuffler-config
        target: /usr/share/nginx/html/config.js

  proxy:
    image: ghcr.io/romnn/snuffler-web/proxy:latest
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "127.0.0.1:9000:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The proxy is allowlisted, not open: it always allows the FDSN endpoints and
    # SeedLink servers the app uses, and a deployment allows more here (or with an
    # `env_file`, see .env.example).
    # environment:
    #   SNUFFLER_PROXY_ALLOW_HTTP_TARGETS: "https://example.org/fdsnws/dataselect/1/query"
    #   SNUFFLER_PROXY_ALLOW_TCP_TARGETS: "example.org:18000"
    #   # Export traces, metrics and logs to an OpenTelemetry collector (OTLP gRPC).
    #   OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

configs:
  snuffler-config:
    content: |
      globalThis.snufflerConfig = {"proxyUrl": "http://127.0.0.1:9000/"};
