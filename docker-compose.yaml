# The local stack in containers: the site on 17683 and the proxy on 17684 — the
# same two ports micromux uses, so a browser pointed at http://127.0.0.1:17683
# behaves exactly as it does against `task serve`.
#
# The ports are not cosmetic. web/snuffler_bridge/fdsn.py only routes FDSN requests through the
# proxy when the page itself is on a localhost origin, and both it and
# snuffler-web-core hardcode 127.0.0.1:17684 as the proxy — which the BROWSER
# resolves, not the web container. So the proxy has to be published on the host's
# 17684 for /cors and /tcp to be reachable at all; the two containers never
# talk to each other.
#
#   docker compose up --build        # build both images from this checkout
#   docker compose up                # run the published images

services:
  web:
    image: ghcr.io/romnn/snuffler-web/web:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "127.0.0.1:17683:8080"
    read_only: true
    # nginx.conf keeps the pid and every temp path under /tmp precisely so the
    # rest of the filesystem can be mounted read-only.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  proxy:
    image: ghcr.io/romnn/snuffler-web/proxy:latest
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "127.0.0.1:17684:17684"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The proxy is allowlisted, not open: it always allows the FDSN endpoints and
    # SeedLink servers the app uses, and a deployment allows more here (or with an
    # `env_file`, see .env.example).
    # environment:
    #   SNUFFLER_PROXY_ALLOW_HTTP_TARGETS: "https://example.org/fdsnws/dataselect/1/query"
    #   SNUFFLER_PROXY_ALLOW_TCP_TARGETS: "example.org:18000"
