# Replaces the image's own nginx.conf for two reasons: a dynamic module can only
# be loaded from the main context, and the master process here runs as an
# unprivileged user, so every path nginx writes has to move somewhere it owns.

# Serves the .br files precompress.sh wrote next to each asset.
# The filter module is deliberately not loaded — everything this server
# compresses was compressed at build time.
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;

# No `user` directive: the container already runs as uid 101, and setting one
# only produces a warning that the master is not privileged enough to honour it.
pid /tmp/nginx.pid;

# Both are symlinks to /dev/stderr and /dev/stdout in the base image.
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # /var/cache/nginx is nginx-owned upstream, but keeping every scratch path in
    # one place makes "writes only to /tmp" a property you can check rather than
    # infer.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
