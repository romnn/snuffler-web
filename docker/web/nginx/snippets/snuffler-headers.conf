# Cross-origin isolation, which this app cannot run without: the egui frontend
# runs its PNG export on a wasm-bindgen-rayon pool and the Pyodide 314 runtime is
# a pthread build, so both want SharedArrayBuffer — and a browser only hands that
# to an isolated page. COEP `credentialless` rather than `require-corp` keeps the
# cross-origin map tiles and direct FDSN requests loading; it is the same mode
# web/coi-serviceworker.js asks for on GitHub Pages, which cannot set response
# headers at all. With these present the shim finds the page already isolated and
# returns without ever registering a service worker.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# Every response here is content-negotiated on Accept-Encoding, including the
# ones served as-is because no compressed variant was worth keeping. nginx marks
# only the compressed ones (gzip_vary), which would let a shared cache hand an
# identity copy to a client that could have had the brotli one — so `gzip_vary`
# is off in default.conf and the header is stated once, here, for all of them.
add_header Vary "Accept-Encoding" always;
