# snuffler-web is a static site, but not one a stock nginx serves correctly: it
# needs cross-origin isolation for SharedArrayBuffer (see snippets/), a MIME type
# for the ES modules the Pyodide loader imports, and a caching policy that
# distinguishes the content-hashed files from the many stable-named ones whose
# bytes change with every build.
#
# `add_header` does not merge across levels — a location that sets one drops the
# whole inherited set — so every location includes the shared header snippet
# rather than inheriting it from the server block.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # The image ships a .br and a .gz beside every asset that compresses (see
    # docker/web/precompress.sh), so the expensive payloads — the app wasm,
    # pyodide.asm.wasm, the example bundles — go out at `brotli -q 11` without
    # this server ever running a compressor. brotli_static is listed first
    # because nginx prefers it when the client accepts both, and br beats gzip on
    # every file here. Dynamic `gzip` stays on for what has no precompressed
    # variant at all — a generated response, or a file precompress.sh skipped or
    # found incompressible.
    brotli_static on;
    gzip_static on;
    gzip on;
    # Vary is set unconditionally in the header snippet instead; see the note there.
    gzip_vary off;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml application/xml;

    # Booting the app is ~40 requests into a 70 MB runtime directory, most of
    # them repeated by every worker; caching the open descriptors keeps that off
    # the filesystem.
    open_file_cache max=4096 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Trunk and wasm-bindgen hash these into their names, and the post-build hook
    # gives wasm-bindgen-rayon's worker helper a per-build name for the same
    # reason — so the URL changes whenever the bytes do and the response can be
    # cached for as long as a browser is willing to.
    location ~ "-[0-9a-f]{8,}(_bg)?\.(js|wasm|png)$" {
        include /etc/nginx/snippets/snuffler-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pyodide's loader is an ES module and nginx's mime.types has no mapping for
    # .mjs, so without this it goes out as application/octet-stream and the
    # browser refuses to execute it. An empty `types` block clears the inherited
    # map for this location so default_type is what applies.
    location ~ \.mjs$ {
        include /etc/nginx/snippets/snuffler-headers.conf;
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/snuffler-headers.conf;
        # "no-cache" is "always revalidate", not "never store". Much of the site
        # keeps a STABLE url while its contents change per build — index.html,
        # bridge.py, bridge_worker.js, pyodide-lock.json and the wheels beside it
        # — and a heuristically-fresh copy of one of those from a previous image
        # is worse than stale: wasm-bindgen-rayon hands each worker the module
        # already compiled on the main thread, so a mismatched pair dies with a
        # LinkError naming whichever import moved last. Revalidation answered
        # with a 304 costs almost nothing next to that.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
