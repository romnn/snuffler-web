# The SeisBench weights are float32 tensors, not text: typos decodes stretches of
# them as words and flags the ones that land near an English misspelling ("Yor"),
# which is unfixable by definition — the bytes are the model.
# The datasets under examples/ are checked-in real-world recordings, pinned by
# sha256 and shipped to users as bundles: their station codes ("NAST", "ACN"),
# equipment strings ("PTD25-10-VH") and the datacenter's own restriction keys
# (".SPACIFIC") read as misspellings and may not be corrected — the bytes are the
# dataset. Only the data is excluded; the prose beside it (example.toml, fetch.py,
# README.md) is ours to spell correctly.
[files]
ignore-files = true
extend-exclude = [
  "web/assets/models/*.onnx",
  "examples/*/meta/",
  "examples/*/*.mseed",
  "examples/*/catalog.yaml",
]

[default]
extend-ignore-re = [
  # "spellcheck:ignore-line" ignores the current line
  "(?Rm)^.*(#|//|--|<!--|/\\*)\\s*spellcheck:ignore-line(\\s*(-->|\\*/\\}?))?\\s*$",

  # "spellcheck:ignore-next-line" ignores the next line
  "(?Rm)^.*(#|//|--|<!--|/\\*)\\s*spellcheck:ignore-next-line.*?\\n.*?$",

  # "spellcheck:ignore-block" ignores all text in the following block (until the first empty line)
  "(?s)(#|//|--|<!--|/\\*)\\s*spellcheck:ignore-block(.*?)(?:(?:\\r*\\n){2})",

  # ignores any text within "spellcheck:ignore-start" and "spellcheck:ignore-end"
  "(?s)(#|//|--|<!--|/\\*)\\s*spellcheck:ignore-start.*?\\n.*?(#|//|--|<!--|/\\*)\\s*spellcheck:ignore-end",
]

[default.extend-words]
# numpy's np.arange is not a misspelling of "arrange".
arange = "arange"
# `.nd` is pyrocko's named-discontinuity earth-model file extension, not "and".
nd = "nd"
# "Pn" is a seismic body-wave phase name (cake travel times), not "On".
Pn = "Pn"
# "NED" is the north-east-down coordinate convention moment tensors use, not "need".
NED = "NED"
# `iy` is the y-axis loop index beside `ny` (scale-tick rows in paint.rs), the
# usual partner of an `ix`.
#
# Upstream's own misspellings — the `Symetric` menu label, the `set_symetry`
# method — are *not* listed here. They really are misspelled, and an entry would
# stop the checker seeing that spelling anywhere in the repo, including where
# someone meant to write it correctly; each is silenced at the line that quotes
# it with `spellcheck:ignore-line` instead.
iy = "iy"
