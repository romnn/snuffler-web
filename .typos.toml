# The SeisBench weights are float32 tensors, not text: typos decodes stretches of
# them as words and flags the ones that land near an English misspelling ("Yor"),
# which is unfixable by definition — the bytes are the model.
[files]
extend-exclude = ["web/assets/models/*.onnx"]

# numpy's np.arange is not a misspelling of "arrange".
[default.extend-words]
arange = "arange"
# `.nd` is pyrocko's named-discontinuity earth-model file extension, not "and".
nd = "nd"
# "Pn" is a seismic body-wave phase name (cake travel times), not "On".
Pn = "Pn"
# "NED" is the north-east-down coordinate convention moment tensors use, not "need".
NED = "NED"
