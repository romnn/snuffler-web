[workspace]
members = [
    "crates/snuffler-web-core",
    "crates/snuffler-web-cors-proxy",
    "crates/snuffler-web-egui",
    "crates/snuffler-web-proto",
    "crates/snuffler-web-proxy",
    "crates/snuffler-web-render",
    "crates/snuffler-web-tcp-ws-proxy",
]
resolver = "3"

[workspace.dependencies]
axum = "0.8.9"
bytes = "1"
clap = "4.6.1"
ecolor = "0.34"
egui = "0.34"
emath = "0.34"
futures-util = "0.3"
prost = "0.14"
prost-build = "0.14"
reqwest = { version = "0.13.4", default-features = false }
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[workspace.metadata.cargo-fc]
install_missing_targets = true
aggregate_targets = true
dedup = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
]

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true

[profile.release]
# Optimize for size: this is a render-only wasm frontend — all heavy computation
# runs in Pyodide — so a smaller download matters more than peak CPU throughput.
# Complementary to wasm-opt -Oz (the egui frontend's Trunk.toml): rustc/LLVM shrinks the codegen,
# wasm-opt does a further wasm-level size pass. Use "z" for an even smaller binary
# if the UI still feels smooth.
# opt-level = "s"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
# Warn-only: keep iteration fast during development; CI/review still adds the docs.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
# Every `#[allow(...)]` must carry a `reason = "..."` justifying the escape hatch.
allow_attributes_without_reason = "deny"

struct_excessive_bools = "allow"
