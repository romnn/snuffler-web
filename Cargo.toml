[workspace]
members = [
    "crates/accesskit-dom",
    "crates/cors-proxy",
    "crates/egui-a11y",
    "crates/snuffler-web-core",
    "crates/snuffler-web-egui",
    "crates/snuffler-web-proto",
    "crates/snuffler-web-proxy",
    "crates/snuffler-web-render",
    "crates/tcp-over-ws-proxy",
]
resolver = "3"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.lint]
# A warning on any target fails the lint run, while builds and tests keep warnings as warnings.
pedantic = true

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true

[workspace.package]
version = "0.0.3"
edition = "2024"

[profile.release]
# rustc optimizes for speed, because the canvas renderer runs every frame; the
# release build's wasm-opt -Oz pass (scripts/trunk-post-build.sh) then shrinks it.
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile `task serve` (and so micromux's "web" service) builds with: an
# unoptimized wasm frontend renders at 10-20 fps, while the released Pages build is
# smooth, so the dev server needs release-grade codegen too. It cannot just use
# `--release`: fat LTO in a single codegen unit costs minutes per relink, which the
# watch loop pays on every save, and `strip` throws away the symbols that make a
# panic in the browser console readable. Keep the optimization, drop the two
# release settings that only pay off for a shipped artifact.
[profile.serve]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = "none"
debug = "line-tables-only"
# They catch far more than they cost at opt-level 3.
debug-assertions = true
overflow-checks = true

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
# Warn-only: keep iteration fast during development; CI/review still adds the docs.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
# A module with submodules lives in foo/mod.rs, never foo.rs beside foo/.
self_named_module_files = "deny"
# Every `#[allow(...)]` must carry a `reason = "..."` justifying the escape hatch.
allow_attributes_without_reason = "deny"

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.dependencies]
axum = "0.8.9"
bytes = "1"
clap = "4.6.1"
color-eyre = "0.6"
dotenvy = "0.15"
ecolor = "0.34"
egui = "0.34"
emath = "0.34"
futures-util = "0.3"
heck = "0.5"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = "0.33"
prettyplease = "0.2"
proc-macro2 = "1"
prost = "0.14.4"
prost-build = "0.14.4"
prost-reflect = "0.16.5"
quote = "1"
reqwest = { version = "0.13.4", default-features = false }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
tower-http = "0.6"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
url = "2"

# Fork of emilk/egui at 0.34.3 (branch `web-accesskit`), adding the web-side
# AccessKit hook eframe's web backend is missing: upstream destructures
# `platform_output.accesskit_update` into `_` with the comment "not currently
# implemented", so the tree egui already builds never leaves the runner.
# Every egui-family crate has to be patched together — patching `eframe` alone
# would give it a git-`egui` distinct from the crates.io `egui` the render crates
# use, and the two `egui::Context` types would not unify.
# To iterate on the fork, point these at a local checkout instead
# (e.g. `path = "/Volumes/T7/dev/eframe/crates/eframe"`), and push + `cargo update`
# when done: Cargo.lock pins the branch's commit, not its tip.
[patch.crates-io]
ecolor = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
eframe = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
egui = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
egui-winit = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
egui_glow = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
emath = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
epaint = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
epaint_default_fonts = { git = "https://github.com/romnn/egui.git", branch = "web-accesskit" }
