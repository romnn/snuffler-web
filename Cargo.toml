[package]
name = "snuffler"
version = "0.1.0"
authors = ["Roman Dahm <contact@romnn.com>"]
edition = "2021"
include = ["LICENSE", "**/*.rs", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = [
    # Embed the default egui fonts.
    "default_fonts",
    # WebGL2/OpenGL backend — most reliable across browsers (incl. headless).
    "glow",
    # Native windowing backends (ignored on wasm; web uses winit's web backend).
    "x11",
    "wayland",
] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# web: the bridge to Pyodide lives in JS; we call it via wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 2     # fast and reasonably small wasm
lto = true        # whole-program optimization — smaller, faster wasm
codegen-units = 1 # better optimization at the cost of compile time
