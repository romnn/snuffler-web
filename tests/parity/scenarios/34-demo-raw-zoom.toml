name = "demo-raw-zoom"
title = "A 60 s window with nothing switched on"
dataset = "demo"
tiers = [1]

# start_s puts the window's largest sample four samples outside it, inside the
# +/- 4-sample chop margin both sides now take. With no filter there is no tpad, so
# this pins that the bare margin behaves identically — the control the filtered zoom
# scenarios lean on.
[window]
start_s = 207.0
length_s = 60.0

[compare]
reason = "that zooming alone needs no excuse: every other zoom scenario also turns something on"
