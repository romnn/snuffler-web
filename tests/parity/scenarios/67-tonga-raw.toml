name = "tonga-raw-full"
title = "A day of seismometers and barometers, every option off"
dataset = "tonga-2022-01-15-air-wave"
tiers = [1]

# Two things nothing else in the corpus has. The window is 22.5 hours, four times the
# longest span here, so each trace is 81000 samples reduced into 1200 pixels. And half
# the channels are LDO — a barometer, not a seismometer — which both sides have to
# treat as an ordinary trace: pressure counts riding on a large daily offset, where
# every other trace in the corpus wobbles around zero.

# Qt fetches nothing finer than `min_deltat_allow`, which it derives from the window
# and `visible_length` — at the default budget every trace here is too finely sampled
# for a window this long and Qt draws empty rows. That divergence is already what
# `oddrate-coarse-window` is for; repeating it here would only hide the data. So the
# budget is raised until Qt keeps every trace, and the scenario compares recordings
# rather than a fetch policy. It is a Qt-side knob: the web decimates whatever it has.
[state]
visible_length = 120000

[compare]
reason = "identical recorded bytes over the corpus's longest window, pressure channels included"
