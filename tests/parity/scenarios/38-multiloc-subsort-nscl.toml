name = "multiloc-subsort-nscl"
title = "Co-located sensors on a track each"
dataset = "multiloc"
tiers = [1]

# The same data under the ungrouped subsort, which is the control: `nscl` and
# `nsc_l` are the same four codes ordered the same way and differ only in whether
# the location joins the track key. Listing both here is what makes the grouped
# scenario mean something — the port once mapped them to the same thing.
[state]
subsort = "nscl"

[compare]
reason = "one row per location, ordered channel-major, as the ungrouped twin"
