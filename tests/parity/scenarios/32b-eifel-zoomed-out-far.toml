# (prepare_cutout2, pile_viewer.py:3597) declines every channel at this width, both
# fetches come back empty, and the trace boxes drawn from the pile are the only
# geometry left on screen. With 1061 overlapping traces this also exercises the
# >=500 batched drawbox branch (draw_trace_boxes, pile_viewer.py:3013).
[window]
start_s = -604800.0
length_s = 1209600.0

[compare]
reason = "an empty fetch is the point here: the boxes are the whole comparison"
