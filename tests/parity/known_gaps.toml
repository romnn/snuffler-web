One difference is kept: the togglers are checkboxes, where Qt's actions only ever
*show* a panel and leave `m` and `c` to hide it. That is pyrocko hand-wiring
(`toggle_panel(dockwidget, True)`, `snuffler_app.py:762`) rather than anything Qt
imposes, and a checkbox that says whether the panel is open beats an action that
does not.

Two harness blind spots remain and are recorded here rather than hidden:
`inventory_qt` builds a bare `PileViewer` with no panel parent, so Qt's real
togglers never exist on the Qt side of the tier-2 diff (the web's two show up as
web-only extras); and the menu bar's corner strip is skipped as a layout, so Qt's
`+`/`-`/`:` corner buttons are never compared — the web carries `:` with Qt's
tooltip, and the `+`/`-` keys plus the Track height slider cover the other two.
"""

[[manual]]
key = "snuffling-run-scope"
bucket = "soft"
title = "Snufflings run over selected marker spans through the shared pile chopper"
enforce = "a tier-3 scenario that places and selects a channel-scoped span marker, runs a snuffling, and runs it again — asserting the output honours the channel patterns and that the rerun replaced its predecessor; the `markers` check kind already exists and no browser scenario runs any snuffling yet, while `task test:parity:bridge` pins the channel scope and rerun contracts at the bridge level"
why = """
The request now carries the selected non-event markers — each span plus its channel
patterns, exactly Qt's `chopper_selected_traces` scope — and every built-in consumes
*both halves*, falling back to the visible window when nothing is selected. The
spans drive the chop and the channel patterns gate which traces participate:
per-span in the chopped iterators (minmax, STA/LTA, RMS, spectrogram, polarization,
the amplitude spectrum and SeisBench), and in Seismosizer as Qt's own conjunction — a
channel
yields a synthetic target only where a marker matches it *and* holds its data.
Minmax, the amplitude spectrum, STA/LTA, RMS, spectrogram and SeisBench chop through
`_chopper_selected_traces`, a port of Qt's iterator over the real
`pyrocko.pile.Pile` — degapping, `full_id` order and incomplete-window weeding
are pyrocko's own, not a reimplementation.
SeisBench runs Qt's 300-second
batches with one second of model padding plus `2/highpass` settling padding,
applies the main viewer's low/high-pass filters by default, and keeps only picks
inside each batch window, exactly the picker's own guard against padding
double-picking.
STA/LTA skips zero-length picks the way its `marker_selector` does; polarization
*requires* the selection, as Qt's does. Re-running a marker-producing snuffling
(Cake, STA/LTA, SeisBench, Seismosizer) replaces its previous markers through an
origin tag — Qt's `cleanup()` contract — while user picks and loaded files keep
accumulating; STA/LTA, RMS, SeisBench annotations and Seismosizer replace their
derived traces by identity (`_replace_derived`, which never resets file
provenance).
STA/LTA and RMS perform that cleanup before the first fallible chopper
or filter step, and every failure returns the cleaned scene.
Seismosizer commits nothing until every fallible step has passed: cleanup runs
before validation and retires both the prior traces and the event object that
origin inserted, but only while the registry still contains that exact object.
A catalog load, marker load or frontend edit may reuse the hash without donating
its replacement event to Seismosizer cleanup. The synthetics, replacement event and scene are stamped only
after the event and marker are fully built, so a run that dies anywhere, from a
damaged store to event conversion, returns the cleaned canonical event state and
scene with its origin tag, never with half a run's output or an invisible active
event.

SeisBench runs one inference pass per span over that span's channels, because an
envelope changed the output, not just the cost (the model saw, and picked in, the
data between disjoint markers).
RMS and
spectrogram likewise use one real pile-chopper stream per selected span, so blocks
and FFT windows crossing contiguous-file boundaries are degapped before processing.
"""

[[manual]]
key = "snuffling-control-surface"
bucket = "soft"
title = "The snuffling controls carry Qt's shapes and data-dependent corner bounds"
enforce = "a fourth tier-2 diff over the `snufflings` section — the Qt extractor already emits every Param, Switch and Choice with name, default, minimum, maximum and choices, and nothing consumes it"
why = """
Every `Param` whose minimum is above zero is a logarithmic control now, as Qt makes
them (`gui/util.py:512`) — the smoothing bandwidth, block lengths, windows and
ratios stopped cramming their useful range into three percent of slider travel. The
corner sliders cap at the loaded pile's Nyquist, so a corner the processing would
silently discard cannot be chosen. STA/LTA and polarization apply their own corners
as a 4th-order lowpass then highpass, like RMS always did — the main window's
filter implementation no longer changes what a snuffling computes. The polarization
panel's Length, Offset, Fix Scale and Show 3D Eigensystem all do what they say now,
and the Cake model combo carries Qt's "Cake builtin: " prefix.
The unified Seismosizer panel carries each Qt source panel's own bounds — the
extended ruptures bury the depth floor at the datum while the point sources go
100 km above it, MT magnitude runs −1…9 where DC and rectangular run 0…10, the
tensor diagonals range ±√2 against ±1 off-diagonals, a rectangular rupture caps
at 100 km against the pseudo-dynamic 300 km, and the STF duration ceiling is
50/100/20 s per source family.
Each source type also keeps its *own dial values*, stashed and restored on
every switch (`switch_source`), because Qt's five snufflings are independent
dock panels — an SF STF of 80 s must survive a peek at the DC panel instead of
being clamped to its 50 s ceiling, and MTSource first opens on Qt's own
magnitude default of 5.
The store and waveform-type choices stay shared across source types, unlike
Qt's per-snuffling copies; signed off — re-picking the store per source is
pure friction, and the choice carries no cross-source bounds to clamp by.

The filter-corner range follows the loaded sampling band on both sides: Nyquist
from the finest channel at the top and
`(0.5/deltatmax)·0.0001` from the coarsest channel at the bottom.
"""

[[manual]]
key = "snuffling-computations"
bucket = "soft"
title = "What the snufflings compute now matches snuffler, with three named residues"
enforce = "tier-1 `presence`/`tracks`/`samples` over derived traces for STA/LTA and RMS; tier-3 `markers` for Cake; no tier for the figures; `task test:parity:bridge` pins the minmax folding, the chopper adapter, polarization's windowing and the Seismosizer failure contract in CPython"
why = """
The divergences the audit listed are closed:

  * Cake raytraces the direct distance *and* the major arc (`360° − dist`), so
    PKP/SKS-type late arrivals appear; stations are Qt's set — one per distinct
    station entry (a borehole and a surface sensor are two) among traces with data
    within an hour of the event.
  * STA/LTA renames its level traces into location `cg` keeping the channel, adds
    the `.SUM.cg.` mean trace at the pile's finest sampling, pads its chops by the
    long window, and excludes every `tabu` trace — RMS output no longer feeds the
    detector. Seismosizer synthetics carry no `tabu` meta and stay in, exactly as
    they do under Qt's selector (stalta.py:165).
  * SeisBench infers on source data only: every `tabu` derived trace — an RMS
    curve, an STA/LTA level trace — is dropped before inference, as Qt drops
    them (seisbench_picker.py:257).
    The model input grid writes every fragment of a split channel at its
    offset, as seisbench's `stream_to_array` does — never just the last file.
  * Minimum/Maximum reports raw pile values (no rotation, no view passband), as
    Qt's does — the numbers describe the data, not the screen — folded through
    `trace.minmax` into one row per channel (minmax.py:49), so a channel split
    across files or picked by several markers never prints duplicate rows of
    local extrema.
  * Polarization chops the *raw* pile with only its channel pattern, as Qt does
    (polarization.py:300) — a hidden component still analyses, and a window not
    fully covered by data drops out. The windows come from the selected markers
    (Offset/Length applied), traces get the 3-per-corner-period settling pad,
    its own 4th-order filters below Nyquist, and the analysis-chop demean; all
    ten of Qt's component schemes resolve; the panels are labelled with the
    *rotated channel names* as Qt labels them (never a literal R/T); and the
    text mode rotates with the same matrix the figure draws with.
  * Spectrogram uses an absolute window grid with NaN gaps, Qt's `nt_max`/`nf_max`
    size guards with Qt's refusal message, one shared PSD colour scale with a
    colorbar, a formatted time axis, and the `2/twin` frequency floor.
  * The amplitude spectrum's axis statistics run over positive bins only — one
    flatlined channel no longer squashes every real spectrum.
  * Every snuffling consumes the pile's data, never the screen's: the GUI Rotate
    control is not applied (`chopper_selected_traces` explicitly does not respect
    it, snuffling.py:985), traces iterate in the chopper's `full_id` order
    (pile.py:1213) rather than the viewer's sort, and the `inview` scope selects
    *rows* through the gather key (pile_viewer.py:1798), so a grouped row
    contributes all its members.
  * RMS matched already.

Three residues, signed off: the selection markers Qt's polarization adds arrive
only from the run path — the figure rpc returns an image and has no marker channel;
2-component station groups are resolved by the scheme table but not drawn (the
hodogram triptych needs Z); and the spectrogram's colorbar is matplotlib's layout,
not Qt's smartplot frame chrome.
"""

[[manual]]
key = "snuffling-service-surfaces"
bucket = "soft"
title = "The service forms carry Qt's workflows, minus what CORS and GMT forbid"
enforce = "the same tier-2 `snufflings` diff, plus reading the controls of windows the inventory does not currently open"
why = """
Catalog search defaults to GEOFON with minimum magnitude 0 over 0-10, as Qt's does,
and the four GEOFON presets exist as one-click menu entries over the visible range.
The download window searches by radius around the active event's epicentre (Qt's
primary workflow), its station query runs at channel level with the location and
time span in the query — the rows carry per-location depths, feeding the borehole
table — and a Save trigger hands over the loaded waveforms as MiniSEED plus the
station table as a pyrocko station file, the two files Qt's Save writes. The map
hides blacklisted stations and shows selected event markers, falling back to events
in the visible time range; "Only active event" also limits stations to traces around
the active identity/time carried by that exact request.
Map responses are generation guarded, so a slow plate-boundary fetch cannot overwrite
a newer selection.
The Seismosizer offers all five of Qt's
sources — DC, MT, single-force, rectangular, pseudo-dynamic rupture — with Qt's
per-source parameter sets and bounds, four STF types, and target channels from
the traces actually present (codes `loc + '-syn'`, azimuth/dip for T/R/1/2
endings). SeisBench shows its thresholds, rescaling, annotation-trace and default
viewer-filter controls, as Qt does.

Signed off, with reasons:

  * Global-CMT and Saxony are HTML/text scrapes over endpoints without CORS; the
    native-catalog list stays FDSN-only.
  * SeisBench ships three model/weights exports (a build-size decision), its
    threshold defaults come from each export's calibration metadata rather than
    Qt's flat 0.3, and it runs on Run rather than live on every pile change — a
    WebGPU forward pass is not a keystroke-rate operation.
  * "Open in external browser" and the GMT map provider shell out to things a page
    cannot reach.
"""

[[manual]]
key = "data-loading-robustness"
bucket = "soft"
title = "Loading appends, accumulates, skips and reports the way snuffler does"
enforce = "tier-1 `presence`/`tracks` for the append and duplicate cases; a scenario feeding a malformed file for the error surfacing"
why = """
The load paths now follow snuffler's: the FDSN download appends to the pile
(`Pile.add_file` semantics, download.py:140); StationXML documents accumulate in
load order and resolve first-match (`station_xmls`, `pile_viewer.py:4470`); a
directory open hands every file to format detection with no extension pre-filter,
so SDS and day-file layouts load; one unreadable file in a multi-file open is
skipped rather than aborting the batch; a file already in the pile is refused by
content digest (the browser twin of Qt's absolute-path check, pile.py:1115); a
malformed marker file raises the parse failure like the station and event loaders
beside it; and the station-file picker takes any number of files in one gesture.
Save, picker and canonical-event failures use the recoverable diagnostic channel,
so they remain visible without disabling view fetches, snufflings or file watching.
File-handle reloads commit their new kind and mtime only after the matching loader
succeeds. Changed sources are processed independently into a typed batch: a later
failure cannot hide an earlier successful scene. Recoverable batch diagnostics are
separate from operational readiness, so the refreshed view is fetched and Watch
Files keeps retrying while the failure remains visible. The failure union preserves
browser reads, worker transport, protocol decoding and pyrocko exceptions as
distinct cases, including Python's traceback.
A source converging on another source's bytes retires its old traces,
bundle/waveform transitions replace the dataset in either direction, and a batch
open preserves bundle metadata even when later waveform files append to its scene.
Initial and reloaded bundles use one installer for their scene, event/station info,
requested view and dataset note.
Waveform, station and marker exports are decoded through the typed Rust client
before their successful bytes reach the DOM download helper. Python failures keep
their remote category and traceback; only the browser download step becomes a
browser error.
Digest membership is owner-counted, so a retired source cannot remove another source's
duplicate guard when it changes again. A source suppressed after converging on an
owned digest retains its parsed traces as lifecycle state; when the materialized
owner changes, the suppressed source is promoted immediately without waiting for
an mtime change that will never arrive.
Bundle members are fully parsed in an isolated dataset transaction.
Any waveform or metadata failure restores traces, provenance, stations, responses and
events together before the error returns.

One presentation difference is kept: Qt reports a partially-failed multi-open in a
dialog at the end (pile.py:502); the web logs the skipped names to the console and
raises only when *nothing* loaded. The scene travels back on the same call that
loads it, so failing a partially-successful open would discard the traces that did
load — the status line gets the all-failed case, the console the partial one.
"""

[[manual]]
key = "startup-and-persistence"
bucket = "soft"
title = "Query parameters stand in for the command line, localStorage for snuffler.pf"
enforce = "a fourth inventory section extracting Qt's optparse options against the web's query-parameter readers"
why = """
The URL is the browser's command line, and it now carries the pieces that have a
meaning here: `?url=` opens a waveform by URL (the positional-path twin), with
`?format=` naming its format the way `--format` does — pyrocko's sniffer knows ten
of its seventeen loadable formats, and this is how segy, seisan, kan, gcf and css
get in. `?example=` and `?demo=1` predate this entry.

Qt's user-editable settings persist too: the `SnufflerConfig` set (config.py:33) —
demean, the two scale annotations, the scaling mode, show boxes, clip traces, the
chosen visible length — is written to `localStorage` on change and applied over the
defaults at boot, one key per setting like a `.pf` line, beside the ':' command
history that already lived there. Qt persists the visible-length *table* (names and
values); the web's four entries are fixed, so the choice is what there is to keep.

The rest of the seventeen-option list stays deliberately unported:

  * `--pattern`, `--cache`, `--force-cache`, `--store-path` name filesystem paths a
    browser cannot read; no equivalent exists.
  * `--ntracks`, `--hptime`, `--disable-marker-sorting` tune what the web handles
    differently by construction: the shown track count follows the Track height
    slider, times are always f64, and the marker table always sorts.
  * `--follow N` lives on the Live SeedLink form now (see `live-acquisition`).
  * A format override for *local* picks does not exist in Qt either — its open
    dialog has no format chooser; `--format` is CLI-only, and `?format=` is the
    CLI's twin here.
  * The phase-key map is a fixed table (`PHASE_KEYS`); editing it would need UI
    Qt does not have either (Qt reads the map from the file, with no editor).
  * GF-store search paths are directory handles, which the browser grants only
    through a live picker gesture — they cannot be restored from storage.
"""

[[manual]]
key = "live-acquisition"
bucket = "soft"
title = "Follow mode yields to the user; the buffer is bounded, adjustable, and saveable"
enforce = "a view time range in the tier-3 snapshot for the follow suspension"
why = """
Following now suspends for 10 s after any interactive range change, re-armed on
every further change, exactly Qt's `interactive_range_change_delay_time`
(`pile_viewer.py:1253`, `:4235`); and the track scroll snaps only when a session
starts, not on every packet. The follow window and the retention bound are on the
Live SeedLink form (Qt's `--follow N`; Qt has no retention bound at all), and the
received buffer downloads as MiniSEED on demand.

Two differences are kept:

  * The web discards live data older than the Keep bound where Qt keeps
    everything. wasm32 has a single bounded heap; an unbounded live buffer is a
    real hazard, and the bound is now the user's number rather than a compiled-in
    one.
  * Starting a stream replaces the pile, where Qt mixes stream data into whatever
    is loaded. The retention trim runs over the whole pile — mixed with loaded
    files it would either chop the user's files (destructive) or exempt them and
    unbound the buffer — so the stream gets the pile to itself, and stopping it
    keeps the received samples for saving.

Qt's continuous write-to-disk with a configurable path has no browser equivalent —
silent writes to an arbitrary path are exactly what the sandbox exists to prevent;
the on-demand save is what the platform allows.
"""

[[manual]]
key = "network-reach"
bucket = "soft"
title = "Fewer reachable services than Qt, said plainly instead of reported as no data"
enforce = "a tier-2 control diff that compares combo box choices — the same extension `waterfall-colormap-set` needs"
why = """
A failed station, response or event query now surfaces as the error it is: only
204 and 404 — FDSN's own no-data codes — read as empty, and a 403 from the local
proxy's allowlist (the normal outcome for a custom base URL on localhost) retries
the host directly before failing, so a CORS-capable custom endpoint works the same
served locally and deployed. The Live SeedLink window states its limit — the
WebSocket tunnel exists only through the local proxy, so the deployed site cannot
stream — instead of leaving it to a connect error.

What stays narrower than Qt, deliberately:

  * Qt reaches thirty FDSN sites by abbreviation and any host by URL
    (`client/fdsn.py:47`); the direct list here carries the hosts verified to send
    CORS headers, plus the custom-URL field for any other host that does. A
    browser genuinely cannot fetch a host that does not.
  * The local proxy's allowlist matches the direct list rather than widening it:
    an open forwarder is a hazard, and a deployment that needs more reach names
    exact targets via `SNUFFLER_PROXY_ALLOW_HTTP_TARGETS` /
    `SNUFFLER_PROXY_ALLOW_TCP_TARGETS` rather than opening the default.
  * The SeedLink origin stays compiled-in: the localhost proxy is the only route a
    browser has to a raw-TCP SeedLink server, so a configurable origin would only
    offer places the connection cannot go.
"""

[[manual]]
key = "chromium-only-file-features"
bucket = "chromium-only"
title = "The File System Access commands say what they need instead of doing nothing"
enforce = "running the tier-2 inventory on more than one engine, or publishing a disabled state on the items"
why = """
`File ▸ Open waveform directory…` and `File ▸ Reload modified files` throw a named
error on engines without the File System Access API — the `addGfStore` pattern —
so Firefox and Safari get "this needs a Chromium-based browser" in the status line
instead of a silent `Ready`. The capability limit itself is real and stays
(`plan/native-gaps.md` bucket 3): there is no way to re-read a file from disk
without `showOpenFilePicker` handles.

Two residues are recorded rather than hidden: files that arrived by drag-and-drop
or the `<input type=file>` fallback register no handle, so Reload and Watch Files
legitimately skip them even on Chromium (a File snapshot has no disk identity to
re-read); and tier 2 runs one engine, so the inventory still cannot see an
engine-conditional gap — the enforce line names the fix.
"""

[[manual]]
key = "example-pile-contamination"
bucket = "soft"
title = "The first real data replaces the boot example instead of joining it"
enforce = "tier-1 `presence`/`tracks`, with a scenario that boots the app path rather than the oracle's empty pile"
why = """
The boot pile — the synthetic demo or a checksummed example bundle — is marked as
such in the bridge, and the first load that would append to it (File ▸ Open, the
directory open, drag-and-drop, an FDSN download) replaces it instead. The replaced
scene's context — events, station coordinates and instrument responses — goes
with its waveforms, because any of it surviving would sort the new data wrongly
or deconvolve an overlapping NSLC against the old dataset's response. The same rule
covers every scene replacement: switching example bundles no longer stacks each
bundle's stations and responses onto the last's, EmptyScene empties the metadata
too, and a live-stream reset starts clean. From then on every open path appends,
which is Qt's own behaviour (`open_waveforms`, `pile_viewer.py:1651`) — the
hazard was only ever the composition of append-on-open with a pre-seeded pile,
and the two open paths no longer disagree (drag-and-drop appends like the File
menu). `File ▸ Close all` wires the previously-dead `EmptyScene` rpc for the
blank viewer Qt boots into.

Two residues are kept, and named. Markers an example bundle delivered stay in
the marker list when its waveforms are replaced — markers are pile-independent
annotations on both sides, and Qt keeps loaded markers across an open too; Close
all clears them. And metadata loaded by hand *while the boot example is still
up* is treated as part of that scene, so replacing the example takes a
stationxml loaded over it along — per-source ownership of stations and
responses would preserve it, and is deliberately not built while every
user-owned load path appends.
"""

[[manual]]
key = "adaptive-visible-length-default"
bucket = "soft"
title = "The default visible length is this frontend's own 'Adaptive', which snuffler does not have"
enforce = "`tests/parity/test_adaptive_visible_length.py`, run with the tier-1 suite: it asserts the policy on both counts — a channel a fixed budget refuses is drawn under Adaptive, and the decimated payload keeps the extremes of the raw samples it replaced. What no tier can see is the *default*: tier 1 pins a Qt-comparable budget in every scenario (`scenario.DEFAULTS['visible_length']`, a float, which cannot spell Adaptive), and tier 3 does not snapshot the radio group."
why = """
Snuffler's Visible length is four fixed sample-count budgets, and the budget is
spent by *refusing channels*: `prepare_cutout2` turns the chosen `nmax` into
`min_deltat_allow` and does not fetch anything sampled finer than the window's
share of it (pile_viewer.py:3597). On a Qt desktop that is a reasonable trade —
the alternative is drawing a million samples into a 1500-pixel-wide track — and
the first entry, Short, is upstream's default.

Its cost is that widening the window makes data *disappear*: on the `tohoku`
example the three 100 Hz strong-motion channels go blank at the default budget
while the 20 Hz broadbands stay, which reads as missing data rather than as a
fetch policy. This port has a cheaper way out of the same trade, because its
canvas already tells the bridge how many bins it can draw (`npx`): fetch every
channel, and decimate what comes back to the min and max of each bin. The peak
inside a bin survives — which is the part that matters in a seismogram, and the
part plain subsampling loses — so the drawn trace is the one the raw samples
would have drawn. Verified: on `tohoku`, Adaptive and Short differ by ~1 % of
pixels on the channels both fetch, and Adaptive additionally draws the three
Short leaves blank.

So this frontend adds a fifth entry, Adaptive, and boots into it. Qt's four are
kept, unchanged and exact, next to it — the divergence is the *default*, not a
replacement, and picking any of the four puts the port back on snuffler's own
numbers.

This is signed off rather than open work. The reason it is written down anyway is
that it moves what the app shows out of the box, which is the loudest kind of
difference a user meets and the easiest kind to mistake for a bug in either
direction: a channel present here and absent in Qt is this entry, not a fetch
defect, and a channel absent here after someone picks Short is upstream's
behaviour faithfully reproduced, not a regression.
"""
