# Every intentional difference between Qt snuffler and the web port, and the
# reason it exists. This file is the single register: if the two behave the same,
# nothing is written down; if they differ, the difference either has an entry here
# or the suite fails. An entry is one of two things, and says which:
#
#   signed off   the difference is justified and stays. The `why` carries the
#                justification, and a difference really must have one — "free
#                choice" is not a reason to differ, it is a reason to match.
#
#   todo = true  open work: a difference or gap we intend to close, recorded here
#                so it is excused from the diff without being mistaken for a
#                decision. The `why` says what closing it takes.
#
# Four kinds of entry:
#
#   [[numeric]]  tier 1 — a place where the two pipelines legitimately compute
#                different numbers, because the browser cannot do what Qt does or
#                because the web port deliberately chose otherwise.
#
#   [[defect]]   tier 1 — a difference that is a *bug*, found by this suite and not
#                yet fixed. Not an excuse: a register, with the fix in the entry.
#                Scenarios naming a defect print as `bug` rather than `pass` and the
#                run lists every one that still reproduces.
#
#   [[feature]]  tier 2 — a command Qt has that the web does not. Anything present
#                in the Qt inventory, absent from the web inventory and absent here
#                fails the build.
#
#   [[manual]]   a difference no tier can currently observe, recorded so it is not
#                silent. `enforce` names the check that would observe it — required,
#                because the kind's whole promise is that an unobservable difference
#                still has a way out of that state. Nothing validates these against
#                reality yet, which is exactly why they are quarantined in their own
#                kind instead of rotting inside an enforced one.
#
# The line between [[manual]] and the enforced kinds is mechanical, not editorial:
# `evaluate` only ever looks at entries a scenario named in `expect_divergence`, so
# a [[numeric]] or [[defect]] entry nothing names would be inert — it would excuse
# no divergence and never go stale. A full tier-1 run fails on any such entry, which
# is what keeps "enforced" meaning enforced.
#
# `bucket` is the four-way split from plan/native-gaps.md: sandbox-hard,
# needs-a-server, chromium-only, soft.
#
# `checks` lists the tier-1 check kinds the entry accounts for; `strict` (default
# true) means the divergence must still reproduce, so an entry cannot rot into
# folklore about behaviour that has since changed. Set it false only when the *size*
# of the difference is data-dependent and can legitimately fall inside tolerance.
#
# An entry covering `samples` may also declare `residual = "constant"`: the excused
# divergence must then *be* a per-segment constant offset — remove its mean and the
# remainder has to sit inside the scenario tolerance. That turns the excuse from
# "samples may differ" into "samples may differ by exactly this shape", so a second,
# unrelated sample defect cannot shelter behind the entry. Declare it whenever the
# divergence has a describable shape; an entry that cannot say what shape it excuses
# is masking everything in the checks it claims.
#
# `subjects.<kind>` narrows the excuse for one check kind to the findings whose
# subject (the dotted nslc, mostly) matches one of its glob patterns, so a
# divergence that lives on named channels stops excusing every other channel's, and
# a strict entry has to keep reproducing *inside* its scope. Kinds left out of
# `subjects` stay kind-wide — the right choice where subjects are structural
# (`presence` has one finding, `tracks` has `count` and `order`) or where the
# divergence genuinely touches every channel. Declare it whenever the entry's `why`
# can say which channels carry the difference.

[[manual]]
key = "vertical-leg-follows-qt"
bucket = "hard"
title = "The 3D vertical leg is snuffler's, which is not the honest one"
enforce = "`qt_oracle.assert_upstream_geometry`, run before every tier-1 scenario: it computes `set_event_relative_data` on a station with both an elevation and a borehole depth and fails if upstream stops forming the vertical leg as `event.depth - station.depth`"
why = """
`Station.set_event_relative_data` forms the vertical leg as `event.depth -
station.depth` (`station.py:184`) — the station's borehole depth, with its elevation
dropped. A station 1.7 km up a mountain is measured as though it stood at sea level.
The geometrically honest term is `event.depth + station.elevation - station.depth`,
and snuffler does not write it.

`bridge._sort_distance` now writes snuffler's version, deliberately. It used to write
`event_depth + station_elevation` — the mirror-image mistake, dropping the borehole
instead of the mountain — and the two disagreed by 11 to 119 m on the GSN stations of
`bonin-grouped-distance-3d`. Neither was defensible as *correct*; the difference was
which one this port is supposed to be. Parity with the Qt application is the claim
this whole suite makes, so the port follows snuffler into the error rather than
quietly diverging into a better answer nobody can check it against. Correcting the
formula is upstream's to make, and the fix belongs there for every pyrocko user at
once, not here for the browser build alone.

This is signed off rather than open work, so nothing here is waiting on a decision.
What it is waiting on is upstream *changing its mind*: the day pyrocko starts adding
the elevation, this port silently becomes the wrong one, and every distance sort
diverges by tens of metres with no test naming why. That is what `enforce` above
guards. The canary asserts the upstream formula directly rather than inferring it
from a scenario, so it fires on a `PYROCKO_REF` bump even if no scenario in the suite
happens to hold a station with both an elevation and a borehole — and it fails by
this key, pointing whoever bumped the pin at this paragraph.
"""

