# [[feature]] is the tier-2 allowlist proper: a command Qt offers that the web does
# not. Every entry has to keep matching something — one that stops applying fails the
# run as stale — so this list can only ever describe the present.

[[feature]]
qt = "File/Print"
bucket = "soft"
title = "No Print item: the only print a page can ask for is not the one Qt performs"
why = """
Qt's `File ▸ Print` opens a printer dialog and then re-paints the seismogram view
*alone*, laid out afresh at the printer's page size in landscape
(`pile_viewer.py:2846`). The one thing a page can do is `window.print()`, which hands
the browser the whole document at screen layout — menu bar, control strip, status line
and all — and there is no print stylesheet anywhere in this tree to narrow that down.

The port used to carry a `File ▸ Print…` item that called exactly that, so it wore Qt's
name over a materially different command. It is now removed rather than corrected, on
two counts. Every browser already binds Ctrl/Cmd+P and carries Print in its own menu, so
an item whose whole body is `window.print()` is a second name for host chrome the user
reaches anyway — and one that a menu-bar screenshot on paper makes look broken. And the
half Qt's command has that the host's does not — the seismogram view by itself, sized to
a page — is already a command here: `File ▸ Save image (SVG)…` renders the view and
nothing around it through `waveform::render_svg` (`app.rs:1050`), and printing that file
is one browser step away.

So this is signed off as a command deliberately not offered, not as one out of reach.
What stays open is the *shape* of that export — the web renders at the current waveform
rect where Qt sizes a fixed page canvas — and that is `export-geometry`, which since this
removal describes the SVG alone.
"""

[[feature]]
qt = "File/Close"
bucket = "soft"
title = "No 'close the viewer' command"
why = """
The tab is the window. There is nothing for a Close menu item to close that the
browser's own controls do not already close, and a page cannot close a tab it did not
open. The `q` shortcut that used to be carried "for muscle memory" is gone with it:
it was wired to `ViewportCommand::Close`, which eframe's web backend drops unhandled,
so the key was documented, bound and inert at once — and an inert key is worse than
an absent one. Neither `q` nor `x` is bound or listed in the help now.
"""

[[feature]]
qt = "q"
bucket = "soft"
title = "q is deliberately unbound"
why = """
Qt's `q` quits the viewer. A page cannot close a tab it did not open, and the
binding this port once carried "for muscle memory" was wired to
`ViewportCommand::Close`, which eframe's web backend drops unhandled — a key that
is documented, bound and inert at once. An inert key is worse than an absent one,
so neither `q` nor `x` is bound or listed in the help (see `File/Close`).
"""

[[feature]]
qt_prefix = "Snufflings/Run Snuffling/Get GEOFON Events"
bucket = "soft"
title = "The GEOFON presets query FDSN, not the eqinfo scrape"
why = """
The four one-click queries — all events, ≥ M 6, ≥ M 7, ≥ M 8 — are offered under
Snufflings ▸ Get GEOFON Events, over the visible time range, as Qt offers them. What
stays different is the transport: Qt's presets scrape `geofon.gfz.de/eqinfo/list.php`
(`client/geofon.py:60`), which answers no browser; the web queries GEOFON's own FDSN
event service. Same catalog, same events, different serialization — signed off as the
platform reality it is.
"""

[[feature]]
qt_prefix = "Help/Snuffling Help"
bucket = "soft"
title = "Snuffling Help is one indexed window, not one page per docstring"
why = """
Help ▸ Snuffling Help exists and describes every built-in. Qt renders each
snuffling's full docstring as its own help page; the web shows one window with a
written summary per snuffling — the bridge's snufflings are functions, not
docstring-carrying plugin classes, so there is no docstring to render. The panels
keep their inline descriptions and hover text as before. Signed off: the index the
menu owes the user is there, in the shape the architecture has.
"""

[[feature]]
qt_prefix = "<ctrl> + "
bucket = "soft"
title = "Ctrl+P has nothing to bind: Print is deliberately not offered"
why = """
Qt gives five File-menu commands accelerators. Four are bound here now, on Qt's own
chords: Open (Ctrl+O), Save markers (Ctrl+S), Save selected markers (Ctrl+Shift+S)
and Save image (Ctrl+E) — the letter dispatch gained the modifier guard Qt's
`key_event.text()` matching gives it for free, so a chord no longer runs the bare
letter's command. Ctrl+O and Ctrl+S shadow browser bindings, deliberately: egui
consumes the handled key, and snuffler muscle memory outweighs the host's
Open-file and Save-page on a page that is an application.

The fifth, Ctrl+P, stays unbound because its command does: Print is deliberately
not offered (see `File/Print`), and a chord bound to nothing would be the inert-key
mistake this register keeps refusing.
"""

[[feature]]
qt = "<f11>"
bucket = "soft"
title = "Full screen is on `f`, not F11"
why = """
Leaving F11 to the browser is right: the host owns that chord and fighting it would
shadow something the user expects. The trade is real now — `f` (and View ▸
Fullscreen) calls the browser's Fullscreen API on the document element, the one
path that works on the web, since eframe's `ViewportCommand::Fullscreen` lands in
an unhandled arm there. Documented on both sides.
"""

[[feature]]
qt = "x"
bucket = "soft"
title = "Neither `q` nor `x` closes anything, deliberately"
why = """
Qt's Close action carries two shortcuts, `q` and `x` (`pile_viewer.py:924`). A page
cannot close a tab it did not open, so there is nothing for either key to do here —
and the two were decided together: both unbound, both absent from the help. The
alternative the port used to ship, a `q` bound to a viewport command the web
backend drops, was a documented key that did nothing, which is strictly worse than
an absent one. See `File/Close` for the menu-item half of the same wall.
"""

# [[manual]] entries — differences no tier can observe yet; see the header. `enforce`
# names the check that would observe each one, which is the path out of this section.
# Three blind spots account for most of what follows, and closing any of them would
# graduate a whole group at once:
#
#   * tier 2 diffs menu, control and key *names*. It never compares a combo box's
#     option set, a control's range, a menu item's enabled or checked state, or the
#     `snufflings` section its own Qt extractor already emits in full.
#   * tier 3 snapshots menu checkables, four control values and marker identity. It
#     does not carry the view time range, the track order, marker placement, or any
#     state belonging to a window it did not open.
#   * no tier compares rendering, by design — so anything whose only symptom is what
#     is drawn lands here even when it changes information rather than appearance.

[[manual]]
key = "waterfall-colormap-set"
bucket = "soft"
title = "The Reverse toggle inverts the value where snuffler renames the colormap"
enforce = "a tier-2 control diff that compares combo box choices, not just names"
why = """
The colormap set is snuffler's exact nine now — viridis, plasma, magma, binary,
Reds, copper, seismic, RdBu and YlGn, in snuffler's own order
(`ColorbarControl.AVAILABLE_CMAPS`, gui/util.py:651) — sampled from matplotlib by
name, so the colours are byte-identical.

What stays different, signed off, is the Reverse mechanism: Qt appends `_r` to the
colormap *name* (`gui/util.py:768`), leaving its combo showing the un-reversed one,
where the web keeps an orthogonal flag and inverts the normalized value. Same
image either way, and Qt's version has a bug worth not copying — it strips with
`cmap.rstrip('_r')`, which turns `copper_r` into `coppe`.
"""

[[manual]]
key = "color-traces-theming"
bucket = "soft"
title = "Trace coloring: snuffler's own under the Qt theme, this frontend's under its own"
enforce = "nothing — no tier compares rendering; the palette, key and numbering halves are pinned by paint.rs unit tests"
why = """
In Qt, Color Traces recolors the wiggle strokes from `graph_colors`, numbered over
the sorted distinct values of the subsort's coloring key (`color_lookup` over
`pile.gather_keys`, `pile_viewer.py:3467`). Under the **Snuffler Qt** theme the web
now does all of that: the per-subsort keys including CNSL's net+sta+loc composite,
the sorted-key numbering, snuffler's seven `graph_colors`, and snuffler's black past
the seventh key rather than a wrap. That theme also drops the empty-key fallback
below, because snuffler has none. All pinned by paint.rs unit tests.

The numbering base is snuffler's too: `ViewMeta.color_keys` carries
`pile.gather_keys(color)` — the whole pile, no trace filter — computed bridge-side,
so a key keeps its colour as the view scrolls or pages, exactly as in Qt. The old
behaviour numbered over the on-screen slice and recoloured the same station on every
scroll, which snuffler cannot do; that is gone on every theme.

Two deliberate departures remain, both belonging to the **Snuffler Web** themes, this
frontend's own, and both signed off. The six palettes are Fieldbook, Kiln, Fjord,
Daybreak, Herbarium and Afterglow; their pigment fitting and visual review follow
`adr/0001-wiggle-theme-design.md`. Each keeps a palette of its own — seven hues at
the lightness its canvas needs, since a colour legible on near-white is not legible on
near-black, and fitted to keep all 21 pairs distinct, since a coloring key that
lands on a neighbour's colour is a wrong statement about the data — and wraps it
rather than going black past the seventh key. And they fall
back to the per-track label when the coloring key is empty, so single-location data
stays varied where snuffler would paint every trace alike. They do not claim to be
snuffler; the Qt theme is where fidelity lives, and it is light-only for the reason
`qt-theme-residual-chrome` gives. The trace *boxes* are not a departure under any
theme: every palette colours a box by the pile's `determine_box_styles` index, exactly
as Qt's `box_styles[istyle % 7]` does, and only the seven colours differ.

The *default* follows the theme's `StrokePolicy`, and used to be a divergence in its
own right (`color-traces-default`, removed with the entry that excused it). Qt adds
the menu item without a `setChecked` (`pile_viewer.py:1076`), so upstream boots
monochrome strokes over colored trace boxes; the port booted colored under every
theme, which made the theme claiming fidelity the one place the difference showed.
`Color Traces` is now backed by an `Option<bool>` that follows the theme until the
user sets it: off under Snuffler Qt, on under the web themes built around coloured
strokes, and, for the mood themes that keep snuffler's grey wiggle, on exactly where
the trace boxes stop separating the traces — with the boxes hidden, or under a
location-grouped subsort where one box colour covers a whole row. Once the user
clicks it, their choice is honoured under every theme. The boxes-hidden half has no
counterpart upstream, because Qt's two toggles are independent there; it belongs to
the mood themes alone, which carry their palette in the boxes and so have nothing
left to carry it when the boxes go. Snuffler Qt keeps its grey wiggle with the boxes
off, as upstream does.

A location-grouped subsort is the exception to that: there several traces share one
row, the coloring key is the only thing telling them apart, and the box style cannot
stand in for it — the style steps per contiguous run, so every trace of the row starts
inside the same run and keying the strokes on it painted the whole row one colour.
Grouped rows therefore keep colouring by the key whether the boxes are drawn or not,
which is what Qt does with Color Traces on.

With the boxes hidden a web theme's coloured strokes also change *which* key they
are numbered by: the box style rather than the coloring key. The two carry different
classes — a box is `determine_box_styles`, a stroke is `gather_keys(color)` — and on
the single-location data most people open, every trace shares one coloring key, so
colouring by it would draw twelve identical wiggles and lose the row distinction the
boxes had been carrying. Taking the box style hands that exact class to the wiggle
instead, in the ink cut from the same hue as the box, so hiding the boxes restyles
the view without changing what it says. Snuffler has no counterpart because it never
recolours on Show Boxes. Pinned by paint.rs.

Show Boxes itself now follows the canvas until the user clicks it: on the light canvas
the boxes are drawn, on the dark one they are not. Snuffler has no dark canvas and
always draws them, so this is web-only by construction and cannot diverge on the
canvas snuffler owns. The reason is the same coupling the ink has: a tinted block on
white is a wash the wiggle reads straight through, while on near-black it must be dark
enough to stay behind the data, and a screen of them reads as banding. The user's own
click outranks it under either canvas and is what gets persisted — an untouched setting
is stored as absent rather than as its current value, so it keeps following the canvas
instead of freezing at whichever one happened to be showing when the settings were
first saved.

Tier 3 reads the boot checkbox and now sees the two agree — which is why nothing
excuses this any more.
"""

[[manual]]
key = "marker-palette-theming"
bucket = "soft"
title = "Marker kinds: Tango under the Qt theme, the same families in the web theme's own shades"
enforce = "nothing — no tier compares rendering; the family-per-kind, contrast and lit-is-lighter halves are pinned by paint.rs unit tests, and the Qt palette's `select_color` arithmetic by markers.rs"
why = """
Qt colours a marker by kind from `g_color_b` (marker.py:53): the Tango "3" shade
idle, the "2" shade when selected or alerted (`select_color`, marker.py:306). Under
the **Snuffler Qt** theme the web uses exactly those, on Qt's white label plate.

The **Snuffler Web** themes keep the contract and change the shades. Kind N is the
same colour
family on every theme — 0 red, 1 green, 2 blue, 3 orange, 4 purple, 5 brown,
6 yellow, 7 grey — fitted in OKLab at the Tango family's own hue angle, and a
selected marker still reads as selected by lifting to a lighter shade of its kind.
What moves is lightness: the Tango shades were built for white, and on the dark
canvas skyblue3 and plum3 sit below 2:1, while on the light canvas the lit
chameleon2 and butter2 sit below 2:1. The web shades hold 4.8:1 and up idle on
light and 6.3:1 and up idle on dark, and the label plate is the canvas colour rather
than white, so a light marker's label survives the dark canvas. The kind buttons in
the control strip and the table's symbol column take the same palette, so a kind
looks the same wherever it is named.
"""

[[manual]]
key = "qt-theme-residual-chrome"
bucket = "soft"
todo = true
title = "What the Snuffler Qt theme has been held against snuffler, and what has not"
enforce = "a pixel check on the wiggle canvas against a `qt_oracle` PNG of the same scenario — the oracle already renders one (`want_png`), and nothing yet diffs it. Until that exists the comparisons below are an agent reading the two PNGs side by side, which is what the screenshots are written for."
why = """
The Snuffler Qt theme is the one that claims fidelity, so what it still gets wrong
belongs written down rather than assumed cosmetic. Verified against rendered
`qt_oracle` PNGs of `bonin-subsort-grouped` and `demo-raw-full`.

**The canvas text is bold now, as snuffler's is.** `TimeAx.drawit` sets
`font.setBold(True)` (`pile_viewer.py:542`) for the tick labels, and the paint pass
sets a bold font before it draws anything else (`:3203`, applied at `:3229`), so every
label snuffler puts on its canvas is bold. This entry used to record that the port
drew them in the default weight — measurably: on `demo-raw-full` a tick label carried
0.081 of its box in ink against Qt's 0.183. The port now ships Ubuntu Bold and draws
the canvas in it (`view::canvas_font`, and `font-weight` on the SVG path so an export
matches), which closed that to 0.154 against 0.221 and the glyph width to within 3 %.
A pixel check would still say it better than a measurement of one label does.

**The axis label layout is snuffler's.** The second and third rows draw centred
under the tick that earned them with the left-edge fallback when none did, the
abbreviation ladder steps `l0` to `l0_brief` to nothing against `pinc_approx*0.9`,
and the between-ticks formats take their half-interval `ushift` — all in
`timeaxis.rs`/`paint.rs`, pinned by unit tests against values from snuffler's own
`TimeScaler`.

**The track label chip is snuffler's too.** `draw_label` fills the text's own
bounding rect with a white brush at alpha 100 (`gui/util.py:294`, `pile_viewer.py:3230`)
— square and unpadded. The port had the brush right and the geometry wrong, padding it
three pixels and rounding the corners, which read as a box over the trace rather than a
backing under the text; `Palette::label_pad`/`label_rounding` are zero under this theme
and keep the rounded plate for Snuffler Web, which was designed with it.

Recorded because it was *found*, not because it was designed: it turned up on a direct
question about whether this theme was fully at parity, in a part of the rendering no
tier looks at. Treat the list above as what has been examined rather than as what
differs — the marker drawing, the scale annotations and the whole waterfall path have
never been held against snuffler at all.

**Scope: light only, and that is now structural.** This entry used to carry a second
half about a dark variant of this theme. There is no such thing any more.
`WiggleTheme::pinned_polarity` pins the Snuffler Qt canvas to white and the frontend
disables the light/dark control while it is selected, saying why on hover. Snuffler is
white-canvas by construction — `aluminium5` traces on `QPalette.Base`, light Tango box
fills at alpha 100, a white-at-alpha-100 label brush that is invisible on white — and a
dark rendering of those numbers was never snuffler with the lights off, it was a
different theme wearing the name. Dark belongs to the web themes that were designed
for both canvases. So every parity claim about this theme is a claim about light, and
no scenario can accidentally assert one about dark.

The rest of the theme is matched and pinned elsewhere: the canvas white, the
`aluminium5` traces and axis, the white-at-100 label brush, the seven Tango box styles
at `box_alpha = 100` with snuffler's per-trace style assignment, `graph_colors` strokes
with black past the seventh key, snuffler's 10 px tick marks, and no grid or row rules —
the first behind `show_time_grid`, off by default, and the second never drawn under this
theme at all. That is how the frontend keeps its own additions without imposing them on
the theme that is supposed to look like upstream.
"""

[[manual]]
key = "waterfall-pipeline"
bucket = "soft"
title = "The waterfall builds its image from labelled track rows, not chopper-order trace rows"
enforce = "a waterfall check kind comparing TraceWaterfall.get_image's `data` array against the web's pre-colorize strips, resampled to a common grid"
why = """
Qt builds one image for the whole track area, one row per *trace*, on a single shared
time grid: it takes `raw_deltat = min(tr.deltat)` across the rows and `num.interp`s
every trace onto it, and it drops whole rows when there are more traces than pixel
rows (`pile_viewer_waterfall.py:95`). The web builds one strip per span of a *track*
row, positioned at that span's own x extent.

The placement is signed off, on strong grounds: Qt draws its NSLC track labels at
track row positions, outside the wiggle/waterfall branch (`pile_viewer.py:3518`),
while its image rows come from `pile.chopper` order — file and time order, not track
order. So snuffler's waterfall labels point at the wrong rows whenever any track
carries more than one trace, and its row dropping discards channels outright once
there are more traces than pixel rows, where the web pages and loses none.

The normalisation and stride follow the row definition rather than fighting it:
`_waterfall_row_strips` takes the peak across *every* strip of a row before
dividing, and derives one decimation stride per row, so the two segments of a
gapped channel share one colour scale and one time resolution on their shared,
correctly-labelled row — the row-scope analogue of snuffler's always-on per-row
normalisation (`pile_viewer_waterfall.py:148`).

What would still show against `TraceWaterfall.get_image` is the row identity
itself (trace rows in chopper order against labelled track rows) and Qt's
`num.interp` resampling against plain striding — both consequences of the
placement decision above, not separate choices.
"""

[[manual]]
key = "autoscale-guards-and-precision"
bucket = "soft"
title = "One y-range guard remains: an all-NaN slice scales to (0, 1)"
enforce = "a corpus channel carrying NaN samples across a whole window"
why = """
This entry used to list three extra guards, a NaN-hostile fast path and a float32
quantisation. Four of the five are gone: the fast individual/minmax path now uses
`nanmin`/`nanmax` exactly as `trace.minmax` does (trace.py:2549), so a NaN sample is
ignored and the range is correct as in Qt; the dead `ymax <= ymin` nudge is removed;
the range scalars cross the bridge as proto `double`; and the empty-range `dict.get`
default became unreachable the way it is in Qt once the drawn and scale slices came
from the same processed cutout.

What stays, signed off, is the non-finite fallback to (0, 1) — which can now fire
only when *every* sample in the slice is NaN. Qt hands that case to `AutoScaler`
whole and draws a nonsense axis; drawing a definite 0..1 axis instead of NaN
geometry is the same never-reproduce-a-crash rule the `:` command guards follow.
"""

[[manual]]
key = "filter-failures-swallowed"
bucket = "soft"
title = "A filter or restitution that throws becomes a status notice, not an exception"
why = """
A processing failure used to leave the segment drawn unfiltered with no signal at
all (`except Exception: pass`). Now `_filter_seg` and `_remove_response` record the
failure, `ViewMeta.notices` carries it with the view it affected, and the status
line shows it (with the full list on hover).

The remaining difference from Qt is deliberate and stays: snuffler lets the
exception out of `prepare_cutout2` and the user sees a traceback; a browser view
must not die on an exception, so the survivable equivalent is data drawn
unprocessed *plus* a visible statement that it was. A failure also rolls the
segment back to its pre-filter samples — the FFT branch detrends before it can
fail, and the IIR branch can half-apply — so "unprocessed" is literal, not
best-effort. The notices ride the cutout cache: a pan that reuses the processed
cutout re-emits them, so a warning lives exactly as long as the data it warns
about, and a fresh processing pass warns anew while the condition holds.
The failure mode this entry was written against — unfiltered data presented as
filtered, silently — no longer exists.
"""
enforce = "a tier-1 scenario supplying a corner that makes the filter raise, asserting the notice; today no scenario produces one"

[[manual]]
key = "timeaxis-algorithm"
bucket = "soft"
title = "The time axis is snuffler's algorithm, transcribed"
enforce = "the timeaxis.rs unit tests, which pin the increment choice, the calendar anchoring and the label ladder against values from snuffler's own TimeScaler"
why = """
`timeaxis.rs` is now a transcription of `TimeScaler`/`TimeAx`: the 18-value
`acceptable_tincs` table chosen by *nearest* entry to `span / 7`, calendar-anchored
tick walks (sub-day runs restart at each day start, day steps walk whole days,
months from the 1st, years from Jan 1 in whole-increment years), the five-level
label ladder with the abbreviation fallback measured against `0.9 ×` the tick
spacing, the centred-between-ticks shift for the day and month formats, the
second and third context rows under the ticks where their unit rolls over with the
left-edge fallback when none did, and the year-at-epoch suppression for synthetic
data. The axis baseline and 10 px tick marks were already snuffler's.

One knowing simplification, recorded in the module header: snuffler switches to
its `hpfloat` high-precision time below millisecond increments; the port stays
`f64`, which drifts only below the millisecond at large epochs. And the labels are
not yet bold — `qt-theme-residual-chrome` keeps that with the other font-metric
items that need a pixel diff to land honestly.
"""

[[manual]]
key = "track-labels-and-annotations"
bucket = "soft"
title = "Track labels are snuffler's gather key, annotated for every geo sort"
enforce = "the tier-1 `annotations` check, which now runs for distance, azimuth, backazimuth and the 12-block sort and compares the exact formatter strings"
why = """
The bridge composes the label exactly as snuffler does (`plabel`,
pile_viewer.py:3521): the gather key space-joined, sort value first, nslc elements
in the subsort's permuted order, `None` members skipped and the empty location
kept — so the subsort is visible in the label and a distance-sorted track reads
"123 km XX STA01  HHZ" on both sides. The sort values use snuffler's own
formatters: `m_float` (km to 0 decimals above 10 km, 1 below, `%.5g` metres under
a kilometre), `deg_float`'s bare `%4.0f`, and `sector_int`'s `[%i]` with the
distance beside it for the 12-block sort. The "no coords" placeholder is gone;
snuffler writes nothing there.

The label also adapts to the row as snuffler's does: the font shrinks until a row
fits more than one line of it, and below the 6 pt floor only the hovered row keeps
a label, drawn at the floor size (pile_viewer.py:3505, :3526). Anchored
middle-left at x = 10, as there.

`compare_annotations` runs for all four geo sorts and compares the web's string
against the one snuffler's formatter would print for Qt's own `set_origin`
geometry, so format and value are pinned together.
"""

[[manual]]
key = "scale-annotation"
bucket = "soft"
title = "'Show Scale Axes' draws snuffler's ticks and numbers"
enforce = "a tier-1 `scales` extension returning the tick set rather than only (ymin, ymax)"
why = """
The axes mode draws a tick and a number at every `AutoScaler` increment inside
the track's range, with the shared `×10^n` exponent on the topmost and the zero
line shortened so it does not run under the y = 0 label; the ranges mode prints
`%g` min/max at the row corners with the little bracket when boxes are off. Both
follow pile_viewer.py:3345-3434: axes *replaces* ranges when both are on, neither
draws on a row shorter than about four text lines, several scales on one row step
leftward past each other, and the numbers take the trace colour under Color
Traces. The increment and exponent come across the bridge (`ViewSpan.yinc`,
`.yexp`) from the same `AutoScaler` call that makes the range, so the ticks are
pyrocko's, not a frontend recomputation.

One difference stays signed off: Qt derives `approx_ticks` from the track height
when the axis is shown (`max(3, min(nlinesavail*0.5, 15))`, pile_viewer.py:3261)
where the bridge passes a flat 15. That moves the tick spacing only, never
`ymin`/`ymax` — `snap` is false in exactly that configuration on both sides — so
the increment is a layout decision the frontend owns.
"""

[[manual]]
key = "trace-drawing-details"
bucket = "soft"
title = "Box colours, the zero line and the clip rectangle follow snuffler's rules"
enforce = "the tier-1 `boxes` check (every scenario compares the bridge's boxes to Qt's recorded box paints) plus the paint.rs pile-backed box test; nothing compares the zero line and clip, which are one-line rules"
why = """
The three rules this entry tracked are snuffler's now. The Show Boxes colour is
assigned per contiguous run of samples — the index advances whenever the next
trace is not the same channel and rate within the gap tolerance
(pile_viewer.py:2947) — so the colour tells you where one continuous recording
ends, which is what the option exists to show. The zero line is drawn only when
zero falls inside the track's y range, stops short of the scale labels, and under
the Snuffler Qt theme takes snuffler's own trace pen. With Clip Traces on, the
clip is the same 90 % inner box the trace is scaled into, so a spike is cut
exactly at ymin/ymax (pile_viewer.py:3186, :3462); with it off the web still
clips to the track area where Qt restores the widget-wide clip — a reasonable
tightening, kept.

The run numbering now comes from the bridge's `_box_styles`, a transcription of
`determine_box_styles` walking the whole pile in `full_id` order — the fetched-page
caveat this entry used to carry is gone with the span-derived styling. The seven
Tango pairs and the alpha match exactly.
"""

[[manual]]
key = "canvas-additions"
bucket = "soft"
title = "An optional on-screen grid and a cursor crosshair, never exported"
enforce = "a byte-level check of the exported SVG, which would catch the grid leaking back into it"
why = """
Two screen-only additions over snuffler's canvas, both opt-in or transient and both
excluded from the exported figure, which is where fidelity to snuffler's `savesvg`
matters.

The grid: full-height vertical rules at the tick times, behind the traces, gated on
`show_time_grid` (off by default — snuffler draws no grid, so the default look
matches) and suppressed when `paint()` runs for the SVG/PNG export. The Snuffler Qt
theme never draws it at all. `pal.zero` now carries at least `pal.grid`'s contrast
in every palette, so the zero-amplitude data reference always outweighs the
decoration beside it — and under the Snuffler Qt theme the zero line is snuffler's
own trace pen (pile_viewer.py:3431).

The crosshair follows the pointer on screen only (it lives outside `paint()`, so no
export ever carries it). Its justification is cross-track x alignment: the status
line already prints the cursor time — the counterpart of Qt's status-bar readout —
but a number cannot say which wiggle on another row lines up with the one under the
pointer, and that is what a vertical hair is for. Qt offers nothing comparable, so
this is a deliberate addition, not a divergence from a Qt behaviour.
"""

[[manual]]
key = "marker-file-fidelity"
bucket = "soft"
title = "The marker file round-trips through pyrocko's own writer, with two knowable losses"
enforce = "a marker-file round trip: build a fixed marker set on both sides, save, and diff the text"
why = """
The format is shared code — the web calls pyrocko's own `save_markers`/`load_markers`
through a stub import — and the marker objects handed to that writer now carry what
Qt's carry: sub-second digits derived from the data's sample interval
(`time_fractional_digits`), the full `nslc_ids` *list* (a pick binds to every channel
of the clicked track), the automatic flag (`False` for a hand pick, `@` in the label),
incidence/take-off angles, the event's own `name`/`region`/`catalog` distinct from its
display caption, and phase rows linked to their event row through a shared
`model.Event` so both write the same `get_hash()` and `associate_phases_to_events`
re-links them on load — which the web loader now calls, registering the loaded events
for activation. Files save in time order, one bad row no longer loses the file, and
converting a marker to an event collapses its span and channel scope in the UI, not
silently at save time.
Python returns every canonical event snapshot after creation,
editing, activation and loading, so locally derived station coordinates and marker-table
origin edits are reflected in both the saved row and every scientific consumer.
Associated phase markers carry the event time even without a phase name or event row,
preserving pyrocko's fallback matching.

Two losses remain, and are accepted:

  * A kind outside 0..255 is folded modulo 256 on load — the transport is unsigned
    8-bit where Qt keeps a Python int. Both sides only ever create 0..7; a file
    carrying anything else was hand-edited.
  * Incidence and take-off angles survive the file and feed the hover readout, but
    the web has no per-marker editor for them; they are display-only outside the
    snufflings that set them.
"""

[[manual]]
key = "marker-overload-full-quiet"
bucket = "soft"
title = "Past 2000 markers the web silences the per-trace passes Qt keeps paying for"
enforce = "the paint.rs overload tests: the count readout appears, and past the limit no marker colour reaches an SVG holding real samples"
why = """
Qt's 2000-marker limit (`with_key_in_limited`, pile_viewer.py:3027) guards only its
overview layer: the per-trace loop iterates the unlimited `with_key_in`
(pile_viewer.py:3480), so above the threshold Qt still draws every snippet,
uncertainty box, vertical and label — and pays markers x traces for it on every
repaint. The web applies the same verdict to all three passes (overview, per-track
decorations, the snippet re-draw in the trace loop), leaving only the dotted
overview line and the count readout.

Deliberate: the browser repaints the whole view on every interaction frame, and
the readout exists precisely to cap that per-frame work. The visual difference
from Qt above the limit — no per-track verticals or snippets — is the point, not
an accident.
"""

[[manual]]
key = "phase-key-names"
bucket = "soft"
title = "The phase-key mapping ships Qt's built-in default and is not configurable"
enforce = "tier-3 `markers` — the identity tuple carries `phase`, so a scenario pressing <f3> on a selected marker pins the shipped mapping"
why = """
The function keys now name Qt's own defaults — F1:P, F2:S, F3:R, F4:Q, F5:?, with
F6-F9 falling through to the literal `Undefined` (`config.py:33`, pinned by a unit
test in `markers.rs`) — so a pick made with any F-key carries the same name into the
same marker file on both sides.

What stays different is configurability. Qt reads `phase_key_mapping` from
`~/.pyrocko/snuffler.pf`; a browser has no home dotfile to read, so the web ships
the built-in default and no way to change it. A user who has customised their
mapping gets Qt's stock names here. Signed off: interoperability with an
unconfigured snuffler — the measured reference — wins, and a web-side settings
store is its own feature with its own persistence questions
(`startup-and-persistence`), not a patch on this constant.
"""

[[manual]]
key = "active-event-lifecycle"
bucket = "soft"
title = "Catalog loads still auto-activate the largest event — now visibly"
enforce = "tier-1 `annotations` — a scenario that loads the eifel catalog, sorts by distance, and either activates a non-largest event or deletes the active one"
why = """
Qt never activates an event on its own; the web still does on catalog search and
event-file load, because a page anyone can open without reading the help gets
distance sorting working out of the box. That stays, signed off — but it is no
longer invisible or wrong:

  * The auto-activated marker itself carries `active`, so the canvas outline and
    the table show the same event Python measures distances from.
  * Every load path (QuakeML, FDSN-text, event file, marker file) registers its
    events in `_EVENT_REGISTRY` with full origins, so `e` on any of them
    activates the real origin rather than a rebuilt zero-depth stand-in.
  * Deleting the final event marker for a hash — Backspace, the table's Delete
    selected, or Clear all — removes the canonical registry entry and returns the
    updated active state. A duplicate event marker keeps the shared entry alive;
    deleting the active event clears the active origin with it.
  * F-keys associate the named pick with the active event in the same keystroke,
    as Qt's `set_phase_kind` does, including the event-time fallback saved without
    an event row.

`EventSnapshot` is the shared registry projection: catalog auto-activation, local
conversion and marker-table edits return it with the active metrics.
Rust reconciles both newly loaded and previously accumulated markers from that response,
so map, export, Kagan/distance columns and Python computations cannot retain different
origins.
Active hash, origin and moment tensor are assigned together from the registry;
switching to a non-MT event or an empty result clears the previous tensor.
Kagan and distance remain event-row columns, while associated unnamed phase rows
retain only the event-time fallback.
"""

[[manual]]
key = "marker-table-surface"
bucket = "soft"
title = "The marker table keeps a web-shaped surface over Qt's semantics"
enforce = "a table-column inventory on both sides, which tier 2 has no notion of today"
why = """
The semantic divergences are gone: Dist is Qt's — this *event* to the active event,
`%.5g` kilometres, blank on anything that is not an event marker, refreshed on every
activation — so it pairs with Kagan as designed; Uncertainty [s] and Event Hash are
columns now; NSLCs shows the full pipe-joined id list; a plain row click *replaces*
the selection (Ctrl/Shift adds) and a double click re-centres the view, as Qt's rows
answer; the label cell edits a pick's phase name and an *event's name* — the rename
path Qt offers through its Label column; and Clear all asks before destroying every
marker.

What stays deliberately web-shaped: the span and per-row-action columns and the
toolbar (Select/Deselect/Delete/Clear) — affordances for a browser page with no
menu-bar chrome; all columns always visible instead of Qt's header context menu,
column hiding, numbering toggle, print and row-zoom, which are desktop-table
furniture; no inline beachball (the action button opens it); and no key forwarding
from the table to the viewer — egui focus rules differ from a QTableView's, and
Up/Down over the table still reach the polarity binding when no widget holds focus,
which Qt avoids by eating those two keys in the table. Small, named, and owned.
"""

[[manual]]
key = "snuffling-marker-conventions"
