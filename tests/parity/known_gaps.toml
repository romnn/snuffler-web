# Every intentional difference between Qt snuffler and the web port, and the
# reason it exists. This file is the single register: if the two behave the same,
# nothing is written down; if they differ, the difference either has an entry here
# or the suite fails. An entry is one of two things, and says which:
#
#   signed off   the difference is justified and stays. The `why` carries the
#                justification, and a difference really must have one — "free
#                choice" is not a reason to differ, it is a reason to match.
#
#   todo = true  open work: a difference or gap we intend to close, recorded here
#                so it is excused from the diff without being mistaken for a
#                decision. The `why` says what closing it takes.
#
# Four kinds of entry:
#
#   [[numeric]]  tier 1 — a place where the two pipelines legitimately compute
#                different numbers, because the browser cannot do what Qt does or
#                because the web port deliberately chose otherwise.
#
#   [[defect]]   tier 1 — a difference that is a *bug*, found by this suite and not
#                yet fixed. Not an excuse: a register, with the fix in the entry.
#                Scenarios naming a defect print as `bug` rather than `pass` and the
#                run lists every one that still reproduces.
#
#   [[feature]]  tier 2 — a command Qt has that the web does not. Anything present
#                in the Qt inventory, absent from the web inventory and absent here
#                fails the build.
#
#   [[manual]]   a difference no tier can currently observe, recorded so it is not
#                silent. `enforce` names the check that would observe it — required,
#                because the kind's whole promise is that an unobservable difference
#                still has a way out of that state. Nothing validates these against
#                reality yet, which is exactly why they are quarantined in their own
#                kind instead of rotting inside an enforced one.
#
# The line between [[manual]] and the enforced kinds is mechanical, not editorial:
# `evaluate` only ever looks at entries a scenario named in `expect_divergence`, so
# a [[numeric]] or [[defect]] entry nothing names would be inert — it would excuse
# no divergence and never go stale. A full tier-1 run fails on any such entry, which
# is what keeps "enforced" meaning enforced.
#
# `bucket` is the four-way split from plan/native-gaps.md: sandbox-hard,
# needs-a-server, chromium-only, soft.
#
# `checks` lists the tier-1 check kinds the entry accounts for; `strict` (default
# true) means the divergence must still reproduce, so an entry cannot rot into
# folklore about behaviour that has since changed. Set it false only when the *size*
# of the difference is data-dependent and can legitimately fall inside tolerance.
#
# An entry covering `samples` may also declare `residual = "constant"`: the excused
# divergence must then *be* a per-segment constant offset — remove its mean and the
# remainder has to sit inside the scenario tolerance. That turns the excuse from
# "samples may differ" into "samples may differ by exactly this shape", so a second,
# unrelated sample defect cannot shelter behind the entry. Declare it whenever the
# divergence has a describable shape; an entry that cannot say what shape it excuses
# is masking everything in the checks it claims.
#
# `subjects.<kind>` narrows the excuse for one check kind to the findings whose
# subject (the dotted nslc, mostly) matches one of its glob patterns, so a
# divergence that lives on named channels stops excusing every other channel's, and
# a strict entry has to keep reproducing *inside* its scope. Kinds left out of
# `subjects` stay kind-wide — the right choice where subjects are structural
# (`presence` has one finding, `tracks` has `count` and `order`) or where the
# divergence genuinely touches every channel. Declare it whenever the entry's `why`
# can say which channels carry the difference.

[[numeric]]
key = "demean-extent"
bucket = "soft"
todo = true
checks = ["samples", "scales"]
# The whole divergence is which constant got subtracted, so that is all this entry
# excuses: the residual model re-arms the samples check for anything else.
residual = "constant"
title = "Demean removes a different mean"
why = """
Qt demeans each fetched chop, so the constant it removes is the mean of whatever
window happens to be on screen. The web demeans the whole trace once and caches the
result, so the constant does not move as you pan.

The port's reason is its cache: `_processed_trace` caches on the whole-trace span, so a
per-window mean would recompute on every pan. That is a real cost but not the wall this
entry once claimed — Qt pays it and stays fast anyway, because `prepare_cutout2` reuses
its cached processed traces whenever the new window is *contained* in the cached one
(`pile_viewer.py:3640`), and Liberal Fetch snaps the fetch to a power-of-two grid
(`pile_viewer.py:3618`) precisely to make that containment the common case. The web owns
the same machinery already (`session.rs:232`). So this is a port that has not been
written rather than one that cannot be.

Bounded either way: a constant offset that moves the autoscale range with it and
vanishes under any highpass. Worth knowing that Qt's per-window behaviour is what
re-centres a DC-offset trace when you zoom into a segment — that is a feature the web
does not reproduce, not merely an implementation detail.
"""

[[numeric]]
key = "filter-context-extent"
bucket = "soft"
todo = true
checks = ["scales"]
strict = false
title = "A filtered sub-window carries a different filter transient at its edges"
why = """
Qt filters a `tpad`-padded chop of the requested window; the web filters the whole
trace once and slices out the window. Inside the window the two agree to float32
(measured: 6e-8 relative on a 60 s bandpassed window), but the first samples after
each side's own filter start-up do not, and the autoscale range is a min/max over
the window — including those samples.

So the y range differs exactly when an extremum happens to land on the transient.
Not strict, because whether it does is a property of the data and the passband, not
of the code: the 4th-order low+high cascade trips it on this corpus where the 2nd-
order bandpass does not.

A second, smaller term rides along in the same check: Qt ranges over the traces it is
about to draw, which the final chop widened by four samples at each end
(`pile_viewer.py:3894`), while the web's scale slice takes no such margin
(`bridge.py:1259`, `sample_support=0.0`, against `4.0` one line above for the drawn
slice). It only bites when the fetch actually has context to widen into, i.e. when
`tpad > 0` — which is exactly when a filter is on, and so exactly when this entry
applies. `demo-raw-zoom` pins the unfiltered case: at a window whose extremum sits
inside that margin the two still agree, because with no filter Qt's chopper hands the
±4-sample chop nothing to reach back into.

The sample comparison is *not* excused here. Scenarios that filter a sub-window trim
a transient length from each end and still require the interior to match. Nor does it
excuse the deconvolution, whose window dependence is a different size and shape
entirely — see `decon-context-extent`.

Everything above is true of the IIR branches and false of FFT filtering, which is why
this entry is open work rather than a sign-off. Measured on `demo.mseed`, trimming twice
the tpad from each end — more than any scenario trims — the interior residual is 9.1e-11
for the order-2 bandpass, 1.8e-8 for the order-4 low+high cascade and 1.9e-9 for a plain
highpass, but **2.2e-2 for an FFT bandpass** and 5.4e-3 for an FFT highpass, with the y
range out by 3.3e-2. That is not a transient: `_fft_filter` fits its detrend line over
the whole 600 s trace where Qt fits it over the ~68 s padded chop (`bridge.py:792`
against `pile_viewer.py:3696`), and adds it back unchanged, so the two answers differ by
an affine function across the entire window — `demean-extent`'s constant plus a slope —
on top of a different circular-wrap grid.

Nothing observes it: `07-demo-fft-full` has no `[window]`, so both sides process
identical samples there. An FFT-on-a-sub-window scenario would catch it and would need
this entry to cover `samples` as well.
"""

[[numeric]]
key = "allow-downsampling-meaning"
bucket = "soft"
todo = true
checks = ["samples", "scales"]
title = "'Allow Downsampling' does two different things"
why = """
In Qt it halves the sample rate of the data itself (`trace.downsample(2)` in a loop)
before filtering, whenever a lowpass makes the extra rate pointless — the corpus demo
goes from 50 Hz to 25 Hz. In the web it switches on display decimation: `_decimate`
returns a min/max envelope as interleaved (t_rel, y) extrema and the data is
untouched.

Both keep the drawn waveform faithful and both cut the work; they are not the same
transformation and there is no sample-for-sample comparison between them. Tier 1
therefore runs with it off — which, usefully, is also how the web side is asked for
undecimated view data at all — and this scenario exists to keep the difference
documented and observed rather than assumed.

Two consequences of the asymmetry are worth stating, because they are what make the
two flags stop being interchangeable. Qt's downsampling only happens when a lowpass is
set, and is skipped entirely under FFT Filtering (it lives in the `else` arm of
`pile_viewer.py:3696`); the web's decimation runs regardless of either
(`bridge.py:1282`). And Qt's downsample changes the data `trace.minmax` then ranges
over, where the web's decimation touches only the drawn payload and leaves the
autoscale range on undecimated samples (`bridge.py:1259`) — so with the flag on, the
same trace can carry a different y range for reasons that have nothing to do with
drawing. That is not hypothetical: `demo-downsampling` records `max_rel_scale = 4.2e-3`,
the same trace on a visibly different amplitude scale, and the gap grows with broadband
content because Qt's `minmax` sees anti-aliased data and the web's sees raw peaks.

Open work rather than a sign-off, because nothing forces the difference. `Trace.downsample`
is a real `fir-remez` anti-aliased decimation (`trace.py:694`) in the same pyrocko
`_processed_trace` already calls; the port simply does not use it. By this register's own
rule that makes it a reason to match, not to differ — the same rule that puts
`demean-extent` and `decon-context-extent` in the same state.

Two cautions for whoever closes it. Qt's target rate comes from the window width
(`min_deltat_wo_decimate = tsee/visible_length`), not from the lowpass corner — the
lowpass is only a gate. And "there is no sample-for-sample comparison to make" is a fact
about the harness, not a justification: this entry currently excuses all 36 sample
findings of its scenario with `strict = true` and no `residual` shape, so any second,
unrelated sample defect shelters behind it.
"""

[[numeric]]
key = "min-deltat-allow"
bucket = "soft"
todo = true
checks = ["presence", "geometry", "tracks", "scales"]
# Only the 50 Hz channel is finer than the wide window's threshold on this corpus,
# so the per-channel halves of the excuse are pinned to it: any other channel's
# geometry or scale diverging is a new problem, not this one. Presence and tracks
# stay kind-wide because their subjects are structural, not channels.
subjects.geometry = ["XR.ODD3.*"]
subjects.scales = ["XR.ODD3.*"]
title = "Qt stops fetching traces that are too finely sampled for the window"
why = """
`prepare_cutout2` derives `min_deltat_allow` from the window width and the target
sample count (`visible_length`) and then selects only traces at or above it, so a wide
enough window makes high-rate channels vanish from the view entirely — and if every
channel is finer than the threshold, the view empties. The web has no such cut-off: it
decimates for display and every channel stays on screen.

Unreconciled rather than settled, and recorded here so it gets decided rather than
defaulted into. Qt's cut-off is a real fetch optimisation with a real cost — a channel
you were watching disappears when you zoom out. The web's decimation keeps every
channel on screen at the cost of the work Qt was avoiding. Which behaviour the port
should have is a product call, not a test's call; this entry only pins that they differ
and by how much.

The sample data of the tracks they *do* share still agrees, which is why this entry does
not cover the `samples` kind.

Anyone porting the cut-off should know what they would be porting: the threshold is
rounded by `math.exp(int(math.floor(math.log(x))))` (`pile_viewer.py:3611`), a power of
*e* rather than of ten — 0.03 becomes 0.0183, 0.6 becomes 0.368. That is almost
certainly an upstream slip for `log10`/`10**`. It is the reference behaviour either way,
so "match Qt" here means reproducing it deliberately or diverging from it deliberately,
not doing whichever falls out.
"""

[[numeric]]
key = "decon-context-extent"
bucket = "soft"
todo = true
checks = ["samples", "scales"]
title = "The deconvolution is not window-faithful"
why = """
The whole-trace processing extent is benign for the IIR filters and is not benign here.
Qt restitutes the `tpad`-padded chop of the requested window (`pile_viewer.py:3848`);
the web restitutes the whole trace and slices the window out of the result
(`bridge.py:874`). Deconvolving a 60 s window and deconvolving 300 s and cutting 60 s
out of it are different operations: `Trace.transfer` removes the mean of whatever it is
given (`trace.py:1731`) and wraps around a `nextpow2(1.2n)` grid, and the inverse
response with `f2 = abs_min` has an impulse response far longer than any `tpad`.

Measured by `multi-decon-zoom` at 2.1e-1 relative RMS on samples and 3.6e-2 on scales,
with the scenario's own edge trimming already applied — this is the window's *interior*,
not a transient `edge_trim_s` can cut away. The frequency-limit term is not the cause:
`get_freq_limits` and `_decon_freq_limits` do derive different corners from the two
data lengths, but on this corpus both fall below the first DFT bin and contribute
exactly nothing.

Open rather than settled, and the decision is the same one `demean-extent` and
`filter-context-extent` are waiting on: whether the port adopts Qt's padded-window
extent, which would close all three at once, or keeps whole-trace processing and
accepts that restitution shows a different answer than snuffler does for the same
window. Nothing about the browser forces either.
"""

[[defect]]
key = "filter-demean-not-suppressed"
bucket = "soft"
checks = ["samples", "scales"]
title = "The lowpass and highpass stages remove a mean of their own"
why = """
`Trace.lowpass` and `Trace.highpass` demean by default and never add the mean back
(`trace.py:989`, `:1018`). Qt passes `demean=False` to both (`pile_viewer.py:3821`);
the web passes nothing (`bridge.py:836`, `:838`), so with Demean *off* the web still
removes the trace mean — as a filtered step, not a clean offset, because the filter
starts from zero initial conditions and settles into it.

Caught by `demo-lowpass-only` at 6.7e-2 relative RMS, five orders of magnitude past the
scenario tolerance. It went unseen because every other lowpass scenario sets Demean on,
where the mean is already gone; the highpass path decays to ~1e-12 within a second and
so hides in the existing highpass scenarios too. The bandpass branch is correct and
matches Qt exactly (`bridge.py:833` against `pile_viewer.py:3818`), which is the
clearest evidence this is an omission rather than a choice.

Fix: `demean=False` on both calls, matching the branch beside them.
"""

[[defect]]
key = "fft-decon-not-combined"
bucket = "soft"
checks = ["samples", "scales"]
title = "FFT filtering and deconvolution run as two passes instead of one"
why = """
With both switched on, Qt folds the inverse instrument response, the `CosTaper` and the
Butterworth into a single transfer function and applies them in one FFT
(`pile_viewer.py:3743`), deliberately *not* re-adding the linear trend
(`pile_viewer.py:3794`) and skipping the separate `transfer()` restitution entirely
(`pile_viewer.py:3840`). The web runs its FFT filter — which always retrends
(`bridge.py:814`) — and then deconvolves separately through `Trace.transfer`
(`bridge.py:902`), so the fitted trend is re-injected and then deconvolved, over a
different padding grid.

Caught by `multi-decon-fft` at 1.2e-2 relative RMS. A second half of the same divergence
is not yet measured: Qt enters its FFT branch when `remove_resp` is set even with no
corners at all (`pile_viewer.py:3696`), so "FFT filtering + Deconvolution, no passband"
is a deconvolution in Qt and a no-op in the web, whose `_filter_seg` needs a corner to
reach the FFT path (`bridge.py:828`).

The port already evaluates the same `MultiplyResponse`, so this is a pipeline shape to
correct rather than capability to add.
"""

[[manual]]
key = "vertical-leg-follows-qt"
bucket = "hard"
title = "The 3D vertical leg is snuffler's, which is not the honest one"
enforce = "`qt_oracle.assert_upstream_geometry`, run before every tier-1 scenario: it computes `set_event_relative_data` on a station with both an elevation and a borehole depth and fails if upstream stops forming the vertical leg as `event.depth - station.depth`"
why = """
`Station.set_event_relative_data` forms the vertical leg as `event.depth -
station.depth` (`station.py:184`) — the station's borehole depth, with its elevation
dropped. A station 1.7 km up a mountain is measured as though it stood at sea level.
The geometrically honest term is `event.depth + station.elevation - station.depth`,
and snuffler does not write it.

`bridge._sort_distance` now writes snuffler's version, deliberately. It used to write
`event_depth + station_elevation` — the mirror-image mistake, dropping the borehole
instead of the mountain — and the two disagreed by 11 to 119 m on the GSN stations of
`bonin-grouped-distance-3d`. Neither was defensible as *correct*; the difference was
which one this port is supposed to be. Parity with the Qt application is the claim
this whole suite makes, so the port follows snuffler into the error rather than
quietly diverging into a better answer nobody can check it against. Correcting the
formula is upstream's to make, and the fix belongs there for every pyrocko user at
once, not here for the browser build alone.

This is signed off rather than open work, so nothing here is waiting on a decision.
What it is waiting on is upstream *changing its mind*: the day pyrocko starts adding
the elevation, this port silently becomes the wrong one, and every distance sort
diverges by tens of metres with no test naming why. That is what `enforce` above
guards. The canary asserts the upstream formula directly rather than inferring it
from a scenario, so it fires on a `PYROCKO_REF` bump even if no scenario in the suite
happens to hold a station with both an elevation and a borehole — and it fails by
this key, pointing whoever bumped the pin at this paragraph.
"""

