title = "Snufflings now label and colour their markers as Qt's do"
enforce = "tier-3 `markers`, with a scenario that runs Cake Phase or the SeisBench picker"
why = """
Cake Phase emits Qt's markers now: fixed `kind=2`, `('*', '*')` for location and
channel — `''` meant "the blank location" to pyrocko and matched nothing — the
incidence and take-off angles on the marker itself, and the association with the
