`session.rs`): span plus 10 %, floored at one trace-visibility length, whole pile on
an empty `g`, zoom-in on an empty `G` — and `goto` runs through the same helper, so
its jumps carry the same floor. Ctrl+wheel steps the shown track count by
`max(1, n/5)` per notch; the arrows nudge a selected marker by exactly one screen
