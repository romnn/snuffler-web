# [[feature]] is the tier-2 allowlist proper: a command Qt offers that the web does not.
# Every entry has to keep matching something; one that stops applying fails the run as
# stale.

[[feature]]
qt = "File/Print"
title = "No Print item: the only print a page can ask for is not the one Qt performs"
why = """
Qt's `File ▸ Print` opens a printer dialog and re-paints the seismogram view
*alone*, laid out afresh at the printer's page size in landscape
(`pile_viewer.py:2846`). A page can only call `window.print()`, which hands the
browser the whole document at screen layout, menu bar and all.

Signed off as a command deliberately not offered. Every browser already binds
Ctrl/Cmd+P and carries Print in its own menu, so an item whose body is
`window.print()` would wear Qt's name over a different command. The half the host's
print lacks, the seismogram view by itself, is `File ▸ Save image (SVG)…`, and
printing that file is one browser step away, though the export takes the current
waveform rect where Qt sizes a fixed page canvas.
"""

[[feature]]
qt = "File/Close"
title = "No 'close the viewer' command"
why = """
The tab is the window. There is nothing for a Close item to close that the
browser's own controls do not, and a page cannot close a tab it did not open.
eframe's web backend drops `ViewportCommand::Close` unhandled, so a Close item or a
`q`/`x` binding would be documented, bound and inert at once, which is worse than
absent. Neither key is bound or listed in the help.
"""

[[feature]]
qt = "q"
title = "q is deliberately unbound"
why = """
Qt's `q` quits the viewer; see `File/Close` for why nothing here can.
"""

[[feature]]
qt = "x"
title = "x is deliberately unbound"
why = """
Qt's Close action carries `q` and `x` (`pile_viewer.py:924`); see `File/Close` for
why neither is bound.
"""

[[feature]]
qt_prefix = "Snufflings/Run Snuffling/Get GEOFON Events"
title = "The GEOFON presets query FDSN, not the eqinfo scrape"
why = """
The four one-click queries (all events, ≥ M 6, ≥ M 7, ≥ M 8) are offered under
Snufflings ▸ Get GEOFON Events, over the visible time range, as Qt offers them. What
differs is the transport: Qt's presets scrape `geofon.gfz.de/eqinfo/list.php`
(`client/geofon.py:60`), which answers no browser; the web queries GEOFON's own FDSN
event service. Same catalog, same events, different serialization.
"""

[[feature]]
qt_prefix = "Help/Snuffling Help"
title = "Snuffling Help is one indexed window, not one page per docstring"
why = """
Help ▸ Snuffling Help describes every built-in. Qt renders each snuffling's full
docstring as its own help page; the web shows one window with a written summary per
snuffling, because the bridge's snufflings are functions, not docstring-carrying
plugin classes. The panels keep their inline descriptions and hover text.
"""

[[feature]]
qt_prefix = "<ctrl> + "
title = "Ctrl+P has nothing to bind: Print is deliberately not offered"
why = """
Qt gives five File-menu commands accelerators. Four are bound here on Qt's own
chords: Open (Ctrl+O), Save markers (Ctrl+S), Save selected markers (Ctrl+Shift+S)
and Save image (Ctrl+E). Ctrl+O and Ctrl+S shadow browser bindings deliberately:
egui consumes the handled key, and snuffler muscle memory outweighs the host's
Open-file and Save-page on a page that is an application.

Ctrl+P stays unbound because its command does (see `File/Print`).
"""

[[feature]]
qt = "<f11>"
title = "Full screen is on `f`, not F11"
why = """
F11 belongs to the browser, and fighting it would shadow something the user
expects. `f` (and View ▸ Fullscreen) calls the browser's Fullscreen API on the
document element, the one path that works on the web, since eframe's
`ViewportCommand::Fullscreen` lands in an unhandled arm there.
"""

# [[manual]] entries: differences no tier can observe yet.
# `enforce` names the check that would observe each one, which is the path out of
# this section.
# Three blind spots account for most of what follows, and closing any of them
# would graduate a whole group at once:
#
#   * tier 2 diffs menu, control and key *names*.
#     It never compares a combo box's option set, a control's range, a menu
#     item's enabled or checked state, or the `snufflings` section its own Qt
#     extractor already emits in full.
#   * tier 3 snapshots menu checkables, four control values and marker identity.
#     It does not carry the view time range, the track order, marker placement,
#     or any state belonging to a window it did not open.
#   * no tier compares rendering, by design, so anything whose only symptom is
#     what is drawn lands here even when it changes information rather than
#     appearance.

[[manual]]
key = "waterfall-colormap-set"
title = "The Reverse toggle inverts the value where snuffler renames the colormap"
enforce = "a tier-2 control diff that compares combo box choices, not just names"
why = """
The colormap set is snuffler's nine — viridis, plasma, magma, binary, Reds, copper,
seismic, RdBu and YlGn, in snuffler's order (`ColorbarControl.AVAILABLE_CMAPS`,
gui/util.py:651) — sampled from matplotlib by name, so the colours are identical.

Signed off: Qt reverses by appending `_r` to the colormap *name*
(`gui/util.py:768`), leaving its combo showing the un-reversed one, where the web
keeps an orthogonal flag and inverts the normalized value. Same image either way,
and Qt's version has a bug worth not copying: it strips with `cmap.rstrip('_r')`,
which turns `copper_r` into `coppe`.
"""

[[manual]]
key = "color-traces-theming"
title = "Trace coloring: snuffler's own under the Qt theme, this frontend's under its own"
enforce = "nothing — no tier compares rendering; the palette, key and numbering halves are pinned by paint module unit tests"
why = """
In Qt, Color Traces recolors the wiggle strokes from `graph_colors`, numbered over
the sorted distinct values of the subsort's coloring key (`color_lookup` over
`pile.gather_keys`, `pile_viewer.py:3467`). Under the **Snuffler Qt** theme the web
does the same: the per-subsort keys including CNSL's net+sta+loc composite, the
sorted-key numbering over the whole pile (`ViewMeta.color_keys`, so a key keeps its
colour as the view scrolls), snuffler's seven `graph_colors`, and black past the
seventh key. Pinned by paint module unit tests.

The **Snuffler Web** themes are this frontend's own and depart on purpose, signed
off:

  * Each keeps a palette of its own: seven hues at the lightness its canvas needs,
    fitted to keep all 21 pairs distinct (`adr/0001-wiggle-theme-design.md`), and
    wraps rather than going black past the seventh key.
  * They fall back to the per-track label when the coloring key is empty, so
    single-location data stays varied where snuffler would paint every trace alike.
  * With the boxes hidden, their strokes are numbered by the box style
    (`determine_box_styles`) rather than the coloring key, so hiding the boxes
    hands the row distinction the boxes carried to the wiggle instead of drawing
    identical wiggles. Location-grouped rows keep colouring by the key, because
    there the key is the only thing telling a row's traces apart.

The trace *boxes* are not a departure under any theme: every palette colours a box
by the pile's `determine_box_styles` index, as Qt's `box_styles[istyle % 7]` does.

Defaults follow the theme until the user clicks the option, and an untouched setting
is persisted as absent so it keeps following. Fieldbook and Snuffler Qt default to
Fill: boxes on and Color Traces off, as upstream does (`pile_viewer.py:1076` adds
Color Traces without `setChecked`). Fieldbook keeps its boxes in light and dark;
the other themes draw boxes on light only. The disabled mood themes color strokes
where boxes cannot separate the traces. Explicit View choices override these defaults.
Snuffler has no dark canvas, so Fieldbook's dark default cannot diverge on the
canvas snuffler owns.
"""

[[manual]]
key = "trace-display-shortcut"
title = "Stroke/Fill is a web-only shortcut for existing View options"
enforce = "checkTraceDisplayShortcut in tests/a11y_browser_validate.ts verifies both View checkboxes, mixed-state disabling, and preservation of custom combinations; tier 2 reports web-only controls without treating them as missing Qt features"
why = """
The bottom-row button adds no setting: Stroke is Show boxes off and Color Traces
on; Fill is the inverse. Clicking either switches both existing options, exactly
as setting them individually in View does. With both on or both off, the button
shows a disabled Mixed state and explains how to restore a complementary pair.
It is also disabled in Waterfall, where Color Traces is unavailable.
The original Qt menu options remain available and retain their own semantics.
"""

[[manual]]
key = "marker-palette-theming"
title = "Marker kinds: Tango under the Qt theme, the same families in the web theme's own shades"
enforce = "nothing — no tier compares rendering; the family-per-kind, contrast and lit-is-lighter halves are pinned by paint module unit tests, and the Qt palette's `select_color` arithmetic by markers.rs"
why = """
Qt colours a marker by kind from `g_color_b` (marker.py:53): the Tango "3" shade
idle, the "2" shade when selected or alerted (`select_color`, marker.py:306). Under
the **Snuffler Qt** theme the web uses exactly those, on Qt's white label plate.

The **Snuffler Web** themes keep the contract and change the shades. Kind N is the
same colour family on every theme — 0 red, 1 green, 2 blue, 3 orange, 4 purple,
5 brown, 6 yellow, 7 grey — fitted in OKLab at the Tango family's own hue angle, and
a selected marker still lifts to a lighter shade of its kind. What moves is
lightness: the Tango shades were built for white, and on the dark canvas skyblue3
and plum3 sit below 2:1, while on the light canvas the lit chameleon2 and butter2
sit below 2:1. The web shades hold 4.8:1 and up idle on light and 6.3:1 and up idle
on dark, and the label plate is the canvas colour rather than white. The kind
buttons in the control strip and the table's symbol column take the same palette.
"""

[[manual]]
key = "qt-theme-residual-chrome"
todo = true
title = "What the Snuffler Qt theme has been held against snuffler, and what has not"
enforce = "a pixel check on the wiggle canvas against a `qt_oracle` PNG of the same scenario — the oracle already renders one (`want_png`), and nothing yet diffs it. Until that exists the comparisons below are an agent reading the two PNGs side by side, which is what the screenshots are written for."
why = """
The Snuffler Qt theme is the one that claims fidelity, so what has and has not been
checked belongs written down. Examined against rendered `qt_oracle` PNGs of
`bonin-subsort-grouped` and `demo-raw-full`:

  * Canvas text is bold, as snuffler's is (`pile_viewer.py:542`, `:3203`): the port
    draws the canvas in Geist Bold (`view::canvas_font`, and `font-weight` on the
    SVG path). Font metrics differ from Qt; the current Geist face has not been
    measured against the oracle PNGs.
  * The axis label layout is snuffler's: rows centred under the tick that earned
    them with the left-edge fallback, the `l0` to `l0_brief` abbreviation ladder
    against `pinc_approx*0.9`, and the half-interval `ushift`, pinned by
    `timeaxis`/`paint` unit tests against snuffler's `TimeScaler`.
  * The track label chip is the text's own bounding rect under a white brush at
    alpha 100 (`gui/util.py:294`, `pile_viewer.py:3230`): square and unpadded,
    `Palette::label_pad`/`label_rounding` zero under this theme.
  * The canvas white, `aluminium5` traces and axis, the seven Tango box styles at
    `box_alpha = 100` with snuffler's per-trace style assignment, `graph_colors`
    strokes with black past the seventh key, 10 px tick marks, and no grid or row
    rules.

Open: the marker drawing, the scale annotations and the whole waterfall path have
never been held against snuffler, and a pixel check would say all of it better than
measurements of single labels do.

The theme is light only, structurally: `WiggleTheme::pinned_polarity` pins it to the
white canvas and the frontend disables the light/dark control while it is selected.
Snuffler is white-canvas by construction, so a dark rendering of its numbers would
be a different theme wearing the name, and every parity claim about this theme is a
claim about light.
"""

[[manual]]
key = "waterfall-pipeline"
title = "The waterfall builds its image from labelled track rows, not chopper-order trace rows"
enforce = "a waterfall check kind comparing TraceWaterfall.get_image's `data` array against the web's pre-colorize strips, resampled to a common grid"
why = """
Qt builds one image for the whole track area, one row per *trace*, on a single shared
time grid: it takes `raw_deltat = min(tr.deltat)` across the rows and `num.interp`s
every trace onto it, and it drops whole rows when there are more traces than pixel
rows (`pile_viewer_waterfall.py:95`). The web builds one strip per span of a *track*
row, positioned at that span's own x extent.

The placement is signed off, on strong grounds: Qt draws its NSLC track labels at
track row positions, outside the wiggle/waterfall branch (`pile_viewer.py:3518`),
while its image rows come from `pile.chopper` order — file and time order, not track
order. So snuffler's waterfall labels point at the wrong rows whenever any track
carries more than one trace, and its row dropping discards channels outright once
there are more traces than pixel rows, where the web pages and loses none.

The normalisation and stride follow the row definition: `_waterfall_row_strips`
takes the peak across *every* strip of a row before dividing, and derives one
decimation stride per row, so the two segments of a gapped channel share one colour
scale and one time resolution on their shared row — the row-scope analogue of
snuffler's per-row normalisation (`pile_viewer_waterfall.py:148`).

What would show against `TraceWaterfall.get_image` is the row identity itself and
Qt's `num.interp` resampling against plain striding, both consequences of the
placement above.
"""

[[manual]]
key = "autoscale-guards-and-precision"
title = "One y-range guard remains: an all-NaN slice scales to (0, 1)"
enforce = "a corpus channel carrying NaN samples across a whole window"
why = """
The range uses `nanmin`/`nanmax` exactly as `trace.minmax` does (trace.py:2549), so a
NaN sample is ignored as in Qt, and the range scalars cross the bridge as proto
`double`.

Signed off: when *every* sample in the slice is NaN, the web falls back to a (0, 1)
range. Qt hands that case to `AutoScaler` whole and draws a nonsense axis; a
definite 0..1 axis instead of NaN geometry follows the same never-reproduce-a-crash
rule the `:` command guards follow.
"""

[[manual]]
key = "filter-failures-swallowed"
title = "A filter or restitution that throws becomes a status notice, not an exception"
enforce = "a tier-1 scenario supplying a corner that makes the filter raise, asserting the notice; today no scenario produces one"
why = """
Snuffler lets the exception out of `prepare_cutout2` and the user sees a traceback.
A browser view must not die on an exception, so `_filter_seg` and
`_remove_response` record the failure, `ViewMeta.notices` carries it with the view
it affected, and the status line shows it (the full list on hover). Signed off.

A failure rolls the segment back to its pre-filter samples, since the FFT branch
detrends before it can fail and the IIR branch can half-apply, so "drawn
unprocessed" is literal. The notices ride the cutout cache: a pan that reuses the
processed cutout re-emits them, so a warning lives exactly as long as the data it
warns about.
"""

[[manual]]
key = "timeaxis-algorithm"
title = "The time axis stays f64 below the millisecond"
enforce = "the timeaxis unit tests, which pin the increment choice, the calendar anchoring and the label ladder against values from snuffler's own TimeScaler"
why = """
`snuffler_web_core::timeaxis` transcribes `TimeScaler`/`TimeAx`: the 18-value `acceptable_tincs`
table chosen by nearest entry to `span / 7`, calendar-anchored tick walks, the
five-level label ladder with its abbreviation fallback, the centred-between-ticks
shift, the context rows and the year-at-epoch suppression for synthetic data.

One simplification is signed off: snuffler switches to its `hpfloat` high-precision
time below millisecond increments; the port stays `f64`, which drifts only below the
millisecond at large epochs.
"""

[[manual]]
key = "scale-annotation"
title = "'Show Scale Axes' draws snuffler's ticks and numbers"
enforce = "a tier-1 `scales` extension returning the tick set rather than only (ymin, ymax)"
why = """
The axes mode draws a tick and a number at every `AutoScaler` increment inside
the track's range, with the shared `×10^n` exponent on the topmost and the zero
line shortened so it does not run under the y = 0 label; the ranges mode prints
`%g` min/max at the row corners with the little bracket when boxes are off. Both
follow pile_viewer.py:3345-3434: axes *replaces* ranges when both are on, neither
draws on a row shorter than about four text lines, several scales on one row step
leftward past each other, and the numbers take the trace colour under Color
Traces. The increment and exponent come across the bridge (`ViewSpan.ytick_step`,
`.ytick_exponent`) from the same `AutoScaler` call that makes the range, so the ticks are
pyrocko's, not a frontend recomputation.

One difference is signed off: Qt derives `approx_ticks` from the track height
when the axis is shown (`max(3, min(nlinesavail*0.5, 15))`, pile_viewer.py:3261)
where the bridge passes a flat 15. That moves the tick spacing only, never
`ymin`/`ymax` — `snap` is false in exactly that configuration on both sides — so
the increment is a layout decision the frontend owns.
"""

[[manual]]
key = "trace-drawing-details"
title = "With Clip Traces off, the web still clips to the track area"
enforce = "the tier-1 `boxes` check (every scenario compares the bridge's boxes to Qt's recorded box paints) plus the paint module pile-backed box test; nothing compares the zero line and clip, which are one-line rules"
why = """
The Show Boxes colour advances per contiguous run of samples (`_box_styles`, a
transcription of `determine_box_styles` over the whole pile in `full_id` order,
pile_viewer.py:2947). The zero line is drawn only when zero falls inside the track's
y range and stops short of the scale labels. With Clip Traces on, the clip is the
same 90 % inner box the trace is scaled into (pile_viewer.py:3186, :3462).

Signed off: with Clip Traces off the web still clips to the track area where Qt
restores the widget-wide clip, a tightening that keeps a spike out of its
neighbours' rows.
"""

[[manual]]
key = "canvas-additions"
title = "An optional on-screen grid and a cursor crosshair, never exported"
enforce = "a byte-level check of the exported SVG, which would catch the grid leaking back into it"
why = """
Two screen-only additions over snuffler's canvas, both excluded from the exported
figure, which is where fidelity to snuffler's `savesvg` matters.

The grid: full-height vertical rules at the tick times, behind the traces, gated on
`show_time_grid` (off by default, so the default look matches snuffler) and
suppressed when `paint()` runs for the SVG/PNG export. The Snuffler Qt theme never
draws it. `pal.zero` carries at least `pal.grid`'s contrast in every palette, so the
zero-amplitude reference always outweighs the decoration beside it.

The crosshair follows the pointer on screen only (it lives outside `paint()`). The
status line already prints the cursor time, as Qt's status bar does, but a number
cannot say which wiggle on another row lines up with the one under the pointer,
which is what a vertical hair is for.
"""

[[manual]]
key = "marker-file-fidelity"
title = "The marker file round-trips through pyrocko's own writer, with two knowable losses"
enforce = "a marker-file round trip: build a fixed marker set on both sides, save, and diff the text"
why = """
The format is shared code: the web calls pyrocko's own `save_markers`/`load_markers`,
and the marker objects handed to that writer carry what Qt's carry — sub-second
digits from the data's sample interval (`time_fractional_digits`), the full
`nslc_ids` list, the automatic flag, incidence/take-off angles, the event's own
`name`/`region`/`catalog`, and phase rows linked to their event row through a shared
`model.Event`, so `associate_phases_to_events` re-links them on load.

Two losses are accepted:

  * A kind outside 0..255 is folded modulo 256 on load: the transport is unsigned
    8-bit where Qt keeps a Python int. Both sides only ever create 0..7; a file
    carrying anything else was hand-edited.
  * Incidence and take-off angles survive the file and feed the hover readout, but
    the web has no per-marker editor for them.
"""

[[manual]]
key = "marker-overload-full-quiet"
title = "Past 2000 markers the web silences the per-trace passes Qt keeps paying for"
enforce = "the paint module overload tests: the count readout appears, and past the limit no marker colour reaches an SVG holding real samples"
why = """
Qt's 2000-marker limit (`with_key_in_limited`, pile_viewer.py:3027) guards only its
overview layer: the per-trace loop iterates the unlimited `with_key_in`
(pile_viewer.py:3480), so above the threshold Qt still draws every snippet,
uncertainty box, vertical and label — and pays markers x traces for it on every
repaint. The web applies the same verdict to all three passes (overview, per-track
decorations, the snippet re-draw in the trace loop), leaving only the dotted
overview line and the count readout.

Deliberate: the browser repaints the whole view on every interaction frame, and
the readout exists precisely to cap that per-frame work.
"""

[[manual]]
key = "phase-key-names"
title = "The phase-key mapping ships Qt's built-in default and is not configurable"
enforce = "tier-3 `markers` — the identity tuple carries `phase`, so a scenario pressing <f3> on a selected marker pins the shipped mapping"
why = """
The function keys name Qt's defaults — F1:P, F2:S, F3:R, F4:Q, F5:?, with F6-F9
falling through to the literal `Undefined` (`config.py:33`, pinned by a unit test in
`markers.rs`) — so a pick carries the same name into the same marker file on both
sides.

Signed off: Qt reads `phase_key_mapping` from `~/.pyrocko/snuffler.pf`; a browser has
no home dotfile, so the web ships the built-in default with no way to change it.
Interoperability with an unconfigured snuffler wins, and a settings store for it
would be its own feature (`startup-and-persistence`).
"""

[[manual]]
key = "active-event-lifecycle"
title = "Catalog loads auto-activate the largest event"
enforce = "tier-1 `annotations` — a scenario that loads the eifel catalog, sorts by distance, and either activates a non-largest event or deletes the active one"
why = """
Qt never activates an event on its own; the web does on catalog search and
event-file load, so distance sorting works out of the box on a page anyone can open
without reading the help. Signed off, and visible: the auto-activated marker carries
`active`, so the canvas outline and the table show the event Python measures
distances from.

Everything else follows Qt: every load path registers its events in
`_EVENT_REGISTRY` with full origins, so `e` activates the real origin; deleting the
last marker of the active event clears the active origin; and F-keys associate the
named pick with the active event in the same keystroke, as `set_phase_kind` does.
`EventSnapshot` is the shared registry projection every event edit returns, so map,
export, Kagan/distance columns and Python computations see one origin.
"""

[[manual]]
key = "marker-table-surface"
title = "The marker table keeps a web-shaped surface over Qt's semantics"
enforce = "a table-column inventory on both sides, which tier 2 has no notion of today"
why = """
The semantics are Qt's: Dist is this event to the active event in `%.5g` km, blank
on non-event markers; Uncertainty and Event Hash columns; the pipe-joined NSLC list;
a plain row click replaces the selection (Ctrl/Shift adds) and a double click
re-centres the view; the label cell edits a pick's phase or an event's name.

Signed off as web-shaped: the span and per-row-action columns and the toolbar
(Select/Deselect/Delete/Clear), affordances for a page with no menu-bar chrome; all
columns always visible instead of Qt's header context menu, column hiding,
numbering toggle, print and row-zoom; no inline beachball (the action button opens
it); Clear all asks before destroying every marker; and no key forwarding from the
table to the viewer — egui focus rules differ from a QTableView's, and Up/Down over
the table still reach the polarity binding when no widget holds focus, which Qt
avoids by eating those two keys in the table.
"""

[[manual]]
key = "visible-track-count-control"
title = "Visible track count and optional fractional rows replace pixel-based track sizing"
enforce = "checkVisibleTracks in tests/a11y_browser_validate.ts checks whole and fractional values, Snap rounding, resize stability, and keyboard zoom; snuffler-web-render layout tests verify the number and geometry of visible rows"
why = """
Accepted drift: the web exposes the number of visible tracks instead of a row
height in pixels. This directly describes what fits on the canvas and retains the
same count across window resizing. Snap defaults on, restricting the count to
whole tracks and aligning vertical scrolling. With Snap off, values such as 3.5
show a partial track and permit continuous scrolling. Enabling Snap rounds the
current visible count to the nearest whole track.

The count is bounded by the available tracks without replacing a larger preference
when a transient view has fewer rows. The initial target and the `=` reset remain
24 tracks, matching the Qt application; `+`, `-`, and Ctrl+wheel update the same
count. These web-only controls add no missing Qt feature and require no broad
exception to the inventory or the shared control comparisons.
"""

[[manual]]
key = "view-navigation-keys"
title = "The axis pan strip keeps its own height"
enforce = "a view time range in the tier-3 snapshot, plus a wheel action in the drivers"
why = """
The navigation keys follow Qt's arithmetic: `g`/`G` and `goto` re-fit through a
transcription of `make_good_looking_time_range` (`good_looking_time_range` in
`session.rs`), Ctrl+wheel steps the shown track count by `max(1, n/5)` per notch,
the arrows nudge a selected marker by one screen pixel of time, and a single-track
view is always reachable through the visible-track count.

Signed off: the pan-only strip under the time axis is 80 px in Qt and 52 px in the
web (`pile_viewer.py:810`, `layout.rs:8`). The strip is exactly each side's drawn
axis, and the two axes are legitimately different heights.
"""

[[manual]]
key = "keyboard-focus-sharing"
todo = true
title = "A keyboard-only user who tabs into the page cannot get Tab-cycling back"
enforce = "a tier-2 probe that focuses a control before pressing a key, rather than clicking the canvas first as it does today"
why = """
Arrows and Space are the keys egui's focused widgets also act on, so the canvas
handler declines them while any widget holds focus; letters stay live, because
gating every key on focus makes the app a keyboard dead end.

Open: Qt's viewer intercepts every key press before Qt's focus machinery, so Tab
never leaves the canvas (`pile_viewer.py:2209`). The web passes Tab through whenever
the accessibility overlay, on by default, holds DOM focus. Not swallowing Tab
globally is right: a canvas with no exit is a keyboard trap, and WCAG 2.1.2 allows
consuming Tab only where a documented, announced exit exists. As shipped, the mouse
user who clicks the canvas gets Tab-cycling and the keyboard-only user who tabs into
the page loses it with no route back. A roving tabindex, or an announced Esc/F6
exit, keeps both.
"""

[[manual]]
key = "command-line-semantics"
title = "The `:` commands match Qt; where they answer, Qt is silent or crashes"
enforce = "a tier-1-style check over snuffler_bridge.commands.run and state.visible_traces against PileViewerMain.add_blacklist_pattern and update_trace_filter; the seam exists on both sides"
why = """
The grammar, history, quick filter, blacklist bookkeeping, the `markers` and
`scaling` arguments, the anchored `hide <token>` matching (`util.match_nslc`
semantics), the colour-bar gestures and `goto`'s window floor match Qt.

Two divergences are signed off, both answers where Qt has none:

  * An unmatched event name and a bare `goto` are silent no-ops in Qt
    (`pile_viewer.py:4410`, `:4455`) and errors here. A silent non-jump is worse
    than a message, and the web accepts more time formats besides.
  * `scaling foo bar` raises an uncaught `ValueError` out of Qt's slot, and
    `scaling <pattern> ...` in Common-Scale mode would crash Qt on
    `'.'.join(None)`. The web guards both. Never reproduce a crash.
"""

[[manual]]
key = "panel-and-window-model"
title = "Panel togglers are checkboxes, and tier 2 cannot see Qt's"
enforce = "giving inventory_qt.collect a panel parent so Qt's togglers exist in the tier-2 diff; until then, a tier-3 step that opens two snufflings"
why = """
Every snuffling panel is its own `egui::Window`, and panels coexist like Qt's
tabified dock widgets (`snuffling.py:226`). The Markers and Main Controls togglers
sit in the Snufflings menu, where Qt files its panel togglers (`toggle_panel_menu`,
`pile_viewer.py:860` with `snuffler_app.py:667`).

Signed off: the togglers are checkboxes, where Qt's actions only ever *show* a panel
and leave `m` and `c` to hide it. That is pyrocko hand-wiring
(`toggle_panel(dockwidget, True)`, `snuffler_app.py:762`), and a checkbox that says
whether the panel is open beats an action that does not.

Two harness blind spots: `inventory_qt` builds a bare `PileViewer` with no panel
parent, so Qt's togglers never exist on the Qt side of the tier-2 diff (the web's two
show up as web-only extras); and the menu bar's corner strip is skipped as a layout,
so Qt's `+`/`-`/`:` corner buttons are never compared — the web carries `:` with Qt's
tooltip, and the `+`/`-` keys plus the Visible tracks slider cover the other two.
"""

[[manual]]
key = "snuffling-run-scope"
title = "Snufflings run over selected marker spans through the shared pile chopper"
enforce = "a tier-3 scenario that places and selects a channel-scoped span marker, runs a snuffling, and runs it again — asserting the output honours the channel patterns and that the rerun replaced its predecessor; the `markers` check kind already exists and no browser scenario runs any snuffling yet, while `task test:parity:bridge` pins the channel scope and rerun contracts at the bridge level"
why = """
No tier observes this yet, so the contract is recorded here. The request carries the
selected non-event markers, each span plus its channel patterns, which is Qt's
`chopper_selected_traces` scope, and every built-in falls back to the visible window
when nothing is selected. Polarization *requires* a selection, as Qt's does.

  * Minmax, the amplitude spectrum, STA/LTA, RMS, spectrogram and SeisBench chop
    through `_chopper_selected_traces`, a port of Qt's iterator over the real
    `pyrocko.pile.Pile`, so degapping, `full_id` order and incomplete-window weeding
    are pyrocko's own. Seismosizer applies Qt's conjunction: a channel yields a
    synthetic target only where a marker matches it and holds its data.
  * SeisBench runs Qt's 300-second batches with one second of model padding plus
    `2/highpass` settling padding, applies the main viewer's filters by default,
    and keeps only picks inside each batch window. It runs one inference pass per
    span, so the model never sees the data between disjoint markers.
  * Re-running a marker-producing snuffling (Cake, STA/LTA, SeisBench, Seismosizer)
    replaces its previous markers through an origin tag, Qt's `cleanup()` contract;
    derived traces are replaced by identity (`_replace_derived`).
  * A failed run never leaves half its output: STA/LTA and RMS clean up before the
    first fallible step, and Seismosizer commits nothing until every fallible step
    has passed, retiring its prior event only while the registry still holds that
    exact object.
"""

[[manual]]
key = "snuffling-control-surface"
title = "The Seismosizer shares its store and waveform-type choices across source types"
enforce = "a fourth tier-2 diff over the `snufflings` section — the Qt extractor already emits every Param, Switch and Choice with name, default, minimum, maximum and choices, and nothing consumes it"
why = """
The snuffling controls carry Qt's shapes: every `Param` with a positive minimum is
logarithmic (`gui/util.py:512`); the filter-corner range runs from
`(0.5/deltatmax)·0.0001` on the coarsest channel to the finest channel's Nyquist;
STA/LTA, polarization and RMS apply their own corners as a 4th-order lowpass then
highpass; and the Cake model combo carries Qt's "Cake builtin: " prefix. The unified
Seismosizer panel carries each Qt source panel's own bounds and keeps each source
type's dial values across switches (`switch_source`), because Qt's five snufflings
are independent dock panels.

Signed off: the store and waveform-type choices are shared across source types,
unlike Qt's per-snuffling copies. Re-picking the store per source is pure friction,
and the choice carries no cross-source bounds to clamp by.
"""

[[manual]]
key = "snuffling-computations"
title = "What the snufflings compute matches snuffler, with three named residues"
enforce = "tier-1 `presence`/`tracks`/`samples` over derived traces for STA/LTA and RMS; tier-3 `markers` for Cake; no tier for the figures; `task test:parity:bridge` pins the minmax folding, the chopper adapter, polarization's windowing and the Seismosizer failure contract in CPython"
why = """
Every snuffling consumes the pile's data, never the screen's: the GUI Rotate control
is not applied (`chopper_selected_traces` does not respect it, snuffling.py:985),
traces iterate in the chopper's `full_id` order (pile.py:1213), and the `inview`
scope selects rows through the gather key (pile_viewer.py:1798). Derived `tabu`
traces stay out of STA/LTA (stalta.py:165) and SeisBench (seisbench_picker.py:257),
and Minimum/Maximum folds raw values through `trace.minmax` into one row per channel
(minmax.py:49).

Three residues, signed off: the selection markers Qt's polarization adds arrive
only from the run path, because the figure rpc returns an image and has no marker
channel; 2-component station groups are resolved by the scheme table but not drawn,
because the hodogram triptych needs Z; and the spectrogram's colorbar is
matplotlib's layout, not Qt's smartplot frame chrome.
"""

[[manual]]
key = "snuffling-service-surfaces"
title = "The service forms carry Qt's workflows, minus what CORS and GMT forbid"
enforce = "the same tier-2 `snufflings` diff, plus reading the controls of windows the inventory does not currently open"
why = """
Catalog search, the radius-around-the-active-event download with its Save of
MiniSEED plus a station file, the map, the five Seismosizer sources and the
SeisBench controls follow Qt's workflows.

Signed off, with reasons:

  * Global-CMT and Saxony are HTML/text scrapes over endpoints without CORS; the
    native-catalog list stays FDSN-only.
  * SeisBench ships three model/weights exports (a build-size decision), its
    threshold defaults come from each export's calibration metadata rather than
    Qt's flat 0.3, and it runs on Run rather than live on every pile change — a
    WebGPU forward pass is not a keystroke-rate operation.
  * "Open in external browser" and the GMT map provider shell out to things a page
    cannot reach.
"""

[[manual]]
key = "data-loading-robustness"
title = "A partially failed multi-file open reports to the console, not a dialog"
enforce = "tier-1 `presence`/`tracks` for the append and duplicate cases; a scenario feeding a malformed file for the error surfacing"
why = """
The load paths follow snuffler's: the FDSN download appends to the pile
(download.py:140); StationXML documents accumulate in load order and resolve
first-match (`pile_viewer.py:4470`); a directory open hands every file to format
detection; one unreadable file in a multi-file open is skipped rather than aborting
the batch; and a file already in the pile is refused by content digest, the browser
twin of Qt's absolute-path check (pile.py:1115).

Signed off: Qt reports a partially failed multi-open in a dialog at the end
(pile.py:502); the web logs the skipped names to the console and raises only when
*nothing* loaded. The scene travels back on the same call that loads it, so failing
a partially successful open would discard the traces that did load.
"""

[[manual]]
key = "startup-and-persistence"
title = "Query parameters stand in for the command line, localStorage for snuffler.pf"
enforce = "a fourth inventory section extracting Qt's optparse options against the web's query-parameter readers"
why = """
The URL is the browser's command line: `?url=` opens a waveform by URL (the
positional-path twin), with `?format=` naming its format the way `--format` does,
which is how formats pyrocko's sniffer misses (segy, seisan, kan, gcf, css) get in.
`?example=` and `?demo=1` pick the boot dataset.

Qt's user-editable `SnufflerConfig` settings (config.py:33) — demean, the two scale
annotations, the scaling mode, show boxes, clip traces, the chosen visible length —
are written to `localStorage` on change and applied at boot, one key per setting
like a `.pf` line. Qt persists the visible-length *table*; the web's entries are
fixed, so the choice is what there is to keep.

The rest of Qt's options stay deliberately unported:

  * `--pattern`, `--cache`, `--force-cache`, `--store-path` name filesystem paths a
    browser cannot read.
  * `--ntracks`, `--hptime`, `--disable-marker-sorting` tune what the web handles
    differently by construction: the shown track count follows the Visible tracks
    slider, times are always f64, and the marker table always sorts.
  * `--follow N` lives on the Live SeedLink form (see `live-acquisition`).
  * The phase-key map is a fixed table (see `phase-key-names`).
  * GF-store search paths are directory handles, which the browser grants only
    through a live picker gesture, so they cannot be restored from storage.
"""

[[manual]]
key = "live-acquisition"
title = "Live data is bounded and replaces the pile"
enforce = "a view time range in the tier-3 snapshot for the follow suspension"
why = """
Following suspends for 10 s after any interactive range change, re-armed on every
further change, exactly Qt's `interactive_range_change_delay_time`
(`pile_viewer.py:1253`, `:4235`). The follow window and the retention bound are on
the Live SeedLink form, and the received buffer downloads as MiniSEED on demand.

Signed off:

  * The web discards live data older than the Keep bound where Qt keeps
    everything. wasm32 has a single bounded heap, so an unbounded live buffer is a
    real hazard; the bound is the user's number.
  * Starting a stream replaces the pile, where Qt mixes stream data into whatever
    is loaded. The retention trim runs over the whole pile, so mixed with loaded
    files it would either chop the user's files or exempt them and unbound the
    buffer. Stopping the stream keeps the received samples for saving.
  * Qt's continuous write-to-disk has no browser equivalent: silent writes to an
    arbitrary path are what the sandbox exists to prevent.
"""

[[manual]]
key = "network-reach"
title = "Fewer reachable services than Qt, said plainly instead of reported as no data"
enforce = "a tier-2 control diff that compares combo box choices — the same extension `waterfall-colormap-set` needs"
why = """
A failed station, response or event query surfaces as the error it is: only 204 and
404, FDSN's own no-data codes, read as empty, and a 403 from the local proxy's
allowlist retries the host directly before failing. The Live SeedLink window states
that the WebSocket tunnel exists only through the local proxy.

Signed off as narrower than Qt:

  * Qt reaches thirty FDSN sites by abbreviation and any host by URL
    (`client/fdsn.py:47`); the direct list here carries the hosts verified to send
    CORS headers, plus the custom-URL field for any other host that does. A
    browser cannot fetch a host that does not.
  * The local proxy's allowlist matches the direct list: an open forwarder is a
    hazard, and a deployment that needs more reach names exact targets via
    `SNUFFLER_PROXY_ALLOW_HTTP_TARGETS` / `SNUFFLER_PROXY_ALLOW_TCP_TARGETS`.
  * The SeedLink origin is compiled in: the localhost proxy is the only route a
    browser has to a raw-TCP SeedLink server.
"""

[[manual]]
key = "chromium-only-file-features"
title = "The File System Access commands say what they need instead of doing nothing"
enforce = "running the tier-2 inventory on more than one engine, or publishing a disabled state on the items"
why = """
`File ▸ Open waveform directory…` and `File ▸ Reload modified files` throw a named
error on engines without the File System Access API, so Firefox and Safari get
"this needs a Chromium-based browser" in the status line. The limit itself is real:
there is no way to re-read a file from disk without `showOpenFilePicker` handles.

Files that arrived by drag-and-drop or the `<input type=file>` fallback register no
handle, so Reload and Watch Files skip them even on Chromium. Tier 2 runs one
engine, so the inventory cannot see an engine-conditional gap.
"""

[[manual]]
key = "example-pile-contamination"
title = "The first real data replaces the boot example instead of joining it"
enforce = "tier-1 `presence`/`tracks`, with a scenario that boots the app path rather than the oracle's empty pile"
why = """
The boot pile, the synthetic demo or an example bundle, is marked as such in the
bridge, and the first load that would append to it (File ▸ Open, the directory
open, drag-and-drop, an FDSN download) replaces it instead, together with its
events, station coordinates and instrument responses, which would otherwise sort
the new data wrongly or deconvolve an overlapping NSLC against the old response.
From then on every open path appends, which is Qt's own behaviour
(`open_waveforms`, `pile_viewer.py:1651`). `File ▸ Close all` gives the blank viewer
Qt boots into.

Two residues are signed off. Markers an example bundle delivered stay when its
waveforms are replaced, since markers are pile-independent on both sides and Close
all clears them. And metadata loaded by hand while the boot example is still up
counts as part of that scene, so replacing the example takes it along; per-source
ownership of stations and responses would preserve it, and is not worth building
while every user-owned load path appends.
"""

[[manual]]
key = "adaptive-visible-length-default"
title = "The default visible length is this frontend's own 'Adaptive', which snuffler does not have"
enforce = "`tests/parity/test_adaptive_visible_length.py`, run with the tier-1 suite: it asserts the policy on both counts — a channel a fixed budget refuses is drawn under Adaptive, and the decimated payload keeps the extremes of the raw samples it replaced. What no tier can see is the *default*: tier 1 pins a Qt-comparable budget in every scenario (`scenario.DEFAULTS['visible_length']`, a float, which cannot spell Adaptive), and tier 3 does not snapshot the radio group."
why = """
Snuffler's Visible length is four fixed sample-count budgets, and the budget is
spent by *refusing channels*: `prepare_cutout2` turns the chosen `nmax` into
`min_deltat_allow` and does not fetch anything sampled finer than the window's
share of it (pile_viewer.py:3597). On a Qt desktop that is a reasonable trade —
the alternative is drawing a million samples into a 1500-pixel-wide track — and
the first entry, Short, is upstream's default.

Its cost is that widening the window makes data *disappear*: on the `tohoku`
example the three 100 Hz strong-motion channels go blank at the default budget
while the 20 Hz broadbands stay, which reads as missing data rather than as a
fetch policy. This port has a cheaper way out of the same trade, because its
canvas already tells the bridge how many bins it can draw (`bins_per_trace`): fetch every
channel, and decimate what comes back to the min and max of each bin. The peak
inside a bin survives, so the drawn trace is the one the raw samples would have
drawn. On `tohoku`, Adaptive and Short differ by ~1 % of pixels on the channels
both fetch, and Adaptive additionally draws the three Short leaves blank.

So this frontend adds a fifth entry, Adaptive, and boots into it. Qt's four are
