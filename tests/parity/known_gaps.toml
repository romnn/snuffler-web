"""

[[manual]]
key = "keyboard-focus-sharing"
bucket = "soft"
todo = true
title = "A keyboard-only user who tabs into the page cannot get Tab-cycling back"
enforce = "a tier-2 probe that focuses a control before pressing a key, rather than clicking the canvas first as it does today"
why = """
The double-action half is fixed: arrows and Space are the keys egui's focused
widgets also act on, and the canvas handler now declines them while any widget
holds focus — a focused Highpass slider plus Left moves the slider only, a focused
checkbox plus Space toggles only. Letters stay live, and the gate deliberately does
not widen to all keys: gating on any focus at all once made the app a keyboard dead
end, which the handler's comment records.

What remains open is the Tab story. Qt's viewer intercepts every key press before
Qt's focus machinery, so Tab never leaves the canvas (`pile_viewer.py:2209`). The
web passes Tab straight through whenever the accessibility overlay holds DOM focus,
and that overlay is on by default. Not swallowing Tab globally is right — a canvas
with no exit is a keyboard trap, and WCAG 2.1.2 allows consuming Tab only where a
documented, announced exit exists. As shipped, the mouse user who clicks the canvas
gets Tab-cycling and the keyboard-only user who tabs into the page loses it with no
route back. A roving tabindex, or an announced Esc/F6 exit, keeps both.
"""

[[manual]]
key = "command-line-semantics"
bucket = "soft"
title = "The `:` commands match Qt; where they answer, Qt is silent or crashes"
enforce = "a tier-1-style check over bridge._command_result and _visible_traces against PileViewerMain.add_blacklist_pattern and update_trace_filter; the seam exists on both sides"
why = """
The grammar, the history behaviour, the quick filter, the blacklist bookkeeping, the
`markers` and `scaling` argument arms, the anchored `hide <token>` matching
(`util.match_nslc` semantics — a bare word is a full-NSLC glob, exactly what
`help.rs` documents), the colour-bar gestures (double-click reset, symmetric wheel,
the 0.05 minimum band width) and `goto`'s one-visibility-length window floor
(`make_good_looking_time_range`) all match Qt now.

Two divergences are kept on purpose, both of them answers where Qt has none:

  * An unmatched event name and a bare `goto` are silent no-ops in Qt
    (`pile_viewer.py:4410`, `:4455`) and errors here. A silent non-jump is worse
    than a message, and the web accepts more time formats besides.
  * `scaling foo bar` raises an uncaught `ValueError` out of Qt's slot, and
    `scaling <pattern> ...` in Common-Scale mode would crash Qt outright on
    `'.'.join(None)`. The web guards both. Never reproduce a crash.
"""

