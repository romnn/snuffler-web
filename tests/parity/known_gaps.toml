# [[feature]] is the tier-2 allowlist proper: a command Qt offers that the web does
# not. Every entry has to keep matching something — one that stops applying fails the
# run as stale — so this list can only ever describe the present.

[[feature]]
qt = "File/Close"
bucket = "soft"
title = "No 'close the viewer' command"
why = """
The tab is the window. There is nothing for a Close menu item to close that the
browser's own controls do not already close, and a page cannot close a tab it did not
open. That much is a hard wall and the absent menu item is signed off.

What is not signed off is the shortcut. `q` is bound (`waveform.rs:754`) and sends
`ViewportCommand::Close`, which eframe's web backend does not implement — it falls into
the `_ =>` arm and logs "Unhandled egui viewport command"
(`eframe/src/web/app_runner.rs:305`). So `q` does nothing at all, while `help.rs:6`
advertises it as "Quit / close viewer". Either drop it from the help or make it say why
it cannot work; a documented key that logs a warning is worse than an absent one. See
`dead-viewport-shortcuts`.
"""

[[feature]]
qt = "View/Fullscreen"
bucket = "soft"
todo = true
title = "Full screen has no menu item, and the key it was traded for does not work"
why = """
This entry used to say the port "keeps the `f` shortcut (it calls the Fullscreen API)".
It does not. `f` flips `state.fullscreen` and sends `ViewportCommand::Fullscreen`
(`waveform.rs:757`), which eframe's web backend drops in the same unhandled arm that
swallows Close (`eframe/src/web/app_runner.rs:305`). `state.fullscreen` is written and
read by nothing else, and `requestFullscreen` appears nowhere in the tree. Full screen
has never worked in this port, and `help.rs:15` documents it.

The menu item is a separate omission with no excuse at all. Qt's `View ▸ Fullscreen` is
a menu entry whose accelerator happens to be F11 (`pile_viewer.py:1102`); the browser
owning the F11 *chord* says nothing about drawing a menu item, and the View menu already
carries web-only entries beside it. `Element.requestFullscreen()` is available from any
user gesture, which both a menu item and a keypress are.

Closing this means wiring the canvas element's `requestFullscreen` directly rather than
routing through a viewport command the backend does not implement.
"""

[[feature]]
qt_prefix = "Snufflings/Run Snuffling/Get GEOFON Events"
bucket = "soft"
todo = true
title = "The four one-click GEOFON event presets are not offered"
why = """
Qt ships four fixed queries — all events, > M 6, > M 7, > M 8 — as separate snufflings.
The web offers Data ▸ Catalog search (events), which reaches GEOFON with the magnitude
and time window as parameters: one parameterised entry point instead of four presets.

Not quite the same service. Qt's presets go through `pyrocko.client.catalog.Geofon`,
which scrapes `geofon.gfz.de/eqinfo/list.php` (`client/geofon.py:60`); the web queries
`geofon.gfz.de/fdsnws/event/1/query` (`bridge.py:2630`). Only the FDSN one answers a
browser, so the *transport* had to change.

That is the whole of the platform argument, and it does not reach the four menu items —
which is why this is open work rather than a sign-off. What the presets actually give is
"GEOFON events above M7, **in the window I am looking at**, one click": each one reads
`viewer.get_time_range()` (`geofon.py:52`). The web form takes its window from two
free-text UTC fields that boot to a hardcoded 2023-02-06/07 (`state.rs:695`), with the
data centre defaulted to `usgs` rather than `geofon` and nothing ever seeding either from
the view. Reaching Qt's one click takes: open the panel, switch the combo, retype two
dates, drag the slider, search. The magnitudes themselves are fine — 6, 7 and 8 all fit
the 0-9 slider.

Four buttons that fill `cat_*` from `state.tmin`/`state.tmax` and submit would close this
entirely.
"""

[[feature]]
qt = "Snufflings/Run Snuffling/Reload Snufflings"
bucket = "soft"
todo = true
title = "Reloading snufflings has no menu item, and the key does the opposite thing"
why = """
The `R` mechanism is real — it re-fetches `bridge.py` from the server, `importlib.reload`s
it and restores the loaded pile (`bridge_worker.ts:986`). What it is not is an equivalent
of Qt's action, and this entry claimed it was "the whole of what reloading means here".

Qt's `Reload Snufflings` re-scans `snuffling_paths` and reloads *user* modules by mtime
(`pile_viewer.py:1523`, `snuffling.py:1857`); it loads the built-ins exactly once
(`if self.default_snufflings is None:`, `pile_viewer.py:1533`). `bridge.py` *is* the
built-ins. So `R` reloads precisely what Qt's action never touches, and cannot do what
Qt's action exists for. For an end user `bridge.py` is a static server asset they cannot
edit, which makes `R` a developer hot-reload with no user-facing meaning.

And the gap registered here is a *menu item*, which the sandbox argument does not reach:
adding `Snufflings ▸ Reload snufflings` beside the nine existing entries is one button
setting the flag `R` already sets. The true statement — a browser cannot load an unknown
module off disk — justifies a different entry about user snufflings, which
`plan/native-gaps.md` already covers.
"""

