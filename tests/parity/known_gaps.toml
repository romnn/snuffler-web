SeisBench uses Qt's kind 0 for P and 1 for S, marks its picks automatic, and rides
the pick probability on the incidence angle exactly as Qt's picker does — the number
a user most wants back from an ML picker, now saved in the file and readable on
hover.
"""

[[manual]]
key = "view-navigation-keys"
