# Every intentional difference between Qt snuffler and the web port, and the
# reason it exists.
# This file is the single register: if the two behave the same, nothing is
# written down; if they differ, the difference either has an entry here or the
# suite fails.
# An entry is one of two things, and says which:
#
#   signed off   the difference is justified and stays.
#                The `why` carries the justification; "free choice" is not a
#                reason to differ, it is a reason to match.
#
#   todo = true  open work: a difference we intend to close, excused from the
#                diff without being mistaken for a decision.
#                The `why` says what closing it takes.
#
# Five kinds of entry:
#
#   [[numeric]]  tier 1: a place where the two pipelines legitimately compute
#                different numbers.
#
#   [[defect]]   tier 1: a difference that is a bug, found by this suite and not
#                yet fixed.
#                Not an excuse but a register, with the fix in the entry.
#                Scenarios naming a defect print as `bug` rather than `pass`.
#
#   [[feature]]  tier 2: a command Qt has that the web does not.
#                Anything present in the Qt inventory, absent from the web
#                inventory and absent here fails the build.
#
#   [[manual]]   a difference no tier can observe yet, recorded so it is not
#                silent.
#                `enforce` names the check that would observe it, and is
#                required, so every such entry has a way out of this kind.
#
#   [[alias]]    the map between the two frontends' wordings.
#
# The line between [[manual]] and the enforced kinds is mechanical: `evaluate`
# only looks at entries a scenario names in `expect_divergence`, so a [[numeric]]
# or [[defect]] entry nothing names would excuse nothing and never go stale.
# A full tier-1 run fails on any such entry.
#
# `checks` lists the tier-1 check kinds a [[numeric]] or [[defect]] entry
# accounts for.
# `strict` (default true) means the divergence must still reproduce; set it false
# only when the size of the difference is data-dependent and can legitimately
# fall inside tolerance.
#
# An entry covering `samples` may declare `residual = "constant"`: the excused
# divergence must then be a per-segment constant offset, so removing its mean
# leaves a remainder inside the scenario tolerance.
# Declare it whenever the divergence has a describable shape, so a second,
# unrelated sample defect cannot shelter behind the entry.
#
# `subjects.<kind>` narrows the excuse for one check kind to the findings whose
# subject (mostly the dotted nslc) matches one of its glob patterns, and a strict
# entry then has to keep reproducing inside that scope.
# Kinds left out of `subjects` stay kind-wide, which is right where subjects are
# structural (`presence` has one finding, `tracks` has `count` and `order`) or
# where the divergence touches every channel.

[[manual]]
key = "vertical-leg-follows-qt"
title = "The 3D vertical leg is snuffler's, which is not the honest one"
enforce = "`qt_oracle.assert_upstream_geometry`, run before every tier-1 scenario: it computes `set_event_relative_data` on a station with both an elevation and a borehole depth and fails if upstream stops forming the vertical leg as `event.depth - station.depth`"
why = """
`Station.set_event_relative_data` forms the vertical leg as `event.depth -
station.depth` (`station.py:184`): the station's borehole depth, with its elevation
dropped. A station 1.7 km up a mountain is measured as though it stood at sea level.
The geometrically honest term is `event.depth + station.elevation - station.depth`,
and snuffler does not write it.

`snuffler_bridge.sorting.event_distance_m` writes snuffler's version, deliberately.
Parity with the Qt application is the claim this suite makes, so the port follows
snuffler into the error rather than diverging into a better answer nobody can
check it against.
Correcting the formula is upstream's to make, for every pyrocko user at once.

Signed off. The hazard is upstream changing its mind: the day pyrocko adds the
elevation, this port silently becomes the wrong one and every distance sort
diverges by tens of metres. The `enforce` canary asserts the upstream formula
directly, so it fires on a `PYROCKO_REF` bump even if no scenario holds a station
with both an elevation and a borehole, and it fails by this key.
"""

