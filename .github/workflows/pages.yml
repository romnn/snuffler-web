name: GitHub Pages

# Build the web app (Rust/egui wasm + the py-mt Pyodide runtime) and deploy it to
# GitHub Pages. Set the repo's Pages source to "GitHub Actions" to publish.
#
# The app is a single threaded build: our custom Pyodide 314 (docker/pyodide-mt) —
# pthread + OpenMP + SIMD runtime + wheels, served at py-mt/ — plus the egui wasm
# built threaded (wasm-bindgen-rayon). Both need cross-origin isolation, which the
# coi-serviceworker provides (GitHub Pages can't set COOP/COEP response headers).
# There is no single-threaded CDN path anymore; a non-threaded build, if ever
# needed, is produced via the `threads` build-time feature on a separate path.
#
# The custom build (CPython 3.14 + Pyodide from source) is multi-hour, so we
# CACHE ITS OUTPUT — docker/pyodide-mt/served (py-mt, ~54 MB) — keyed on the build
# inputs (the patch, pinned commits, build scripts). A cache hit skips the whole
# build; only an input change forces a rebuild.
# NOTE: the first run (cold cache) does the full build on a GitHub-hosted runner
# (6 h / ~14 GB disk limits). If it doesn't fit, switch to a self-hosted runner
# or commit the built artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      - name: System deps (native egui backend, used by the wheel build env)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # Provision the pinned toolchain (node, bun, uv, trunk, binaryen, protoc —
      # protoc + buf compile the bridge .proto during the trunk build). emsdk is
      # NOT needed here: the Pyodide wheels build inside the pyodide-env docker
      # image (build-all.sh), not via the host emsdk.
      - uses: jdx/mise-action@v4

      # The egui app is built THREADED (off-main-thread PNG export via
      # wasm-bindgen-rayon), which needs a nightly + rust-src to rebuild std with
      # atomics (-Z build-std) — the precompiled wasm32 std is single-threaded.
      # rust-toolchain.toml stays on stable; plain clippy/test (rust.yml) are
      # unaffected. Only this trunk build uses nightly (see the env on the build
      # step + mise.toml).
      - name: Install nightly Rust (threaded wasm build-std)
        run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown

      # Cache the custom-Pyodide build OUTPUTS (not the multi-GB .work tree),
      # keyed on everything that affects them. Hit -> skip the multi-hour build.
      - name: Cache Pyodide 314 build outputs
        id: pyodide-out
        uses: actions/cache@v5
        with:
          path: |
            docker/pyodide-mt/served
          key: "pyodide314-out-${{ hashFiles('docker/pyodide-mt/build.sh', 'docker/pyodide-mt/build-all.sh', 'docker/pyodide-mt/build-packages.sh', 'docker/pyodide-mt/build-pyrocko.sh', 'docker/pyodide-mt/packages.sh', 'docker/pyodide-mt/stage-web.sh', 'docker/pyodide-mt/force_sjlj.c', 'docker/pyodide-mt/patches/**', 'docker/pyodide-mt/pyrocko/meta.yaml', 'pybuild/setup.py', 'pybuild/pyproject.toml', 'mise.toml') }}"

      # pyrocko source is needed both by the build (on a cache miss) and by trunk
      # (index.html ships test.mseed + the cake earthmodels from it), so always.
      - name: Fetch pyrocko (pinned)
        run: mise run fetch-pyrocko

      # On a cache miss, build the custom runtime + the py-mt wheel + stage py-mt.
      # Multi-hour the first time; near-instant cache restore afterwards.
      - name: Build custom Pyodide 314 (runtime + py-mt wheel + stage)
        if: steps.pyodide-out.outputs.cache-hit != 'true'
        run: docker/pyodide-mt/build-all.sh

      # Project pages live under /<repo>/, so the asset URLs must be prefixed.
      # Trunk.toml's post_build hook stages docker/pyodide-mt/served -> py-mt/.
      # Threaded build: the wasm atomics/link flags come from .cargo/config.toml;
      # only nightly + `-Z build-std` (rebuild std with atomics) are build-scoped
      # here, matching the mise serve/build tasks.
      - name: Trunk build (release, threaded)
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_UNSTABLE_BUILD_STD: "std,panic_abort"
          # Worker import is rewritten post-build (Trunk.toml); skip SRI for it.
          TRUNK_BUILD_NO_SRI: "true"
        run: mise exec -- trunk build --release --features threads --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
