name: GitHub Pages

# Build the full web app (Rust/egui wasm + the pyrocko Pyodide wheel) and deploy
# it to GitHub Pages. Set the repo's Pages source to "GitHub Actions" for this
# to publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: System deps (native egui backend, used by the wheel build env)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # Provision the pinned toolchain (python, emscripten, node, bun, uv, trunk).
      - uses: jdx/mise-action@v2

      # Fetches pyrocko at the pinned commit, builds the cross-compiled wheel
      # into dist-py/, which index.html copies into the served site.
      - name: Build the pyrocko Pyodide wheel
        run: |
          mise run setup
          mise run build-wheel

      # Project pages live under /<repo>/, so the asset URLs must be prefixed.
      - name: Trunk build (release)
        run: mise exec -- trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
