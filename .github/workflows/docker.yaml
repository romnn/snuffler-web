name: Docker images

# Build both services in this repo as container images and publish them to the
# GitHub Container Registry: the site (nginx + the wasm frontend + the Pyodide
# runtime) and the FDSN/SeedLink proxy.
#
# Every run builds and smoke-tests each image for amd64, so a broken Dockerfile
# shows up on the pull request that breaks it. Only a release tag pushes: it
# builds the optimized multi-platform images and publishes them, while every
# other run compiles the Rust in the `dev` profile, which is much faster and
# still proves the image builds and serves.
#
#   ghcr.io/<owner>/snuffler-web/web    ghcr.io/<owner>/snuffler-web/proxy
on:
  push:
    branches: [main]
    # bumpversion tags releases as v<version> (.bumpversion.toml); the bare
    # <version> form is accepted too so a hand-cut tag still publishes.
    tags: ["v*", "*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per image per ref. A superseded push has nothing to publish, so
# unlike the Pages deploy this one is safe to cancel.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    # A cold cache compiles the whole Rust dependency graph — for wasm32 with a
    # std rebuild in the web image, and natively through Zig for both proxy
    # architectures. Warm, both are a fraction of that, but the bound covers cold.
    # Generous is safe here: the concurrency group above cancels a superseded
    # run, so a wedged job blocks nothing.
    timeout-minutes: 45
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
      CARGO_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The site payload is architecture-independent — wasm, JS and zips — so
          # its build stages are pinned to the build platform and only the nginx
          # layer differs per architecture. arm64 is close to free here.
          - image: web
            context: .
            dockerfile: docker/web/Dockerfile
            platforms: linux/amd64,linux/arm64
            prebuilt-assets: true
            title: snuffler-web
            description: "Pyrocko's snuffler seismic waveform inspector, in the browser"
            smoke-port: 8080
            smoke-path: /health
            smoke-user: "101:101"
          # Zig cross-compiles both architectures on the runner's native CPU.
          # cargo-chef caches dependencies independently of application sources.
          - image: proxy
            context: .
            dockerfile: docker/proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
            prebuilt-assets: false
            title: snuffler-web-proxy
            description: "Allowlisted CORS and WebSocket-to-TCP proxy for snuffler-web"
            smoke-port: 8080
            smoke-path: /health
            smoke-user: "65532:65532"

    steps:
      - uses: actions/checkout@v7

      # The wasm build's target directory and the site's own 250 MB do not fit
      # beside the runner's preinstalled toolchains, none of which this job uses.
      - name: Free the runner's disk
        if: matrix.prebuilt-assets
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      # The two inputs the web image reads from the build context rather than
      # building (see the header of docker/web/Dockerfile): the pyrocko checkout
      # it stages two data files out of, and the prebuilt threaded Pyodide 314
      # runtime. Both are what `task fetch:pyrocko` / `task pyodide:fetch` produce;
      # they are driven directly here so the job needs no mise install, reading
      # the pyrocko pin out of mise.toml so it stays single-sourced.
      #
      # fetch-web.sh downloads the runtime the Pages workflow last deployed from main —
      # the same tradeoff a contributor makes locally. Building it from source
      # instead is an hour and a Docker-in-Docker emscripten toolchain; when a
      # release must pin an exact runtime, deploy Pages from that commit first.
      - name: Fetch the prebuilt heavy inputs
        if: matrix.prebuilt-assets
        run: |
          PYROCKO_REPO=$(sed -nE 's/^PYROCKO_REPO[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml | head -1)
          PYROCKO_REF=$(sed -nE 's/^PYROCKO_REF[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml | head -1)
          test -n "$PYROCKO_REPO" && test -n "$PYROCKO_REF"
          export PYROCKO_REPO PYROCKO_REF
          ./pybuild/fetch-pyrocko.sh
          ./docker/pyodide-mt/fetch-web.sh

      # The build stamp the app shows in its top bar and About window, matching
      # what the Pages workflow bakes in: Berlin time, because it is compared
      # against the wall clock of whoever cut the build, and %Z keeps the summer
      # and winter halves of the year apart.
      - name: Stamp the build
        if: matrix.prebuilt-assets
        run: |
          echo "SNUFFLER_BUILD_DATE=$(TZ=Europe/Berlin date +'%Y-%m-%d %H:%M (%Z, Europe/Berlin)')" >> "$GITHUB_ENV"
          echo "SNUFFLER_GIT_COMMIT=${GITHUB_SHA::10}" >> "$GITHUB_ENV"
          # A release image shows its tag instead of the date.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "SNUFFLER_RELEASE=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v4

      # Read access is enough for the layer cache every run reads, so this runs
      # for forks too; main and release tags write separate profile caches.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prove the image serves before it can become anything else. The docker
      # exporter `load` needs takes no manifest list, so this is a single-platform
      # build; on a release tag, the multi-platform push at the end reuses its
      # amd64 layers.
      - name: Build the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: snuffler-smoke:${{ matrix.image }}
          build-args: |
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
            SNUFFLER_BUILD_DATE=${{ env.SNUFFLER_BUILD_DATE }}
            SNUFFLER_GIT_COMMIT=${{ env.SNUFFLER_GIT_COMMIT }}
            SNUFFLER_RELEASE=${{ env.SNUFFLER_RELEASE }}
          # mise resolves the trunk/binaryen/buf/protoc releases through the
          # GitHub API, whose anonymous rate limit is per-IP and therefore shared
          # with every other job on this runner.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          # The build cache lives in GHCR, NOT in the Actions cache: a Rust
          # dependency graph exported with mode=max is gigabytes, and the Actions
          # cache is one 10 GB quota shared with the Pages workflow, whose
          # ~1 h Pyodide artifacts would be the thing evicted to make room.
          # Separate dev and release refs keep main's unoptimized dependencies
          # from replacing the release cache.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache-dev
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-dev,mode=max', github.repository, matrix.image) || '' }}
          # The docker exporter `load` uses cannot carry attestations.
          provenance: false

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 18080:${{ matrix.smoke-port }} snuffler-smoke:${{ matrix.image }}
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:18080${{ matrix.smoke-path }}" >/dev/null && ready=1 && break
            sleep 1
          done
          if [ -z "${ready:-}" ]; then docker logs smoke; exit 1; fi
          # Both images declare a non-root user and a read-only root filesystem;
          # either one regressing is invisible until something in production
          # refuses to schedule the container.
          test "$(docker inspect --format '{{.Config.User}}' smoke)" = "${{ matrix.smoke-user }}"
          if [ "${{ matrix.image }}" = proxy ]; then
            docker exec smoke /usr/local/bin/snuffler-web-proxy --healthcheck
          fi

      # The three things this image exists to get right, and the three a plain
      # static host gets wrong: cross-origin isolation, a precompressed body, and
      # the Pyodide runtime actually being in there.
      - name: Check the served headers and payload
        if: matrix.image == 'web'
        run: |
          curl -fsS -o /dev/null -D headers -H 'Accept-Encoding: br' http://127.0.0.1:18080/
          cat headers
          grep -qi '^cross-origin-opener-policy: same-origin' headers
          grep -qi '^cross-origin-embedder-policy: credentialless' headers
          grep -qi '^content-encoding: br' headers
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18080/py-mt/pyodide-lock.json
          curl -fsS -o /dev/null -D mjs -H 'Accept-Encoding: br' http://127.0.0.1:18080/py-mt/pyodide.mjs
          grep -qi '^content-type: text/javascript' mjs

      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f smoke || true

      # Compile the foreign target before setting up QEMU to ensure every Rust
      # and C build step runs natively, including aws-lc's CMake build.
      # The proxy's distroless runtime has no build commands.
      - name: Cross-compile the arm64 proxy
        if: matrix.image == 'proxy' && env.PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: builder
          platforms: linux/arm64
          outputs: type=cacheonly
          build-args: CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/proxy:buildcache-dev-arm64
            type=registry,ref=ghcr.io/${{ github.repository }}/proxy:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/proxy:buildcache-dev-arm64,mode=max', github.repository) || '' }}

      # Only the web image's nginx modules need QEMU.
      - uses: docker/setup-qemu-action@v4
        if: matrix.image == 'web' && env.PUBLISH == 'true' && contains(matrix.platforms, 'arm64')

      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # `latest` comes from the default flavor and tracks the newest semver
          # tag. No major-only tag: at 0.x it would say nothing.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          # Without these, every image would inherit the repository's own title
          # and description and the three would be indistinguishable in the
          # registry; the action's defaults are overridden, not appended to.
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Publish the release images
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
            SNUFFLER_BUILD_DATE=${{ env.SNUFFLER_BUILD_DATE }}
            SNUFFLER_GIT_COMMIT=${{ env.SNUFFLER_GIT_COMMIT }}
            SNUFFLER_RELEASE=${{ env.SNUFFLER_RELEASE }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache-dev
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache-dev-arm64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
