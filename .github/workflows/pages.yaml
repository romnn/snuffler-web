name: GitHub Pages

# Build the web app (Rust/egui wasm + the py-mt Pyodide runtime) and deploy it to
# GitHub Pages. Set the repo's Pages source to "GitHub Actions" to publish.
#
# The site serves two builds:
#
# - / is the newest release.
#   A release tag builds it and attaches it to the GitHub release as site-<tag>.tar.zst,
#   then starts this workflow on main to deploy it.
# - /latest/ is main.
#   A push to main builds it and deploys it beside the newest release's site.
#   Before the first release, / redirects to /latest/.
#
# Only main deploys, so the github-pages environment needs no rule for tags.
#
# The app is a single threaded build: our custom Pyodide 314 (docker/pyodide-mt) —
# pthread + OpenMP + SIMD runtime + wheels, served at py-mt/ — plus the egui wasm
# built threaded (wasm-bindgen-rayon). Both need cross-origin isolation, which the
# coi-serviceworker provides (GitHub Pages can't set COOP/COEP response headers).
#
# The custom build (CPython 3.14 + Pyodide from source) is ~1 h, so we CACHE its
# expensive PRE-STAGE artifacts — the relinked runtime (.work/pyodide/dist) and the
# threaded wheels + lock (.work/pyodide/dist-mt) — keyed only on the inputs that
# determine those bytes. The cheap staging (stage-web.sh -> served/) always re-runs,
# so editing orchestration / staging / the web app reuses the cache and only
# re-stages (seconds); only a builder / patch / pin change forces the full rebuild.
# NOTE: the cold-cache build runs on a GitHub-hosted runner (6 h limit) and has
# measured ~1 h, comfortably within budget.
# Disk is the tight resource here, not time: the from-source tree does not fit
# beside the runner's preinstalled toolchains and the wasm build that follows it,
# so the job frees the one up front and drops the other the moment served/ is
# assembled (the two disk steps below).
on:
  push:
    branches: [main]
    # bumpversion tags releases as v<version> (.bumpversion.toml).
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
# A group holds only one waiting run and cancels the one it replaces.
# Release tags never deploy, so they queue apart: otherwise the deploy a tag starts on
# main would cancel the waiting run of the push that came with the tag.
concurrency:
  group: pages-${{ github.ref_type }}
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"
  MISE_HTTP_RETRIES: "12"

jobs:
  build:
    runs-on: ubuntu-latest
    # The cold-cache build measures ~1 h, so this is room to spare while still
    # bounding a wedged run — one whose step has already failed but whose runner
    # never finishes, and which the cancel button does not always reach.
    # GitHub's default would let that sit for 6 h, and because the concurrency
    # group above deliberately never cancels a run in progress, every later push
    # queues behind it for that whole time.
    timeout-minutes: 120
    permissions:
      # A release tag creates the GitHub release and starts the deploy from main.
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # A cold cache builds Pyodide from source — CPython, emsdk and every package
      # — and that tree does not fit on a stock runner beside everything else this
      # job produces.
      # None of the toolchains removed here are used: the Pyodide build runs inside
      # the pyodide-env container, and everything else comes from mise or rustup.
      # The preinstalled docker images go too; the pyodide-env image is pulled
      # afterwards and is the only one this job wants.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell
          docker image prune -af >/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: Swatinem/rust-cache@v2

      # Provision the pinned toolchain (Python, Bun, uv, Task, Trunk, Binaryen, protoc —
      # protoc + buf compile the bridge .proto during the trunk build). emsdk is
      # NOT needed here: the Pyodide wheels build inside the pyodide-env docker
      # image (build-all.sh), not via the host emsdk.
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - name: Install web build tools
        run: mise install python bun uv task buf protoc aqua:WebAssembly/binaryen github:trunk-rs/trunk

      # The pyrocko source pin is a cache discriminator that isn't a file (it lives
      # in mise.toml [env]); extract it so a TOOL-version bump in mise.toml does not
      # invalidate the expensive Pyodide build, but a pyrocko bump does.
      - name: Pyodide build cache discriminator
        id: pyodide-disc
        run: |
          ref=$(sed -nE 's/^PYROCKO_REF[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml | head -1)
          test -n "$ref"
          echo "pyrocko=$ref" >> "$GITHUB_OUTPUT"

      # Cache the EXPENSIVE pre-stage artifacts — the relinked runtime
      # (.work/pyodide/dist) and the threaded wheels + lock (.work/pyodide/dist-mt),
      # built together against one ABI — NOT the staged served/ (cheap) nor the
      # multi-GB .work tree. Keyed ONLY on what determines those bytes: the three
      # builder scripts (each pins the pyodide / recipes commit + docker image), the
      # pthread patch, force_sjlj.c, the libomp builder, the pyrocko recipe + pybuild,
      # and the pyrocko source pin. It deliberately EXCLUDES build-all.sh
      # (orchestration), stage-web.sh (staging) and mise.toml tool versions — none
      # change the built bytes. Exact key, no restore-keys: a hit is byte-identical to
      # a fresh build; any input change misses and rebuilds (no stale-restore hazard).
      # Restore only here; we SAVE in a separate step right after the build (below)
      # so a later trunk/backstop failure can't discard the ~1 h artifacts. The key
      # globs docker/pyodide-mt/libomp/** (build.sh AND kmp_wasm_compat.c, both
      # compiled into libomp.a and whole-archived into the runtime), so a libomp
      # change correctly busts the cache.
      - name: Restore Pyodide 314 build artifacts
        id: pyodide-out
        uses: actions/cache/restore@v6
        with:
          path: |
            docker/pyodide-mt/.work/pyodide/dist
            docker/pyodide-mt/.work/pyodide/dist-mt
          # prettier-ignore
          key: >-
            pyodide314-artifacts-${{ hashFiles(
            'docker/pyodide-mt/build.sh',
            'docker/pyodide-mt/build-packages.sh',
            'docker/pyodide-mt/build-pyrocko.sh',
            'docker/pyodide-mt/force_sjlj.c',
            'docker/pyodide-mt/patches/**',
            'docker/pyodide-mt/pyrocko/meta.yaml',
            'docker/pyodide-mt/libomp/**',
            'pybuild/setup.py',
            'pybuild/pyproject.toml'
            ) }}-pyrocko-${{ steps.pyodide-disc.outputs.pyrocko }}

      # pyrocko source is needed by the build (on a cache miss) and by trunk
      # (index.html ships the cake earthmodels and the plate boundaries from it),
      # so always.
      - name: Fetch pyrocko (pinned)
        run: task fetch:pyrocko

      # Cache MISS: full build (~1 h cold) -> produces dist + dist-mt, then its final
      # stage-web.sh assembles served/ and runs the lock-completeness guard.
      - name: Build custom Pyodide 314 (runtime + wheels + stage)
        id: build-pyodide
        if: steps.pyodide-out.outputs.cache-hit != 'true'
        run: docker/pyodide-mt/build-all.sh

      # Persist the ~1 h artifacts the moment they exist — BEFORE the trunk build and
      # the final lock backstop — so a later flake/rejection never forces another full
      # rebuild next run. The implicit success() in this `if` means a FAILED
      # build-all.sh skips the save, so a broken/partial artifact is never cached.
      - name: Save Pyodide 314 build artifacts
        if: steps.pyodide-out.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            docker/pyodide-mt/.work/pyodide/dist
            docker/pyodide-mt/.work/pyodide/dist-mt
          key: ${{ steps.pyodide-out.outputs.cache-primary-key }}

      # Cache HIT: the expensive artifacts are restored; just (re)assemble served/
      # from them (no docker / emsdk / pyodide tree needed). stage-web.sh runs the
      # guard, so a stale or partial cached lock fails here instead of shipping.
      - name: Stage py-mt from cached artifacts
        if: steps.pyodide-out.outputs.cache-hit == 'true'
        run: docker/pyodide-mt/stage-web.sh

      # The earliest point at which the builder's scratch tree is finished with:
      # served/ is assembled, and the artifacts inside it are already uploaded by
      # the save step above.
      # What goes is the tree that PRODUCED them — the pyodide checkout with its
      # emsdk and CPython submodules, and every package's build directory — plus
      # out/, which is build.sh's second copy of the runtime, and the container
      # image, which nothing after this uses.
      # build-all.sh keeps all of it (KEEP=1) for local incremental rebuilds; CI
      # gets that reuse from the cache instead.
      #
      # dist/ and dist-mt/ deliberately survive: they are exactly what the cache
      # step stores, so keeping them means no reordering of these steps can void
      # the ~1 h artifacts. Nothing here touches ~/.cargo or target/, which
      # rust-cache saves in its post step — that save wants the freed room too.
      #
      # This is what leaves trunk the space to compile the wasm app and copy py-mt
      # into dist/, which is where a cold run ran out of disk.
      - name: Reclaim the Pyodide build tree
        run: |
          work=docker/pyodide-mt/.work
          du -sh "$work" docker/pyodide-mt/out 2>/dev/null || true
          if [ -d "$work/pyodide" ]; then
            find "$work" -mindepth 1 -maxdepth 1 -not -name pyodide -exec rm -rf {} +
            find "$work/pyodide" -mindepth 1 -maxdepth 1 \
              -not -name dist -not -name dist-mt -exec rm -rf {} +
          fi
          rm -rf docker/pyodide-mt/out
          docker system prune -af --volumes >/dev/null || true
          du -sh "$work" 2>/dev/null || true
          df -h /

      # Trunk's pre_build hooks run `buf generate` (whose protoc-gen-es plugin is
      # `bunx protoc-gen-es`) and `bun build` (which imports @bufbuild/protobuf).
      # Both resolve from node_modules, so install the committed JS deps first —
      # otherwise bunx/bun reach for the npm registry and fail (protoc-gen-es 404 /
      # "Could not resolve @bufbuild/protobuf").
      - name: Install JS deps (bridge glue)
        run: bun install --frozen-lockfile

      # The build stamp the app shows in its top bar and About window. It is baked
      # in from the environment (option_env!, no build script) precisely so LOCAL
      # builds leave it unset and never recompile for it: a build-time-aware build
      # script would have to re-run — and so relink the wasm — on every edit.
      # Published builds are the ones anyone needs to identify.
      #
      # Berlin time, not the runner's UTC: this is a "which build am I looking
      # at" stamp, compared against the wall clock of whoever cut it. `%Z` bakes
      # in the abbreviation the date was actually produced under, so the summer
      # and winter halves of the year stay distinguishable (CEST vs CET); the
      # zone name beside it says which city that abbreviation belongs to. The
      # whole rendered string is baked here, so the format lives in one place.
      - name: Stamp the build
        run: |
          echo "SNUFFLER_BUILD_DATE=$(TZ=Europe/Berlin date +'%Y-%m-%d %H:%M (%Z, Europe/Berlin)')" >> "$GITHUB_ENV"
          echo "SNUFFLER_GIT_COMMIT=${GITHUB_SHA::10}" >> "$GITHUB_ENV"
          # A release shows its tag instead of the date.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "SNUFFLER_RELEASE=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      # Project pages live under /<repo>/, so the asset URLs must be prefixed; main is
      # served one level deeper, under latest/.
      # Trunk.toml's post_build hook stages docker/pyodide-mt/served -> py-mt/ and
      # web/assets/models/*.onnx -> assets/models/.
      # The Task workflow owns the threaded build flags and rust-toolchain.toml the
      # pinned nightly, so local and Pages builds cannot silently diverge; CI adds
      # only the project-specific public URL.
      # The site streams live SeedLink data, and makes the FDSN requests a browser cannot
      # make directly, through the project's public proxy (scripts/trunk-post-build.sh
      # writes it into config.js).
      - name: Trunk build (release, threaded)
        env:
          SNUFFLER_PROXY_URL: https://proxy.snuffler.romnn.com/
        # prettier-ignore
        run: >-
          task build -- --public-url
          "/${{ github.event.repository.name }}/${{ github.ref_type != 'tag' && 'latest/' || '' }}"

      # Final backstop: validate the lock in the ACTUAL artifact about to be
      # published (trunk copied served/ -> dist/py-mt). A truncated/stale lock —
      # from any cause — fails the deploy here rather than breaking it for users.
      - name: Verify the deployed Pyodide lock is complete
        run: bash docker/pyodide-mt/check-lock.sh dist/py-mt/pyodide-lock.json

      - name: Attach the site to the release and deploy it
        if: github.ref_type == 'tag'
        run: |
          tag=$GITHUB_REF_NAME
          tar -C dist --zstd -cf "site-$tag.tar.zst" .
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" "site-$tag.tar.zst" --clobber
          gh workflow run pages.yaml --ref main

      # The newest release goes at the root and this build under latest/.
      # gh picks the newest release that is neither a draft nor a prerelease.
      - name: Assemble the site
        if: github.ref_type != 'tag'
        run: |
          mkdir site
          if tag=$(gh release view --json tagName --jq .tagName 2>/dev/null); then
            gh release download "$tag" --pattern 'site-*.tar.zst' --output site.tar.zst
            tar -C site --zstd -xf site.tar.zst
            rm site.tar.zst
          else
            printf '%s\n' '<!doctype html>' \
              '<meta http-equiv="refresh" content="0; url=latest/">' \
              '<a href="latest/">snuffler-web</a>' > site/index.html
          fi
          mv dist site/latest

      - if: github.ref_type != 'tag'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref_type != 'tag'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    # This job only publishes the artifact the build already produced, but Pages
    # can sit in `syncing_files` well past deploy-pages' 10-minute default before
    # the deployment goes live, which failed runs whose artifact was fine.
    # It holds the same concurrency group, so it stays bounded, just above the
    # step's own timeout.
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Milliseconds.
          timeout: 1800000
