# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: lint
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"
  MISE_HTTP_RETRIES: "12"

jobs:
  lint:
    name: fmt + clippy (native & wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      # protoc is for the snuffler-web-proto build script; python and uv for lint:py.
      - run: >-
          mise install task python bun uv rg zig buf protoc
          github:romnn/cargo-feature-combinations github:rust-cross/cargo-zigbuild
          aqua:rustsec/rustsec/cargo-audit github:Boshen/cargo-shear
      # rust-toolchain.toml pins the channel, the wasm32 target, and the
      # rustfmt/clippy components; rustup installs them on the first cargo call.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The wasm bridge externs read /web/gen/bridge.js at compile time
      # (the wasm-bindgen module in snuffler-web-core/src/bridge.rs). It is
      # generated, not committed, so the wasm clippy below cannot read it unless we
      # build it first. Install the JS deps, run `buf generate` (the TS proto
      # messages bridge.ts imports), and bun-bundle the glue — the same artifacts
      # Trunk produces via its pre_build hooks.
      - name: Generate + bundle the bridge glue
        run: |
          bun install --frozen-lockfile
          buf generate
          bun build web/bridge.ts --outfile web/gen/bridge.js --format esm --target browser
          bun build web/bridge_worker.ts --outfile web/gen/bridge_worker.js --format esm --target browser

      - name: Audit
        continue-on-error: true
        run: task audit
      - name: Check for unused dependencies
        run: task unused
      - name: rustfmt
        run: task format:rust -- --check
      - name: Lint (all feature combinations × targets)
        run: task lint:fc

  # End-to-end type safety across the bridge boundary: tsc on the TS glue +
  # generated proto messages, mypy on the Python bridge vs the generated dispatch,
  # and ruff on the Python. These guard the typed method-id seam and the proto
  # DTOs that clippy/the build don't check. No Rust toolchain needed.
  types:
    name: tsc + mypy + ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task python bun uv buf protoc

      # check:ts/check:py run `buf generate` (whose protoc-gen-es is
      # `bunx protoc-gen-es`) and `bunx tsc`; both resolve from node_modules.
      - name: Install JS deps (bridge glue)
        run: bun install --frozen-lockfile

      # Run the exact pinned commands from taskfile.yaml (single source of truth):
      # check:ts = buf generate + tsc; check:py = buf generate + mypy; lint:py = ruff.
      - name: TypeScript types (tsc)
        run: task check:ts
      - name: Python types (mypy)
        run: task check:py
      - name: Python lint (ruff)
        run: task lint:py

  spellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task typos
      - name: Spellcheck
        run: task spellcheck
