name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    name: fmt + clippy (native & wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # egui's native (x11/wayland) backend needs these to build the native bin.
      - name: System deps (native egui backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # Puts the pinned protoc on PATH — snuffler-proto's build.rs (prost-build)
      # shells out to it to compile the bridge .proto schema during clippy.
      - uses: jdx/mise-action@v2

      # rust-toolchain.toml pins the channel, the wasm32 target, and the
      # rustfmt/clippy components; rustup installs them on the first cargo call.
      # The wasm web_sys_unstable_apis cfg comes from .cargo/config.toml.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (native stub)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (wasm32 — the real web target)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
