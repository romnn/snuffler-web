<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>snuffler-web — seismic waveform inspector</title>

    <!-- Cross-origin isolation is always on. The app is a single threaded build:
         the egui wasm runs its PNG export on a wasm-bindgen-rayon worker pool and
         the Pyodide runtime is our py-mt (pthread + OpenMP + SIMD) build — both
         need SharedArrayBuffer, which requires COI. The coi-serviceworker shim
         uses COEP credentialless so the cross-origin map tiles + FDSN keep
         loading. There is no runtime toggle: a non-threaded build, if ever
         needed, is produced via the `threads` build-time feature and hosted on a
         separate path so the two never interfere. -->
    <script>
        (function () {
            window.coi = {
                coepCredentialless: function () { return true; },
                shouldRegister: function () { return true; },
                shouldDeregister: function () { return false; },
                quiet: true,
            };
        })();
    </script>
    <script src="coi-serviceworker.js"></script>

    <!-- the egui/eframe wasm binary. Trunk's built-in wasm-opt is off because it
         can't pass `-all` (needed for the post-MVP wasm features rustc emits);
         wasm-opt runs instead as a Trunk post-build hook with a mise-pinned
         binaryen (see Trunk.toml). -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <base data-trunk-public-url />
    <!-- pyrocko/snuffler boar mark, matching the favicon on pyrocko.org -->
    <link data-trunk rel="icon" href="assets/favicon.png" />
    <!-- same boar mark, copied verbatim for the loading-screen logo (<img> below) -->
    <link data-trunk rel="copy-file" href="assets/favicon.png" />

    <!-- runtime assets fetched by web/bridge.js (the py-mt Pyodide runtime +
         wheels are staged into py-mt/ by Trunk.toml's post_build hook) -->
    <link data-trunk rel="copy-file" href="web/bridge.py" />
    <link data-trunk rel="copy-file" href="web/bridge_worker.js" />
    <!-- cross-origin isolation shim (opt-in; see the script in <head>) -->
    <link data-trunk rel="copy-file" href="web/coi-serviceworker.js" />
    <link data-trunk rel="copy-dir" href="web/proto" data-target-path="proto" />
    <!-- demo data from the on-demand pyrocko checkout (see mise run fetch-pyrocko) -->
    <link data-trunk rel="copy-file" href="sources/pyrocko/doc/source/static/test.mseed" />
    <!-- cake earth models for theoretical arrivals (loaded by path, so no
         pyrocko data dir is needed in the minimal wheel); ~120 KB of .nd files
         staged into the Pyodide FS by ensureEarthModels in bridge.js -->
    <link data-trunk rel="copy-dir"
        href="sources/pyrocko/src/data/earthmodels" data-target-path="earthmodels" />

    <style>
        :root {
            --bg: #fafafa;
            --fg: #1c1e22;
            --muted: #6b7280;
            --track: #e6e8eb;
            --accent: #3465a4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181b;
                --fg: #e6e8ec;
                --muted: #9aa0a8;
                --track: #2c3036;
                --accent: #6aa3ff;
            }
        }

        html { touch-action: manipulation; }

        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
        }

        canvas {
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        #loading.done {
            opacity: 0;
        }

        #loading .panel {
            width: min(340px, 82vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        #loading .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 22px;
            user-select: none;
            -webkit-user-drag: none;
        }

        #loading .title {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--fg);
        }

        #loading .title span { color: var(--accent); }

        #loading .sub {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            margin-bottom: 26px;
        }

        #loading .bar {
            height: 6px;
            width: 100%;
            background: var(--track);
            border-radius: 999px;
            overflow: hidden;
        }

        #loading #bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        #loading .row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        #loading #pct {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--fg);
        }

        /* Subtle debug-only readout of the booted Pyodide runtime, shown
           top-right once it has come up (set by __snufflerRuntime). Reports the
           mode + Python/NumPy versions for both paths. Deliberately low-key. */
        #runtime-badge {
            position: absolute;
            top: 5px;
            right: 7px;
            z-index: 11;
            display: none;
            padding: 0 2px;
            font-size: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            line-height: 1.4;
            color: var(--muted);
            opacity: 0.55;
            white-space: nowrap;
            user-select: text;
            pointer-events: none;
        }

        #runtime-badge.show { display: inline-block; }
    </style>
</head>

<body>
    <!-- the id is hardcoded in main.rs; keep them in sync -->
    <canvas id="the_canvas_id"></canvas>

    <!-- subtle debug readout of the booted py-mt Pyodide runtime (set by
         __snufflerRuntime) -->
    <div id="runtime-badge"></div>

    <div id="loading">
        <div class="panel">
            <img class="logo" src="favicon.png" width="80" height="80" alt="pyrocko" />
            <div class="title">snuffler<span>-web</span></div>
            <div class="sub">seismic waveform inspector</div>
            <div class="bar"><div id="bar-fill"></div></div>
            <div class="row"><span id="pct">0%</span><span id="stage">starting…</span></div>
        </div>
    </div>

    <script>
        // Driven by web/bridge.js as Pyodide + pyrocko load.
        window.__snufflerProgress = function (frac, label) {
            const f = Math.max(0, Math.min(1, frac));
            const fill = document.getElementById("bar-fill");
            const pct = document.getElementById("pct");
            const stage = document.getElementById("stage");
            if (fill) fill.style.width = (f * 100).toFixed(0) + "%";
            if (pct) pct.textContent = (f * 100).toFixed(0) + "%";
            if (stage && label) stage.textContent = label;
            if (f >= 1) {
                const el = document.getElementById("loading");
                if (el) {
                    el.classList.add("done");
                    el.setAttribute("aria-hidden", "true");
                    setTimeout(() => el.remove(), 450);
                }
            }
        };

        // Called by web/bridge.js when the Pyodide worker reports its booted
        // runtime. Shows a subtle debug readout of the versions; the lead token is
        // "wasm+openmp+simd" once threading is confirmed (pthreads read back from
        // the live interpreter, so libomp + SIMD are in play) — it should always
        // be, on this MT-only build; a bare "wasm" would signal threading failed.
        window.__snufflerRuntime = function (info) {
            if (!info) return;
            const badge = document.getElementById("runtime-badge");
            if (!badge) return;
            const mt = !!(info.threaded && info.pthreads);
            const bits = [mt ? "wasm+openmp+simd" : "wasm"];
            if (mt && info.cores) bits.push(info.cores + " cores");
            if (info.python) bits.push("py" + info.python);
            if (info.numpy) bits.push("np" + info.numpy);
            badge.textContent = bits.join(" · ");
            badge.classList.add("show");
        };
    </script>
</body>

</html>
