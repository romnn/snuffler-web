<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>snuffler-web — seismic waveform inspector</title>

    <!-- the egui/eframe wasm binary -->
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <base data-trunk-public-url />
    <link data-trunk rel="icon" href="assets/icon-256.png" />

    <!-- runtime assets fetched by web/bridge.js -->
    <link data-trunk rel="copy-dir" href="dist-py" data-target-path="py" />
    <link data-trunk rel="copy-file" href="web/bridge.py" />
    <!-- demo data from the on-demand pyrocko checkout (see mise run fetch-pyrocko) -->
    <link data-trunk rel="copy-file" href="sources/pyrocko/doc/source/static/test.mseed" />

    <style>
        :root {
            --bg: #fafafa;
            --fg: #1c1e22;
            --muted: #6b7280;
            --card: #ffffff;
            --track: #e6e8eb;
            --accent: #3465a4;
            --shadow: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181b;
                --fg: #e6e8ec;
                --muted: #9aa0a8;
                --card: #1e2125;
                --track: #2c3036;
                --accent: #6aa3ff;
                --shadow: rgba(0, 0, 0, 0.5);
            }
        }

        html { touch-action: manipulation; }

        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
        }

        canvas {
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity 0.4s ease;
        }

        #loading .card {
            width: min(420px, 80vw);
            padding: 32px 36px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 10px 40px var(--shadow);
            text-align: left;
        }

        #loading .title {
            font-size: 30px;
            font-weight: 650;
            letter-spacing: -0.5px;
            color: var(--fg);
        }

        #loading .title span { color: var(--accent); }

        #loading .sub {
            font-size: 13.5px;
            color: var(--muted);
            margin-top: 2px;
            margin-bottom: 22px;
        }

        #loading .bar {
            height: 8px;
            width: 100%;
            background: var(--track);
            border-radius: 999px;
            overflow: hidden;
        }

        #loading #bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        #loading .row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        #loading #pct {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--fg);
        }
    </style>
</head>

<body>
    <!-- the id is hardcoded in main.rs; keep them in sync -->
    <canvas id="the_canvas_id"></canvas>

    <div id="loading">
        <div class="card">
            <div class="title">snuffler<span>-web</span></div>
            <div class="sub">seismic waveform inspector — loading Python + pyrocko</div>
            <div class="bar"><div id="bar-fill"></div></div>
            <div class="row"><span id="pct">0%</span><span id="stage">starting…</span></div>
        </div>
    </div>

    <script>
        // Driven by web/bridge.js as Pyodide + pyrocko load.
        window.__snufflerProgress = function (frac, label) {
            const f = Math.max(0, Math.min(1, frac));
            const fill = document.getElementById("bar-fill");
            const pct = document.getElementById("pct");
            const stage = document.getElementById("stage");
            if (fill) fill.style.width = (f * 100).toFixed(0) + "%";
            if (pct) pct.textContent = (f * 100).toFixed(0) + "%";
            if (stage && label) stage.textContent = label;
            if (f >= 1) {
                const el = document.getElementById("loading");
                if (el) { el.style.opacity = "0"; setTimeout(() => el.remove(), 450); }
            }
        };
    </script>
</body>

</html>
