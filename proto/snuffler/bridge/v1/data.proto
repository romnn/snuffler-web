syntax = "proto3";

package snuffler.bridge.v1;

import "snuffler/bridge/v1/common.proto";
import "snuffler/bridge/v1/scene.proto";
import "snuffler/bridge/v1/snuffling.proto";

message MapStation {
  string label = 1;
  double lat = 2;
  double lon = 3;
}

message MapEvent {
  double lat = 1;
  double lon = 2;
  double mag = 3;
  double depth = 4; // metres (like pyrocko's map snuffling; popup divides by 1000)
  string name = 5;
  string time = 6;
  // Identity linking the map dot to the event marker, so the map can show only
  // the *selected* event markers, as Qt's map does (map/__init__.py:242).
  string event_hash = 7;
}

// One tectonic plate boundary as a polyline of lon/lat vertices, parsed from
// pyrocko's shipped Bird (2003) plates.kml so the map can overlay them exactly
// like the Qt map snuffling (geometry passthrough, no seismology in Rust).
message PlateBoundary {
  string name = 1;
  repeated double lons = 2;
  repeated double lats = 3;
}

message MapData {
  repeated MapStation stations = 1;
  repeated MapEvent events = 2;
  repeated PlateBoundary plate_boundaries = 3;
}

// The frontend event-marker projection the map should display.
// Python resolves these identities through its authoritative event registry;
// `only_active_event` also limits stations to traces around that origin.
message MapRequest {
  repeated string event_hashes = 1;
  bool only_active_event = 2;
  optional string active_event_hash = 3;
  optional double active_event_time = 4;
}

// Great-circle geometry from the active event to each known station (degrees),
// for the distance/azimuth columns snuffler shows in its marker/station tables.
message StationDistance {
  string net = 1;
  string sta = 2;
  double distance_deg = 3;
  double azimuth_deg = 4;
  double backazimuth_deg = 5;
}

message StationDistanceList {
  repeated StationDistance stations = 1;
  bool has_event = 2;
}

// Set (or clear) the user-chosen active event — the single reference the distance
// and Kagan columns, cake/seismosizer origin and map centre are measured against
// (snuffler's set_active_event_marker). Replaces the auto largest-magnitude pick.
message SetActiveEventRequest {
  bool deactivate = 1; // 'E' — clear the active event
  optional string event_hash = 2; // identity of a loaded catalog/event marker
  double t = 3; // marker time (identity fallback + hand-made-event origin time)
  Nslc nslc = 4; // single-station marker → Python derives lat/lon from _STATIONS
}

// Event hashes whose final frontend event marker was deleted.
message RemoveEventsRequest {
  repeated string event_hashes = 1;
}

// A ':' command line, plus the viewer context snuffler's command handlers read
// straight off the viewer: `goto HH:MM` resolves the time of day on the date at
// the centre of the window, and `hide empty` blacklists the channels with no
// data in it. Both mean the window on screen, so these are `visible_*` in the
// sense ViewParams gives the word — never its overscanned fetch range.
message CommandRequest {
  string line = 1;
  double visible_tmin = 2;
  double visible_tmax = 3;
}

message CommandResult {
  string action = 1;
  optional double t = 2;
  SceneMeta scene = 3;
  optional string message = 4;
  // For a `goto`, the window length (seconds) matching the date specificity typed
  // (snuffler: ':goto 2023' opens a year, a full date a day, etc.). Absent = keep.
  optional double tlen = 5;
}

message LoadBytesRequest {
  string name = 1;
  string fmt = 2;
  bool append = 3;
  bytes content = 4; // the file bytes themselves (Python stages them on the Pyodide FS)
  // Stable identity of the on-disk source (File System Access handle) this load
  // came from.
  string source_id = 5;
  // True only after an initial load registered `source_id`: replace that
  // source's previous traces instead of applying ordinary append semantics.
  bool replace_source = 6;
}

message LoadBytesResult {
  SceneMeta scene = 1;
  // False when duplicate detection refused the bytes without changing the pile.
  bool loaded = 2;
  ActiveEventResult event_state = 3;
}

message LoadUrlRequest {
  string url = 1;
  string fmt = 2;
}

message IngestMiniSeedRequest {
  string source = 1;
  bytes content = 2;
  // Live-acquisition sessions trim incoming records before this epoch time.
  // Zero means "do not trim".
  double start_time = 3;
  // True for the first packet of a new live source: replace the existing pile
  // instead of appending to whatever was loaded before.
  bool reset = 4;
  // Rolling retention window in seconds for live acquisition. Zero keeps all
  // data from start_time onward.
  double retain_seconds = 5;
}

// A pyrocko marker file's text, picked in the browser and parsed in Python.
message LoadMarkersRequest {
  string text = 1;
}

// StationXML documents picked in the browser (the picker is multi-select) and
// parsed in Python (station coordinates for sorting + instrument responses for
// deconvolution).
message LoadStationXmlRequest {
  repeated string texts = 1;
}

// A pyrocko station file's text, picked in the browser and parsed in Python
// (station coordinates for distance/azimuth sorting, cake, and the map).
message LoadStationsRequest {
  string text = 1;
}

// A pyrocko event file's text, picked in the browser and parsed in Python (event
// markers + the active event for distance/azimuth sorting).
message LoadEventsRequest {
  string text = 1;
}

// A user-picked cake earth model (.nd text), written into the Pyodide FS.
message AddCakeModelRequest {
  string name = 1;
  bytes content = 2;
}

message StringRequest {
  string value = 1;
}

message WaveformDownloadRequest {
  string datacenter = 1;
  string net = 2;
  string sta = 3;
  string loc = 4;
  string cha = 5;
  string start = 6;
  string end = 7;
}

message StationRequest {
  string datacenter = 1;
  string net = 2;
  string sta = 3;
  string cha = 4;
  // Qt's download resolves stations at channel level with the location and the
  // time span in the query (download.py:78); these complete the selection.
  string loc = 5;
  string start = 6; // UTC text; empty = no time constraint
  string end = 7;
  // Radius search around the active event's epicentre — Qt's primary download
  // workflow ("everything within five degrees of this event"). When set, the
  // query carries lat/lon/maxradius instead of the code selectors alone.
  optional double radius_deg = 8;
}

message CatalogRequest {
  string datacenter = 1;
  string start = 2;
  string end = 3;
  double minmag = 4;
  // Fetch full QuakeML with moment tensors (format=quakeml&includeallorigins)
  // instead of the lightweight text summary, so event markers carry a focal
  // mechanism (beachball + Kagan angle). Falls back to text when unset.
  bool with_mt = 5;
}

message MarkerFileEntry {
  double tmin = 1;
  double tmax = 2;
  uint32 kind = 3;
  optional string phase = 4;
  // All channels the marker applies to (pyrocko's `nslc_ids` list); empty =
  // every track.
  repeated Nslc nslc_ids = 5;
  optional int32 polarity = 6;
  // Phase-pick time uncertainty (seconds), drawn as ± brackets; set by shift-drag.
  optional double uncertainty = 7;
  // Event-marker fields so events save as real EventMarkers (with origin + focal
  // mechanism) rather than being downgraded to plain markers. depth is metres.
  bool is_event = 8;
  optional double magnitude = 9;
  optional double depth = 10;
  optional double lat = 11;
  optional double lon = 12;
  optional string event_hash = 13;
  optional MomentTensor moment_tensor = 14;
  // `PhaseMarker` extras a faithful save needs: the automatic flag (`False` for
  // a hand pick, never `None`), the angles, and the associated event's time.
  optional bool automatic = 15;
  optional double incidence_angle = 16;
  optional double takeoff_angle = 17;
  optional double event_time = 18;
  // The event's own identity fields (`Event.name/region/catalog`), which Qt
  // writes into a saved event row and the caption is composed from.
  optional string event_name = 19;
  optional string region = 20;
  optional string catalog = 21;
}

message MarkerFile {
  repeated MarkerFileEntry markers = 1;
}

message SnufMarkerList {
  repeated SnufMarker markers = 1;
  ActiveEventResult event_state = 2;
}

// One entry of `assets/examples/examples.json`: a dataset the app can fetch on
// demand. Only this description is cheap enough to load with the menu — the
// dataset's own bytes cross the network when someone picks it, which is why the
// examples cost nothing to ship.
message ExampleDataset {
  string slug = 1;
  string title = 2; // menu label
  string blurb = 3; // what the dataset is, shown before and after loading
  repeated string characteristics = 4; // what is unique about this recording
  string citation = 5; // whose data this is; real recordings have real owners
  string url = 6; // site-relative, resolved like every other bundled asset
  uint64 bytes = 7; // compressed size, so the menu can say what a click costs
  string sha256 = 8; // of the archive, checked after download
}

message ExampleList {
  repeated ExampleDataset examples = 1;
}

// Load a bundle: one archive carrying a whole dataset — waveforms, station
// metadata and an event catalogue — instead of the four to thirteen separate
// files it is made of.
message LoadBundleRequest {
  string url = 1;
  // From the index. A truncated download is otherwise a confusing parse error
  // somewhere deep in pyrocko rather than "the download did not finish".
  string sha256 = 2;
  // A bundle picked from disk instead of fetched, so a lecturer can hand one out.
  // Exactly one of `url` and `content` is set.
  bytes content = 3;
  string name = 4; // filename, for the summary the load reports
}

// The view a bundle asks to be opened in, in the same vocabulary the frontend
// state uses. Optional, and deliberately short: an example exists to show
// something, and arriving in the state that shows it is the whole difference
// between a dataset and a lesson — co-located sensors say nothing until the
// subsort groups them. An empty string means "leave that setting alone", and an
// unknown value is ignored rather than failing the load.
message BundleView {
  string sort = 1;
  string subsort = 2;
}

// What a bundle says about itself: the prose from its `snuffler.json`.
//
// Carried apart from the load report because it outlives it. A report is what
// just happened — so many traces from so many files — and is stale a minute
// later; this is what the dataset *is*, and stays true for as long as it is
// loaded. `Help ▸ About this dataset` shows it again for anyone who closed the
// window, which is only offered when this is set: an archive that does not
// describe itself has nothing to say a second time.
message BundleAbout {
  string title = 1;
  string body = 2;
}

// A bundle load is several results at once: the scene the waveforms make, the
// station/event side-effects that would each have been their own load, the view
// the bundle asks for, and what it says about itself. `info` carries the event
// markers exactly as `LoadEvents` does, so the frontend applies it through the
// same path.
message BundleResult {
  SceneMeta scene = 1;
  SnufflingResult info = 2;
  BundleView view = 3;
  BundleAbout about = 4;
}
