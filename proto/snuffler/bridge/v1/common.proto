syntax = "proto3";

package snuffler.bridge.v1;

message Nslc {
  string net = 1;
  string sta = 2;
  string loc = 3;
  string cha = 4;
}

// A moment tensor as the six independent components in pyrocko's NED convention
// (north-east-down), matching `pyrocko.moment_tensor.MomentTensor.m6()`. Ferried
// from a catalog QuakeML event to the frontend so a beachball can be rendered by
// pyrocko/matplotlib (never re-derived in Rust) and the Kagan angle computed in
// Python.
message MomentTensor {
  double mnn = 1;
  double mee = 2;
  double mdd = 3;
  double mne = 4;
  double mnd = 5;
  double med = 6;
}
