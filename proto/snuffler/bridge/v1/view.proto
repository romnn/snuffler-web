syntax = "proto3";

package snuffler.bridge.v1;

message ViewParams {
  double tmin = 1;
  double tmax = 2;
  uint32 npx = 3;
  optional double highpass = 4;
  optional double lowpass = 5;
  string sort = 6;
  string subsort = 7;
  double rotate = 8;
  bool remove_response = 9;
  string mode = 10;
  bool demean = 11;
  bool degap = 12;
  bool allow_downsampling = 13;
  bool fft_filtering = 14;
  bool bandpass_lphp = 15;
  bool distances_3d = 16;
  string scaling_base = 17;
  string scaling_group = 18;
  bool wf_abs = 19;
  bool wf_integrate = 20;
  string wf_color_scale = 21;
  uint64 track_offset = 22;
  uint64 track_count = 23;
  double gain = 24;
  bool fix_scale_ranges = 25;
  bool show_scale_ranges = 26;
  bool show_scale_axes = 27;
  optional double visible_tmin = 28;
  optional double visible_tmax = 29;
  optional double scale_tmin = 30;
  optional double scale_tmax = 31;
  // Waterfall colouring — applied in Python (matplotlib colormap) so the frontend
  // only blits the RGBA (packed one pixel per ys float32); no hand-ported LUT.
  // Empty colormap = viridis. These ride ViewParams so a change re-fetches.
  string wf_colormap = 32;
  double wf_clip_lo = 33;
  double wf_clip_hi = 34;
  bool wf_symmetry = 35;
  bool wf_reverse = 36;
}

// One contiguous run of payload on a track.
//
// A channel that arrives in several pieces — anything with a gap — is one track
// carrying several spans, because snuffler stacks one track per gather key and
// paints every segment of that channel onto it. Emitting a track per segment
// instead stacks a gapped channel several times over and scales each piece on its
// own.
message ViewSpan {
  // Start of this run, relative to ViewParams.tmin.
  double t0_rel = 1;
  // Sample spacing, and with it how to read this run out of `ys`: > 0 uniform
  // samples, 0 interleaved (t_rel, y) pairs, < 0 interleaved (t_rel, ylo, yhi)
  // triples.
  double dt = 2;
  // Number of points, not of floats — the interleaved forms carry 2 or 3 each.
  uint64 count = 3;
  // Where this run starts in the flat `ys` payload.
  uint64 offset = 4;
  // Location code of the trace this run came from, which is the track's own for
  // every subsort except the two that group over location — there a row carries
  // several, and this is what tells them apart when colouring.
  string loc = 5;
  // The y range and scale this run is drawn against. Per span rather than per
  // track because snuffler projects per (track, scaling key): two sensors sharing
  // a location-grouped row keep their own amplitude scales, and a waterfall strip
  // keeps its own colour range.
  float ymin = 6;
  float ymax = 7;
  float ymean = 8;
  float yscale = 9;
}

message ViewTrack {
  string net = 1;
  string sta = 2;
  // '*' when the row groups over location — the subsorts snuffler words as
  // "Grouped by Location" put every location of a channel on one row, so this
  // holds the wildcard snuffler itself writes into `track_patterns` and the
  // concrete locations live on the spans. Markers match a row through these four
  // fields, which is why the merged element is a pattern rather than empty:
  // empty already means an empty location code.
  string loc = 3;
  string cha = 4;
  string label = 5;
  // Waterfall frequency bins per column, shared by every span of the track. The
  // time bins are per span: span.count / nf.
  uint64 nf = 6;
  double fmax = 7;
  // What the active sort ordered this track by, when that is not evident from
  // the label: the distance in kilometres for a distance sort, or a note that
  // the station has no coordinates and therefore could not be placed.
  // Empty for name sorting.
  string sort_annotation = 8;
  // The runs of samples to draw on this track, in time order: one per segment of
  // the channel that falls in the window, in either view mode.
  repeated ViewSpan spans = 9;
}

message ViewMeta {
  double view_tmin = 1;
  double view_tmax = 2;
  repeated ViewTrack tracks = 3;
}
