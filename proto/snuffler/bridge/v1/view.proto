syntax = "proto3";

package snuffler.bridge.v1;

message ViewParams {
  double tmin = 1;
  double tmax = 2;
  // Horizontal bins each trace may come back with: one per physical pixel of the
  // canvas width, capped so a tall stack stays affordable.
  uint32 bins_per_trace = 3;
  optional double highpass = 4;
  optional double lowpass = 5;
  string sort = 6;
  string subsort = 7;
  double rotate_deg = 8;
  bool remove_response = 9;
  string mode = 10;
  bool demean = 11;
  bool degap = 12;
  bool allow_downsampling = 13;
  bool fft_filtering = 14;
  bool bandpass_lphp = 15;
  bool distances_3d = 16;
  string scaling_base = 17;
  string scaling_group = 18;
  bool waterfall_absolute_amplitudes = 19;
  bool waterfall_integrate = 20;
  string waterfall_color_scale = 21;
  uint64 track_offset = 22;
  uint64 track_count = 23;
  double gain = 24;
  bool fix_scale_ranges = 25;
  bool show_scale_ranges = 26;
  bool show_scale_axes = 27;
  optional double visible_tmin = 28;
  optional double visible_tmax = 29;
  optional double scale_tmin = 30;
  optional double scale_tmax = 31;
  // Waterfall colouring — applied in Python (matplotlib colormap) so the frontend only
  // blits the RGBA (packed one pixel per ys float32); no hand-ported LUT.
  // Empty colormap = viridis.
  // These ride ViewParams so a change re-fetches.
  string waterfall_colormap = 32;
  double waterfall_clip_low = 33;
  double waterfall_clip_high = 34;
  bool waterfall_reverse_colormap = 36;
  // Snuffler's `visible_length`: a target *sample count* per trace, not a time.
  // It bounds `min_deltat_allow` — channels sampled finer than the window can use are not
  // fetched at all (prepare_cutout2, pile_viewer.py:3597).
  // Unset means the upstream default of 20000.
  optional double visible_length = 37;
  // Snuffler's 'Liberal Fetch Optimization': snap the processing window to an
  // absolute power-of-two grid so panning reuses the cached processed traces.
  // The fetch window is the demean/filter extent, so this changes the numbers —
  // exactly as it does in Qt (pile_viewer.py:3618).
  bool liberal_fetch = 38;
  // This frontend's own 'Adaptive' visible length, which replaces the budget rather than
  // raising it: no `min_deltat_allow` floor, so no channel is ever refused, and what
  // comes back is decimated to `bins_per_trace` — a min/max envelope per bin, which is the
  // resolution the canvas can draw anyway.
  // `visible_length` is ignored while this is set, and is sent unset.
  bool adaptive_visible_length = 39;
  uint64 view_sequence = 40;
}

// One contiguous run of payload on a track.
//
// A channel that arrives in several pieces — anything with a gap — is one track carrying
// several spans, because snuffler stacks one track per gather key and paints every
// segment of that channel onto it.
// Emitting a track per segment instead stacks a gapped channel several times over and
// scales each piece on its own.
message ViewSpan {
  // Start of this run in seconds after ViewMeta.data_tmin.
  double relative_start_s = 1;
  // Sample spacing in seconds for this run in the flat `ys` payload.
  double deltat = 2;
  // Number of uniform samples in the run.
  uint64 count = 3;
  // Where this run starts in the flat `ys` payload.
  uint64 offset = 4;
  // Location code of the trace this run came from, which is the track's own for
  // every subsort except the two that group over location — there a row carries
  // several, and this is what tells them apart when colouring.
  string loc = 5;
  // The y range and scale this run is drawn against.
  // Per span rather than per track because snuffler projects per (track, scaling key):
  // two sensors sharing a location-grouped row keep their own amplitude scales, and a
  // waterfall strip keeps its own colour range.
  //
  // double, not float: Qt's projection stays float64 end to end, and a track whose DC
  // offset dwarfs its span would quantize visibly at 24 bits.
  // These are four scalars per track, not payload.
  double ymin = 6;
  double ymax = 7;
  double ymean = 8;
  double yscale = 9;
  // AutoScaler's tick increment and label exponent for this scale, so 'Show
  // Scale Axes' can draw snuffler's ticks and numbers (pile_viewer.py:3357)
  // without recomputing the scaler frontend-side.
  // A `ytick_step` of 0 means no ticks.
  double ytick_step = 10;
  sint32 ytick_exponent = 11;
}

// Where data exists on a row, from the pile rather than the fetched cutout.
//
// Snuffler's trace boxes are drawn from `pile.iter_traces` (`draw_trace_boxes`,
// pile_viewer.py:2968), so they survive every window the fetch declines — a
// channel `min_deltat_allow` refused to load still shows *where* its data is.
// Deriving boxes from the fetched spans instead leaves the view blank at wide
// zooms, with nothing left to navigate back to.
message TraceBox {
  double tmin = 1;
  double tmax = 2;
  // Box style index (`determine_box_styles`, pile_viewer.py:2947): stepped at every
  // discontinuity in (nslc, deltat, adjacency) over the full_id-sorted pile, so adjacent
  // files alternate tints.
  // The painter takes it modulo its palette length, as Qt does.
  uint32 style = 3;
}

message ViewTrack {
  string net = 1;
  string sta = 2;
  // '*' when the row groups over location — the subsorts snuffler words as "Grouped by
  // Location" put every location of a channel on one row, so this holds the wildcard
  // snuffler itself writes into `track_patterns` and the concrete locations live on the
  // spans.
  // Markers match a row through these four fields, which is why the merged element is a
  // pattern rather than empty: empty already means an empty location code.
  string loc = 3;
  string cha = 4;
  string label = 5;
  // Waterfall frequency bins per column, shared by every span of the track.
  // The time bins are per span: span.count / frequency_bin_count.
  uint64 frequency_bin_count = 6;
  // What the active sort ordered this track by, when that is not evident from
  // the label: the distance in kilometres for a distance sort, or a note that
  // the station has no coordinates and therefore could not be placed.
  // Empty for name sorting.
  string sort_annotation = 8;
  // The runs of samples to draw on this track, in time order: one per segment of
  // the channel that falls in the window, in either view mode.
  repeated ViewSpan spans = 9;
  // The pile's data coverage on this row within the view window, present even
  // when `spans` is empty because the zoom put every channel below
  // `min_deltat_allow`.
  repeated TraceBox boxes = 10;
}

message ViewMeta {
  // The requested ViewParams window, which every span's `relative_start_s` counts from.
  double data_tmin = 1;
  double data_tmax = 2;
  repeated ViewTrack tracks = 3;
  // Processing failures the view survived — a filter or restitution that threw, drawn
  // unprocessed.
  // Snuffler lets these exceptions reach the user; a browser must not die on them, but
  // drawing unfiltered data as if it were filtered with no signal is worse, so the
  // failure rides the answer it affected.
  repeated string notices = 4;
  // The distinct coloring keys of the *whole pile* under the current subsort, in sorted
  // order — snuffler's `color_keys` (`pile.gather_keys(color)`, pile_viewer.py:1753),
  // which it computes once per pile change and numbers the trace palette by.
  // Numbering over the visible slice instead renumbers the palette on every scroll, which
  // snuffler cannot do.
  repeated string color_keys = 5;
  uint64 session_generation = 6;
  uint64 view_sequence = 7;
  // The subsort this reply was produced under.
  // The painter colours from it, not from the live UI state: after a subsort change, a
  // whole round trip still paints the OLD reply's tracks and color_keys, and keying them
  // with the NEW subsort would produce a transient palette belonging to neither.
  string subsort = 8;
}
