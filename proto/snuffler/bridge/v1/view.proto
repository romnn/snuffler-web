syntax = "proto3";

package snuffler.bridge.v1;

message ViewParams {
  double tmin = 1;
  double tmax = 2;
  uint32 npx = 3;
  optional double highpass = 4;
  optional double lowpass = 5;
  string sort = 6;
  string subsort = 7;
  double rotate = 8;
  bool remove_response = 9;
  string mode = 10;
  bool demean = 11;
  bool degap = 12;
  bool allow_downsampling = 13;
  bool fft_filtering = 14;
  bool bandpass_lphp = 15;
  bool distances_3d = 16;
  string scaling_base = 17;
  string scaling_group = 18;
  bool wf_abs = 19;
  bool wf_integrate = 20;
  string wf_color_scale = 21;
  uint64 track_offset = 22;
  uint64 track_count = 23;
  double gain = 24;
  bool fix_scale_ranges = 25;
  bool show_scale_ranges = 26;
  bool show_scale_axes = 27;
  optional double visible_tmin = 28;
  optional double visible_tmax = 29;
  optional double scale_tmin = 30;
  optional double scale_tmax = 31;
  // Waterfall colouring — applied in Python (matplotlib colormap) so the frontend
  // only blits the RGBA (packed one pixel per ys float32); no hand-ported LUT.
  // Empty colormap = viridis. These ride ViewParams so a change re-fetches.
  string wf_colormap = 32;
  double wf_clip_lo = 33;
  double wf_clip_hi = 34;
  bool wf_symmetry = 35;
  bool wf_reverse = 36;
}

message ViewTrack {
  string net = 1;
  string sta = 2;
  string loc = 3;
  string cha = 4;
  string label = 5;
  double t0_rel = 6;
  double dt = 7;
  uint64 count = 8;
  uint64 offset = 9;
  float ymin = 10;
  float ymax = 11;
  float ymean = 12;
  float yscale = 13;
  uint64 nf = 14;
  uint64 nt = 15;
  double fmax = 16;
  // What the active sort ordered this track by, when that is not evident from
  // the label: the distance in kilometres for a distance sort, or a note that
  // the station has no coordinates and therefore could not be placed.
  // Empty for name sorting.
  string sort_annotation = 17;
}

message ViewMeta {
  double view_tmin = 1;
  double view_tmax = 2;
  repeated ViewTrack tracks = 3;
}
