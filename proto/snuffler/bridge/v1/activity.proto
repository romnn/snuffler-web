syntax = "proto3";

package snuffler.bridge.v1;

import "google/protobuf/descriptor.proto";

enum ActivityLane {
  ACTIVITY_LANE_UNSPECIFIED = 0;
  ACTIVITY_LANE_JOB = 1;
  ACTIVITY_LANE_VIEW = 2;
}

enum ActivityPolicy {
  // There is deliberately no EXCLUSIVE: the job lane holds one permit, so
  // exclusion is what QUEUE already gives, and cross-lane exclusion is a
  // separate flag the ledger consumes.
  ACTIVITY_POLICY_UNSPECIFIED = 0;
  ACTIVITY_POLICY_QUEUE = 1;
  ACTIVITY_POLICY_DEDUP = 2;
  ACTIVITY_POLICY_LATEST_WINS = 3;
}

enum ActivityEffect {
  ACTIVITY_EFFECT_UNSPECIFIED = 0;
  ACTIVITY_EFFECT_READ = 1;
  ACTIVITY_EFFECT_MUTATE = 2;
}

enum ActivityCancel {
  // Cancellable is one capability, not a cooperative/interrupt pair: every
  // cancellable rpc gets the same ladder (queued removal, safe-point checks,
  // interpreter interrupt, restart escalation), and the dispatcher's rollback
  // makes the interrupt safe for all of them.
  ACTIVITY_CANCEL_UNSPECIFIED = 0;
  ACTIVITY_CANCEL_NOT_CANCELLABLE = 1;
  ACTIVITY_CANCEL_CANCELLABLE = 2;
}

message Activity {
  string label = 1;
  ActivityLane lane = 2;
  ActivityPolicy policy = 3;
  ActivityEffect effect = 4;
  bool background = 5;
  ActivityCancel cancel = 6;
  bool supersedes = 7;
  bool marker_output = 8;
}

extend google.protobuf.MethodOptions {
  Activity activity = 51000;
}
