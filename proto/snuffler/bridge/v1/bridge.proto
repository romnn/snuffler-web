syntax = "proto3";

package snuffler.bridge.v1;

import "snuffler/bridge/v1/activity.proto";
import "snuffler/bridge/v1/common.proto";
import "snuffler/bridge/v1/data.proto";
import "snuffler/bridge/v1/figure.proto";
import "snuffler/bridge/v1/scene.proto";
import "snuffler/bridge/v1/snuffling.proto";
import "snuffler/bridge/v1/view.proto";

// A Python exception, carried as a DTO instead of raised across the JS boundary.
// (A raised exception's traceback can't be converted to JS on the threaded
// SharedArrayBuffer build — TextDecoder rejects the shared view — so errors must
// travel as proto bytes like every other DTO. See AGENTS.md.)
message BridgeError {
  string kind = 1; // exception class name
  string message = 2; // str(exc)
  string traceback = 3; // traceback.format_exc(), for debugging
}

message StringValue {
  string value = 1;
}

// A saved-file payload: bytes plus the name and type the browser download takes.
message FileBlob {
  string filename = 1;
  bytes content = 2;
  string mime = 3;
}

message BootProgress {
  double fraction = 1;
  string label = 2;
}

message OperationStarted {}

message OperationCountProgress {
  uint64 done = 1;
  optional uint64 total = 2;
}

message OperationProgress {
  string phase = 1;
  oneof progress {
    OperationCountProgress count = 2;
    double fraction = 3;
  }
}

message OperationEvent {
  uint64 job_id = 1;
  oneof event {
    OperationStarted started = 2;
    OperationProgress progress = 3;
  }
}

enum MlDevice {
  ML_DEVICE_UNSPECIFIED = 0;
  ML_DEVICE_WEBGPU = 1;
  ML_DEVICE_WASM = 2;
}

message MlDeviceStatus {
  MlDevice device = 1;
}

message RuntimeFailure {
  string kind = 1;
  string message = 2;
}

message RuntimeInfo {
  bool threaded = 1;
  string python = 2;
  string numpy = 3;
  string pyrocko = 4;
  uint32 cores = 5;
}

message WorkerEvent {
  oneof event {
    BootProgress boot = 1;
    MlDeviceStatus ml_device = 2;
    OperationEvent operation = 3;
    RuntimeFailure runtime_failure = 5;
    RuntimeInfo runtime_info = 6;
  }
  uint32 runtime_epoch = 4;
}

// Request for methods whose input is carried entirely out-of-band (a staged
// file, fetched FDSN text) or that take no parameters at all.
message Empty {}

message Cancelled {}

message Stale {
  uint64 expected_generation = 1;
  uint64 actual_generation = 2;
}

message CancelJobRequest {
  uint64 job_id = 1;
}

enum CancelDisposition {
  CANCEL_DISPOSITION_UNSPECIFIED = 0;
  CANCEL_DISPOSITION_QUEUED = 1;
  CANCEL_DISPOSITION_CANCELLING = 2;
  CANCEL_DISPOSITION_TOO_LATE = 3;
  CANCEL_DISPOSITION_NOT_FOUND = 4;
  CANCEL_DISPOSITION_NOT_CANCELLABLE = 5;
}

message CancelJobReply {
  CancelDisposition disposition = 1;
}

// The envelope every bridge response is wrapped in: exactly one of `error` or a
// concrete success payload. bridge.py's single `call()` failsafe always returns
// one of these; Rust decodes it into a Result. The zero-copy waveform buffer for
// `view` ships out-of-band alongside this message (not in the oneof).
message BridgeResult {
  oneof result {
    BridgeError error = 1;
    SceneMeta scene = 2; // makeExample, loadUrl, emptyScene, loadWaveformPath
    ViewMeta view = 3; // getView (paired with the ys buffer)
    SnufflingResult snuffling = 5; // runSnuffling, catalogSearch, fetchStations, fetchResponses
    MapData map_data = 7; // mapData
    CommandResult command = 8; // runCommand
    SnufMarkerList markers = 9; // loadMarkers
    StringValue text = 10; // markersToText, addCakeModel
    FigureResult figure = 11; // renderFigure (a real pyrocko/matplotlib figure as PNG)
    StationDistanceList station_distances = 12; // stationDistances
    ActiveEventResult active_event = 13; // setActiveEvent
    ExampleList examples = 14; // listExamples
    BundleResult bundle = 15; // loadBundle (a scene plus the metadata that came with it)
    FileBlob blob = 16; // exportWaveforms, exportStations
    LoadBytesResult load_bytes = 17; // loadBytes (scene plus duplicate verdict)
    Cancelled cancelled = 18;
    Stale stale = 19;
    IngestMiniSeedResult ingest = 20;
  }
}

// The single source of truth for the bridge boundary: bridge.py implements one
// handler per rpc (typed proto request -> typed proto response), and the Rust
// client + Python dispatcher are generated from this so a method can never be
// wired to the wrong request or response type. Responses cross the wire wrapped
// in BridgeResult (the matching oneof variant, or BridgeError); the generated
// glue unwraps that.
//
// The Pyodide worker relays every ordinary method to bridge.py. Network rpcs do
// their own HTTP in Python via pyodide-http's pyfetch. MountGfStore is the one
// typed rpc with worker-side setup: the picked browser directory handle rides
// beside the protobuf request (it cannot be serialized into it), the worker
// mounts it, and Python labels the mounted store.
//
// Two transport details ride ALONGSIDE these messages, never inside the oneof:
// the zero-copy float32 `ys` buffer returned with GetView, and (for
// MountGfStore) the mounted store's FS path passed as out-of-band `data`.
service BridgeService {
  rpc MakeExample(Empty) returns (SceneMeta) {
    option (activity) = {
      label: "Loading example"
      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_QUEUE
      session_access: SESSION_ACCESS_MUTATING
      cancellation: CANCELLATION_SUPPORT_NOT_SUPPORTED
      supersedes: true
    };
  }
