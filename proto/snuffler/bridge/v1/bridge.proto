syntax = "proto3";

package snuffler.bridge.v1;

import "snuffler/bridge/v1/common.proto";
import "snuffler/bridge/v1/data.proto";
import "snuffler/bridge/v1/figure.proto";
import "snuffler/bridge/v1/scene.proto";
import "snuffler/bridge/v1/snuffling.proto";
import "snuffler/bridge/v1/view.proto";

// A Python exception, carried as a DTO instead of raised across the JS boundary.
// (A raised exception's traceback can't be converted to JS on the threaded
// SharedArrayBuffer build — TextDecoder rejects the shared view — so errors must
// travel as proto bytes like every other DTO. See AGENTS.md.)
message BridgeError {
  string kind = 1; // exception class name
  string message = 2; // str(exc)
  string traceback = 3; // traceback.format_exc(), for debugging
}

// One changed file that could not be read or loaded during a reload batch.
message ReloadFailure {
  string source_id = 1;
  string name = 2;
  oneof reason {
    BridgeError remote = 3;
    string browser_read = 4;
    string transport = 5;
    string protocol = 6;
  }
}

// The latest successful reload projection plus every independently failed source.
message ReloadBatchResult {
  oneof outcome {
    LoadBytesResult waveform = 1;
    BundleResult bundle = 2;
  }
  repeated ReloadFailure failures = 3;
}

message StringValue {
  string value = 1;
}

// A saved-file payload: bytes plus the name and type the browser download takes.
message FileBlob {
  string filename = 1;
  bytes content = 2;
  string mime = 3;
}

message BootProgress {
  double fraction = 1;
  string label = 2;
}

message SeisbenchProgress {
  double fraction = 1;
  string label = 2;
}

enum MlDevice {
  ML_DEVICE_UNSPECIFIED = 0;
  ML_DEVICE_WEBGPU = 1;
  ML_DEVICE_WASM = 2;
}

message MlDeviceStatus {
  MlDevice device = 1;
}

message WorkerEvent {
  oneof event {
    BootProgress boot = 1;
    SeisbenchProgress seisbench = 2;
    MlDeviceStatus ml_device = 3;
  }
}

// Request for methods whose input is carried entirely out-of-band (a staged
// file, fetched FDSN text) or that take no parameters at all.
message Empty {}

// The envelope every bridge response is wrapped in: exactly one of `error` or a
// concrete success payload. bridge.py's single `call()` failsafe always returns
// one of these; Rust decodes it into a Result. The zero-copy waveform buffer for
// `view` ships out-of-band alongside this message (not in the oneof).
message BridgeResult {
  oneof result {
    BridgeError error = 1;
    SceneMeta scene = 2; // makeExample, loadUrl, emptyScene, loadWaveformPath
    ViewMeta view = 3; // getView (paired with the ys buffer)
    SnufflingResult snuffling = 5; // runSnuffling, catalogSearch, fetchStations, fetchResponses
    MapData map_data = 7; // mapData
    CommandResult command = 8; // runCommand
    SnufMarkerList markers = 9; // loadMarkers
    StringValue text = 10; // gfStoreLabel, markersToText, addCakeModel
    FigureResult figure = 11; // renderFigure (a real pyrocko/matplotlib figure as PNG)
    StationDistanceList station_distances = 12; // stationDistances
    ActiveEventResult active_event = 13; // setActiveEvent
    ExampleList examples = 14; // listExamples
    BundleResult bundle = 15; // loadBundle (a scene plus the metadata that came with it)
    FileBlob blob = 16; // exportWaveforms, exportStations
    LoadBytesResult load_bytes = 17; // loadBytes (scene plus duplicate verdict)
  }
}

// The single source of truth for the bridge boundary: bridge.py implements one
// handler per rpc (typed proto request -> typed proto response), and the Rust
// client + Python dispatcher are generated from this so a method can never be
// wired to the wrong request or response type. Responses cross the wire wrapped
// in BridgeResult (the matching oneof variant, or BridgeError); the generated
// glue unwraps that.
//
// The Pyodide worker is a DUMB RELAY: it forwards (method id, request bytes) to
// bridge.py and ships the result back; it spells no method names of its own. Even
// the network rpcs (DownloadWaveforms/CatalogSearch/FetchStations/FetchResponses,
// LoadUrl) do their own HTTP in Python via pyodide-http's pyfetch — the browser's
// fetch reachable from Python — so there are no hand-written worker orchestrations
// left to drift. The one thing the worker still does itself is mount a live
// directory handle for a GF store (a DOM object that can't ride a proto), then
// relay GfStoreLabel.
//
// Two transport details ride ALONGSIDE these messages, never inside the oneof:
// the zero-copy float32 `ys` buffer returned with GetView, and (for
// GfStoreLabel) the mounted store's FS path passed as out-of-band `data`.
service BridgeService {
  rpc MakeExample(Empty) returns (SceneMeta);
  rpc EmptyScene(Empty) returns (SceneMeta);
  rpc LoadBytes(LoadBytesRequest) returns (LoadBytesResult);
  rpc LoadUrl(LoadUrlRequest) returns (SceneMeta);
  rpc ListExamples(Empty) returns (ExampleList);
  rpc LoadBundle(LoadBundleRequest) returns (BundleResult);
  rpc IngestMiniSeed(IngestMiniSeedRequest) returns (SceneMeta);
  rpc GetView(ViewParams) returns (ViewMeta); // + out-of-band ys buffer
  rpc RenderFigure(FigureRequest) returns (FigureResult); // a real pyrocko/matplotlib figure, PNG
  rpc RunSnuffling(NamedSnufflingRequest) returns (SnufflingResult);
  rpc RmsTraces(SnufflingRequestParams) returns (SnufflingResult);
  rpc RunCommand(CommandRequest) returns (CommandResult);
  rpc MapData(MapRequest) returns (snuffler.bridge.v1.MapData);
  rpc StationDistances(Empty) returns (StationDistanceList);
  rpc SetActiveEvent(SetActiveEventRequest) returns (ActiveEventResult);
  rpc UpdateEvent(EventSnapshot) returns (ActiveEventResult);
  rpc RemoveEvents(RemoveEventsRequest) returns (ActiveEventResult);
  rpc LoadGfStoreUrl(StringRequest) returns (StringValue);
  rpc MarkersToText(MarkerFile) returns (StringValue);
  rpc LoadMarkers(LoadMarkersRequest) returns (SnufMarkerList);
  rpc LoadStationXml(LoadStationXmlRequest) returns (SnufflingResult);
  rpc LoadStations(LoadStationsRequest) returns (SnufflingResult);
  rpc LoadEvents(LoadEventsRequest) returns (SnufflingResult);
  rpc AddCakeModel(AddCakeModelRequest) returns (StringValue);
  rpc DownloadWaveforms(WaveformDownloadRequest) returns (SceneMeta);
  rpc CatalogSearch(CatalogRequest) returns (SnufflingResult);
  rpc FetchStations(StationRequest) returns (SnufflingResult);
  // Qt's download Save trigger (download.py:147): the loaded waveforms as
  // MiniSEED plus the station table as a pyrocko station file.
  rpc ExportWaveforms(Empty) returns (FileBlob);
  rpc ExportStations(Empty) returns (FileBlob);
  rpc FetchResponses(StationRequest) returns (SnufflingResult);
  rpc GfStoreLabel(Empty) returns (StringValue);
}
