syntax = "proto3";

package snuffler.bridge.v1;

import "snuffler/bridge/v1/common.proto";
import "snuffler/bridge/v1/scene.proto";
import "snuffler/bridge/v1/view.proto";

message SpectrumSnufflingParams {
  bool spec_smoothing = 1;
  double spec_smoothing_bandwidth = 2;
}

message StaltaSnufflingParams {
  optional double stalta_highpass = 1;
  optional double stalta_lowpass = 2;
  double stalta_swin = 3;
  double stalta_ratio = 4;
  double stalta_level = 5;
  bool stalta_show_level_traces = 6;
  string stalta_variant = 7;
  string stalta_scalingmethod = 8;
  bool stalta_apply_to_sum = 9;
}

message PolarizationSnufflingParams {
  double polarization_t_length = 1;
  double polarization_ft_offset = 2;
  double polarization_azimuth = 3;
  optional double polarization_highpass = 4;
  optional double polarization_lowpass = 5;
  double polarization_dot_position = 6;
  bool polarization_rotate_to_rt = 7;
  bool polarization_show_eigensystem_2d = 8;
  bool polarization_show_eigensystem_3d = 9;
  bool polarization_fix_scale = 10;
}

message RmsSnufflingParams {
  optional double rms_highpass = 1;
  optional double rms_lowpass = 2;
  double rms_block = 3;
  bool rms_group = 4;
  bool rms_log = 5;
}

message CakeSnufflingParams {
  string cake_model = 1;
  repeated string cake_phases = 2;
  double cake_tshift = 3;
  bool cake_use_station_depth = 4;
  string cake_mode = 5;
}

message SpectrogramSnufflingParams {
  double spectrogram_twin = 1;
  double spectrogram_overlap = 2;
  string spectrogram_taper = 3;
  optional double spectrogram_fmin = 4;
  optional double spectrogram_fmax = 5;
  string spectrogram_color_scale = 6;
  string spectrogram_color_table = 7;
}

// A double-couple point source for synthetic seismograms (pyrocko.gf.DCSource),
// generated through a mounted Green's-functions store — snufflings/seismosizer.py.
message SeismosizerSnufflingParams {
  string seis_store = 1; // "GF Store: <id>" of a mounted store
  string seis_waveform_type = 2; // Displacement/Velocity/Acceleration [m|nm ...]
  double seis_time = 3; // time shift relative to the active event [s]
  double seis_north_km = 4;
  double seis_east_km = 5;
  double seis_depth_km = 6;
  double seis_magnitude = 7;
  double seis_strike = 8;
  double seis_dip = 9;
  double seis_rake = 10;
  double seis_stf_duration = 11; // source-time-function duration [s]
  // Qt's four STF choices (seismosizer.py:35): "half sin" (default),
  // "triangular", "boxcar", "None". Empty = "half sin". A zero duration still
  // passes a zero-duration STF object, exactly as Qt's `get_stf` does.
  string seis_stf_type = 12;
  // Which of Qt's five Seismosizer source snufflings this run is
  // (seismosizer.py:280-560): "DCSource" (default when empty), "MTSource",
  // "SFSource", "RectangularSource", "PseudoDynamicRupture". The fields below
  // belong to the non-DC sources and are read per type.
  string seis_source_type = 13;
  // MTSource: relative moment-tensor components, normalized then scaled to the
  // magnitude's moment (`get_m6`, seismosizer.py:385).
  double seis_rmnn = 14;
  double seis_rmee = 15;
  double seis_rmdd = 16;
  double seis_rmne = 17;
  double seis_rmnd = 18;
  double seis_rmed = 19;
  // SFSource: force components [N].
  double seis_fn = 20;
  double seis_fe = 21;
  double seis_fd = 22;
  // RectangularSource / PseudoDynamicRupture geometry.
  double seis_length_km = 23;
  double seis_width_km = 24;
  double seis_nucleation_x = 25;
  double seis_nucleation_y = 26;
  double seis_velocity = 27; // rupture velocity [m/s]
  // PseudoDynamicRupture.
  double seis_slip = 28;
  double seis_gamma = 29;
  uint32 seis_nx = 30;
  uint32 seis_ny = 31;
  bool seis_tapered = 32;
}

message SeisbenchSnufflingParams {
  string model = 1;
  string weights = 2;
  optional double p_threshold = 3;
  optional double s_threshold = 4;
  string model_base_url = 5;
  bool show_annotation_traces = 6;
  bool use_predefined_filters = 7;
  double scale_factor = 8;
}

message SnufflingParams {
  SpectrumSnufflingParams spectrum = 1;
  StaltaSnufflingParams stalta = 2;
  PolarizationSnufflingParams polarization = 3;
  RmsSnufflingParams rms = 4;
  CakeSnufflingParams cake = 5;
  SpectrogramSnufflingParams spectrogram = 6;
  SeismosizerSnufflingParams seismosizer = 7;
  SeisbenchSnufflingParams seisbench = 8;
}

message SnufflingRequestParams {
  ViewParams view = 1;
  SnufflingParams snufflings = 2;
  // The selected non-event markers, which are the run scope Qt gives every
  // snuffling (`chopper_selected_traces`, snuffling.py:1000): each span is a
  // chop window plus a trace filter from the marker's channel patterns. Empty =
  // fall back to the visible window.
  repeated SnufflingSpan selected_spans = 3;
  MarkerBudget marker_budget = 4;
}

message MarkerBudget {
  uint32 max_markers = 1;
}

// One selected marker's extent, as a snuffling's processing scope.
message SnufflingSpan {
  double tmin = 1;
  double tmax = 2;
  // The marker's channel patterns (may hold shell wildcards); empty = every trace.
  repeated Nslc nslc_ids = 3;
}

message SnufMarker {
  double t = 1;
  optional double tmax = 2;
  optional string phase = 3;
  uint32 kind = 4;
  bool is_event = 5;
  // The channels the marker applies to — a *list*, as pyrocko's `nslc_ids` is
  // (marker.py:168): a Qt pick binds to every channel gathered onto the clicked
  // track, and a loaded file legally carries several. Empty = every track.
  repeated uint32 nslc_indexes = 6;
  optional int32 polarity = 7;
  // Focal mechanism for an event marker sourced from a catalog moment tensor,
  // plus the Kagan angle (degrees) to the active event and the event's catalog
  // name/hash. Absent for markers without an MT.
  optional MomentTensor moment_tensor = 8;
  optional double kagan_deg = 9;
  optional string event_hash = 10;
  // Phase-pick time uncertainty (seconds) round-tripped from marker files.
  optional double uncertainty = 11;
  // Event-origin fields for the marker table's event columns (from the catalog
  // Event); depth is metres, like model.Event.depth. Absent on non-event markers.
  optional double magnitude = 12;
  optional double depth = 13;
  optional double lat = 14;
  optional double lon = 15;
  // `PhaseMarker._automatic`: machine-made picks save `True` and wear an `@` in
  // their label; hand picks save `False` (marker.py:707).
  optional bool automatic = 16;
  // `PhaseMarker` incidence/take-off angles — the SeisBench picker rides the pick
  // probability on incidence, exactly as Qt's does (seisbench_picker.py:341).
  optional double incidence_angle = 17;
  optional double takeoff_angle = 18;
  // The catalog Event's own identity fields, which Qt writes into a saved event
  // row (`EventMarker.get_attributes`) and composes its caption from.
  optional string event_name = 19;
  optional string region = 20;
  optional string catalog = 21;
  // The associated event's origin time — the association fallback pyrocko's
  // `associate_phases_to_events` re-links on when the hash is absent.
  optional double event_time = 22;
  // Distance from this *event* to the active event, in km — the marker table's
  // `Dist [km]` column (marker_editor.py:502), precomputed with pyrocko's
  // orthodrome. Absent on non-events and while nothing is active.
  optional double dist_active_km = 23;
  // Whether Python auto-activated this event (largest magnitude on catalog
  // load) — the activation must be *visible*, so the marker carries it.
  bool active = 24;
}

message SnufflingResult {
  bool show_window = 1;
  string text = 2;
  repeated SnufMarker markers = 3;
  SceneMeta scene = 4;
  // Which snuffling produced this result. A re-run first removes the markers
  // the previous run with the same origin added — Qt's `cleanup()` contract
  // (snuffling.py:1689), without which Cake/STA-LTA/SeisBench stack duplicates.
  // Empty = the markers accumulate (marker-file loads, catalog searches).
  string origin = 5;
  ActiveEventResult event_state = 6;
  uint64 markers_dropped = 7;
  uint32 marker_budget = 8;
  repeated Nslc nslc_table = 9;
}

message NamedSnufflingRequest {
  string name = 1;
  SnufflingRequestParams params = 2;
}
