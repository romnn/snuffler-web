syntax = "proto3";

package snuffler_web_proto;

message Nslc {
  string net = 1;
  string sta = 2;
  string loc = 3;
  string cha = 4;
}

// A moment tensor as the six independent components in pyrocko's NED convention
// (north-east-down), matching `pyrocko.moment_tensor.MomentTensor.m6()`.
// Ferried from a catalog QuakeML event to the frontend so a beachball can be rendered by
// pyrocko/matplotlib (never re-derived in Rust) and the Kagan angle computed in Python.
message MomentTensor {
  double mnn = 1;
  double mee = 2;
  double mdd = 3;
  double mne = 4;
  double mnd = 5;
  double med = 6;
}

// The canonical event registry entry shared by rendering, marker files, the map,
// and every scientific consumer.
message EventSnapshot {
  string event_hash = 1;
  double time = 2;
  double lat = 3;
  double lon = 4;
  double depth = 5; // metres, like `pyrocko.model.Event.depth`
  optional double magnitude = 6;
  optional string name = 7;
  optional string region = 8;
  optional string catalog = 9;
  optional MomentTensor moment_tensor = 10;
}

message EventKagan {
  string event_hash = 1;
  optional double kagan_deg = 2; // absent when either event lacks a moment tensor
  // Distance from this event to the active one, in kilometres.
  optional double dist_km = 3;
}

// A complete projection of Python's event registry and active-event metrics.
message ActiveEventResult {
  bool has_event = 1;
  optional string active_hash = 2;
  repeated EventKagan kagan = 3;
  repeated EventSnapshot events = 4;
}
