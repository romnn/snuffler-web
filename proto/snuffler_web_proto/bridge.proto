      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_DEDUP
      session_access: SESSION_ACCESS_READ_ONLY
      cancellation: CANCELLATION_SUPPORT_NOT_SUPPORTED
      secondary_feedback: true
    };
  }
  rpc LoadBundle(LoadBundleRequest) returns (BundleResult) {
    option (activity) = {
      label: "Loading dataset"
      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_QUEUE
      session_access: SESSION_ACCESS_MUTATING
      cancellation: CANCELLATION_SUPPORT_SUPPORTED
      supersedes: true
    };
  }
  rpc IngestMiniSeed(IngestMiniSeedRequest) returns (IngestMiniSeedResult) {
    option (activity) = {
      label: "Ingesting live data"
      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_QUEUE
      session_access: SESSION_ACCESS_MUTATING
      cancellation: CANCELLATION_SUPPORT_NOT_SUPPORTED
