syntax = "proto3";

package snuffler_web_proto;

import "snuffler_web_proto/activity.proto";
import "snuffler_web_proto/common.proto";
import "snuffler_web_proto/data.proto";
import "snuffler_web_proto/figure.proto";
import "snuffler_web_proto/scene.proto";
import "snuffler_web_proto/snuffling.proto";
import "snuffler_web_proto/view.proto";

// A Python exception, carried as a DTO instead of raised across the JS boundary.
// A raised exception's traceback cannot be converted to JS on the threaded
// SharedArrayBuffer build, because TextDecoder rejects the shared view, so errors
// travel as proto bytes like every other DTO.
message BridgeError {
  string kind = 1; // exception class name
  string message = 2; // str(exc)
  string traceback = 3; // traceback.format_exc(), for debugging
}

message StringValue {
  string value = 1;
}

// A saved-file payload: bytes plus the name and type the browser download takes.
message FileBlob {
  string filename = 1;
  bytes content = 2;
  string mime = 3;
}

// Worker events: what the worker reports between replies, polled once per frame.

// How far the Pyodide boot has got.
message BootProgress {
  double fraction = 1;
  string label = 2;
}

// The job has started running in Python.
message OperationStarted {}

message OperationCountProgress {
  uint64 done = 1;
  optional uint64 total = 2;
}

message OperationProgress {
  string phase = 1;
  oneof progress {
    OperationCountProgress count = 2;
    double fraction = 3;
  }
}

// A running job's lifecycle event, tagged with the ledger's job id.
message OperationEvent {
  uint64 job_id = 1;
  oneof event {
    OperationStarted started = 2;
    OperationProgress progress = 3;
  }
}

// Where SeisBench inference runs.
enum MlDevice {
  ML_DEVICE_UNSPECIFIED = 0;
  ML_DEVICE_WEBGPU = 1;
  ML_DEVICE_WASM = 2;
}

message MlDeviceStatus {
  MlDevice device = 1;
}

// Python failed to boot; the runtime is unusable until restarted.
message RuntimeFailure {
  string kind = 1;
  string message = 2;
}

// The booted runtime's build, for the About window.
message RuntimeInfo {
  bool threaded = 1;
  string python = 2;
  string numpy = 3;
  string pyrocko = 4;
  uint32 cores = 5;
}

message WorkerEvent {
  // Events from a previous worker are dropped; their jobs are already settled.
  oneof event {
    BootProgress boot = 1;
    MlDeviceStatus ml_device = 2;
    OperationEvent operation = 3;
    RuntimeFailure runtime_failure = 5;
    RuntimeInfo runtime_info = 6;
  }
  uint32 runtime_epoch = 4;
}

// Request for methods that take no parameters, or whose only input travels
// out-of-band (MountGfStore's mounted directory).
message Empty {}

// Cancellation won before the dispatcher committed; nothing was applied.
message Cancelled {}

// The defensive session-generation check refused to commit a result.
message Stale {
  uint64 expected_generation = 1;
  uint64 actual_generation = 2;
}

message CancelJobRequest {
  uint64 job_id = 1;
}

// What a cancel request did.
enum CancelDisposition {
  CANCEL_DISPOSITION_UNSPECIFIED = 0;
  // The job was still queued and is gone.
  CANCEL_DISPOSITION_QUEUED = 1;
  // The running job was asked to stop.
  CANCEL_DISPOSITION_CANCELLING = 2;
  // The job had already started committing, so its result stands.
  CANCEL_DISPOSITION_TOO_LATE = 3;
  CANCEL_DISPOSITION_NOT_FOUND = 4;
  CANCEL_DISPOSITION_NOT_CANCELLABLE = 5;
}

message CancelJobReply {
  CancelDisposition disposition = 1;
}

// The envelope every bridge response is wrapped in: exactly one of `error` or a
// concrete success payload.
// The bridge's single `service.call()` failsafe always returns one of these, and Rust
// decodes it into a Result.
// Each success variant carries a distinct message, which is how the generated
// client binds an rpc to its variant.
// The zero-copy waveform buffer for `view` ships out-of-band alongside this
// message, not in the oneof.
message BridgeResult {
  oneof result {
    BridgeError error = 1;
    SceneMeta scene = 2;
    ViewMeta view = 3;
    SnufflingResult snuffling = 5;
    MapData map_data = 7;
    CommandResult command = 8;
    SnufMarkerList markers = 9;
    StringValue text = 10;
    FigureResult figure = 11;
    ActiveEventResult active_event = 13;
    ExampleList examples = 14;
    BundleResult bundle = 15;
    FileBlob blob = 16;
    LoadBytesResult load_bytes = 17;
    Cancelled cancelled = 18;
    Stale stale = 19;
    IngestMiniSeedResult ingest = 20;
  }
}

// The single source of truth for the bridge boundary.
// snuffler_bridge.service implements one handler per rpc (typed proto request ->
// typed proto response), and the Rust client and Python dispatcher are generated
// from this, so a method can never be wired to the wrong request or response type.
// Responses cross the wire wrapped in BridgeResult (the matching oneof variant,
// or BridgeError), and the generated glue unwraps that.
//
// The Pyodide worker relays every ordinary method to snuffler_bridge.service.
// Network rpcs do their own HTTP in Python via pyodide-http's pyfetch.
// MountGfStore is the one typed rpc with worker-side setup: the picked browser
// directory handle rides beside the protobuf request (it cannot be serialized
// into it), the worker mounts it, and Python labels the mounted store.
//
// Two transport details ride ALONGSIDE these messages, never inside the oneof:
// the zero-copy float32 `ys` buffer returned with GetView, and (for
// MountGfStore) the mounted store's FS path passed as out-of-band `data`.
service BridgeService {
  rpc MakeExample(Empty) returns (SceneMeta) {
    option (activity) = {
      label: "Loading example"
      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_QUEUE
      session_access: SESSION_ACCESS_MUTATING
      cancellation: CANCELLATION_SUPPORT_NOT_SUPPORTED
      supersedes: true
    };
  }
  rpc EmptyScene(Empty) returns (SceneMeta) {
    option (activity) = {
      label: "Clearing scene"
      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_QUEUE
      session_access: SESSION_ACCESS_MUTATING
      cancellation: CANCELLATION_SUPPORT_NOT_SUPPORTED
      supersedes: true
    };
  }
  rpc LoadBytes(LoadBytesRequest) returns (LoadBytesResult) {
    option (activity) = {
      label: "Loading waveforms"
      lane: ACTIVITY_LANE_JOB
      policy: ACTIVITY_POLICY_QUEUE
