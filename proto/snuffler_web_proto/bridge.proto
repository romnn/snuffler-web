  rpc GetView(ViewParams) returns (ViewMeta) {
    option (activity) = {
      label: "Updating view"
      lane: ACTIVITY_LANE_VIEW
      policy: ACTIVITY_POLICY_LATEST_WINS
      session_access: SESSION_ACCESS_READ_ONLY
      cancellation: CANCELLATION_SUPPORT_NOT_SUPPORTED
