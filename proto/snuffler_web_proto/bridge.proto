  // Qt's download Save trigger (download.py:147): the loaded waveforms as
  // MiniSEED plus the station table as a pyrocko station file.
  rpc ExportWaveforms(Empty) returns (FileBlob) {
    option (activity) = {
      label: "Exporting waveforms"
