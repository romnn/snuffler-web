title = "Bonin Islands 2015 — co-located sensors"
blurb = """
The 2015-05-30 Bonin Islands Mww 7.8, at 664 km depth among the deepest large \
earthquakes ever recorded, on six Global Seismographic Network stations 56° to 104° \
away: fifteen minutes covering the body-wave arrivals.

Every station here operates more than one broadband at the same site: one on location \
code 00 sampled at 20 Hz, a second on 10 at 40 Hz, and at KIP and TUC a third on 60. \
The dataset opens with the subsort on "Network, Station, Channel (by Location)", which \
overlays co-located instruments so the 42 channels occupy 18 rows; "Network, Station, \
Location, Channel" separates them again. Overlaid, the instruments record the same \
waveform while differing by up to 20x in raw counts — which is what per-track amplitude \
scaling is for, and what the instrument responses resolve by converting counts to \
ground motion.

The depth shapes the seismogram. A source at 664 km excites surface waves only weakly, \
so the record is dominated by body phases: P arrives 9 to 13 minutes after the origin \
as the distance grows from 56° at KIP to 104° at HRV, followed about three minutes \
later by the depth phases pP and sP — reflections from the surface above the source, \
whose delay behind P is a direct measure of source depth.
"""
characteristics = [
  "co-located sensors, two and three per site, overlaid on one row when grouped by location",
  "two sampling rates on one track, 20 Hz beside 40 Hz",
  "instruments differing by up to 20x in counts, resolved by scaling and deconvolution",
  "distance sort against a real event catalogue, 56° to 104°",
  "depth phases pP and sP a few minutes behind P, from a 664 km source",
]
citation = """
Global Seismographic Network: IRIS/USGS network IU (doi:10.7914/SN/IU) and IRIS/IDA \
network II (doi:10.7914/SN/II), distributed by EarthScope. Every channel here is openly \
licensed. Event origin from the USGS (us20002ki3).
"""

# Where the bytes came from; `scripts/fetch-example.py` replays it. EarthScope
# serves both GSN halves (IU is IRIS/USGS, II is IRIS/IDA) and every channel here
# is `restrictedStatus="open"`.
[source]
datacenter = "https://service.earthscope.org/fdsnws"
networks = ["IU", "II"]
stations = "ANMO,COLA,HRV,KIP,PFO,TUC"
locations = "00,10,60"
channels = "BH?"
start = "2015-05-30T11:23:00"
end = "2015-05-30T11:38:00"
event_id = "us20002ki3"

# Open showing the thing this dataset exists for. Ungrouped, the co-located sensors
# are merely adjacent rows and nothing about them stands out; grouped, each row
# carries every instrument at its site. Distance order puts the moveout of the P
# arrival on screen at the same time.
[state]
sort = "distance"
subsort = "nsc_l"
