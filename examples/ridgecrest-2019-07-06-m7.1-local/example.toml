title = "Ridgecrest 2019 — a local earthquake"
blurb = """
Three minutes of the 2019-07-06 Ridgecrest Mw 7.1 on seven Southern California Seismic \
Network strong-motion stations between 5 and 89 km from the epicentre, at 100 samples \
per second.

At local distances the timescale is seconds rather than minutes. The first P onset \
reaches CI.CLC, 5 km from the epicentre, 0.67 s after the catalogued origin, and CI.GSC \
at 89 km after 14.9 s; sorted by distance, the onsets align with an apparent velocity \
of about 6 km/s, consistent with crustal P. The strongest shaking arrives with the \
S wave and later phases, well after the first onset, and continues for over a minute — \
at this magnitude and range, the first motion and the peak motion are separated by \
tens of seconds.

The channels are accelerometers (HN). This close to a Mw 7.1, co-sited broadband \
sensors are commonly driven off scale — the mechanism the Tohoku example isolates — so \
the strong-motion channels are the reliable record of the largest amplitudes.
"""
characteristics = [
  "a local earthquake: onsets seconds apart, at 100 Hz",
  "P moveout with an apparent velocity of about 6 km/s across 5 to 89 km",
  "peak shaking arriving with the S wave and later phases, not the first onset",
  "strong-motion (HN) channels where co-sited broadbands would clip",
  "a distance sort that turns the stack into a record section",
]
citation = """
Southern California Seismic Network, operated by Caltech and the USGS (network CI, \
doi:10.7914/SN/CI), distributed by the Southern California Earthquake Data Center. Event \
origin from the USGS (ci38457511).
"""

# Distance order, so the P moveout across the network is the picture rather than a
# station-by-station comparison.
[state]
sort = "distance"

[source]
# The close-in stations are archived at SCEDC; EarthScope carries only the two most
# distant of these, which would leave the moveout with nothing to move across.
datacenter = "https://service.scedc.caltech.edu/fdsnws"
networks = ["CI"]
stations = "CLC,WRC2,CCC,WMF,DTP,ISA,GSC"
locations = "*"
channels = "HN?"
start = "2019-07-06T03:19:45"
end = "2019-07-06T03:22:45"
event_id = "ci38457511"
