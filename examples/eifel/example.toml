title = "Eifel 2023 — a dense deployment"
blurb = """
Ninety seconds of earthquakes at the Ochtendung Fault Zone in the East Eifel on \
2023-01-14, recorded by 354 stations from six networks at 100, 125 and 200 Hz — a \
temporary dense deployment rather than a set of permanent observatories.

The window sits at the start of a burst of small earthquakes: thirteen within forty \
minutes, opening with an M2.1-M2.2 pair six seconds apart at about 11 km depth, the \
rest M1.1 and below. Three of them fall inside these ninety seconds. The largest \
events come first and the activity decays behind them — a mainshock-aftershock burst, \
not one of the swarms the region also produces. What distinguishes the setting is \
that it is an active volcanic field: Laacher See, 9 km away, last erupted about \
13,000 years ago, and the Eifel still shows uplift, magmatic CO2 degassing and deep \
low-frequency earthquakes beneath the volcano. How the fault-zone seismicity relates \
to that system is the kind of question deployments like this one are fielded to \
answer.

The scale is the characteristic. The catalogue delivered with the data holds 717 \
events from the deployment's eleven months across the wider region, a realistic \
population for the distance and azimuth sorts and the event navigation; the stack is \
1061 traces deep, far more than one screen shows, so paging, sorting, filtering and \
the ':' command line become the working method rather than conveniences. The data \
also carries the defects of a real deployment: one channel sits at its digitizer \
rail for the entire window.
"""
characteristics = [
  "a dense temporary deployment: 354 stations, six networks, three sampling rates",
  "seismicity of an active volcanic field: the Ochtendung Fault Zone, 9 km from Laacher See",
  "a 1061-trace stack, where paging, filtering and the ':' command line become the method",
  "azimuthal coverage wide enough for the azimuth sort to be informative",
  "several catalogued events inside one ninety-second window",
  "a dead channel at the digitizer rail beside live ones",
]
citation = """
Eifel deployment networks 5X, 6E, 6X, 7X and 8X with the Bensberg Earthquake Network \
(BQ, University of Cologne, doi:10.7914/SN/BQ), as delivered by the datacenter.
"""

# With 354 stations the name order is an alphabet, not a picture. Distance order
# turns the same stack into the moveout of a local event across a network.
[state]
sort = "distance"
