title = "Tohoku 2011 — clipping and strong motion"
blurb = """
Ten minutes of the 2011-03-11 Tohoku Mww 9.1 at IU.MAJO (Matsushiro, Japan), about \
440 km from the epicentre: one site recording the same shaking with two broadband \
seismometers and an accelerometer.

Location 00 is an STS-1 broadband, 10 an STS-2 with 5.43x its sensitivity, and 20 an \
EpiSensor accelerometer, a far less sensitive instrument built to stay on scale during \
strong shaking. Before the arrival the two broadbands differ by the ratio of their \
sensitivities, about five, as co-located velocity sensors should. From about 05:48 the \
ratio drops to between 1.4 and 2.3 and stays low through the strongest shaking: the \
STS-2 is clipping, and its output no longer grows in proportion to the ground motion. \
Scaled by their sensitivities, the two peak amplitudes differ by a factor of about 4.5 \
for the same ground motion — the measurable signature of saturation.

The accelerometer stays within its range throughout, peaking near 0.13 m/s², and is \
the usable record of the peak motion. This division of labour is why observatories \
operate strong-motion instruments beside their broadbands. The dataset opens grouped \
by location so the three instruments share rows, and with the responses loaded, \
deconvolution converts each to its own physical unit: m/s for the broadbands, m/s² for \
the accelerometer.
"""
characteristics = [
  "clipping: output that stops growing in proportion to the ground motion",
  "why a broadband and an accelerometer share one site",
  "co-located sensors as a cross-check, on one row when grouped by location",
  "deconvolution to physical units: m/s for the broadbands, m/s² for the accelerometer",
  "100 Hz strong motion beside 20 and 40 Hz broadbands",
]
citation = """
Global Seismographic Network: IRIS/USGS network IU (doi:10.7914/SN/IU), distributed by \
EarthScope; openly licensed. Event origin from the USGS \
(usp000hvnu).
"""

# Grouped by location, so the three instruments at Matsushiro are drawn as one row
# per channel and the disagreement between them is a comparison rather than a hunt
# across the stack.
[state]
subsort = "nsc_l"

[source]
datacenter = "https://service.earthscope.org/fdsnws"
networks = ["IU"]
stations = "MAJO"
