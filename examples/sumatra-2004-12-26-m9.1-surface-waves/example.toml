title = "Sumatra 2004 — multi-orbit surface waves"
blurb = """
Six hours of the 2004-12-26 Sumatra-Andaman Mw 9.1 on four Global Seismographic \
Network stations between 86° and 136° away, three components at 1 Hz (LH channels).

One sample per second suits this signal: the surface waves that dominate a great \
earthquake at teleseismic distances carry periods of tens to hundreds of seconds, and \
six hours of 1 Hz stays under a megabyte where 20 Hz would be twenty. The surface-wave \
train arrives roughly an hour after the origin and is spread over tens of minutes, the \
longer periods in front — group-velocity dispersion, visible directly in the \
seismogram. In distance order the four stations form a record section, arrival times \
growing down the screen.

The window is six hours long because of the later arrivals. The train that left the \
source in the opposite direction arrives along the major arc (R2, in the naming used \
for Rayleigh waves) at about a fifth of the first train's amplitude, and the direct \
train returns after a full orbit as R3, below a tenth. Both become readable once the \
gain is raised: surface waves from an earthquake of this size remain observable after \
more than one passage around the Earth.
"""
characteristics = [
  "long-period recording: LH channels at 1 Hz, matched to the signal band",
  "group-velocity dispersion spreading the wavetrain over tens of minutes",
  "multi-orbit surface waves: R2 along the major arc, R3 after a full orbit",
  "late arrivals an order of magnitude below the first, where the gain control matters",
  "four stations between 86° and 136°, in distance order",
]
citation = """
Global Seismographic Network: IRIS/USGS network IU (doi:10.7914/SN/IU) and IRIS/IDA \
network II (doi:10.7914/SN/II), distributed by EarthScope; openly licensed. Event origin \
from the USGS (usp000dbed).
"""

# Distance order, so the arrival time growing with distance is the shape of the
# stack rather than something to work out station by station.
[state]
sort = "distance"

[source]
datacenter = "https://service.earthscope.org/fdsnws"
networks = ["IU", "II"]
stations = "ANMO,HRV,KIP,BFO"
# HRV wrote an empty location code in 2004, where the others use 00.
locations = "00,--"
channels = "LH?"
start = "2004-12-26T00:58:00"
end = "2004-12-26T06:58:00"
event_id = "usp000dbed"
