title = "Tonga 2022 — the atmospheric Lamb wave"
blurb = """
A day of the 2022-01-15 Hunga Tonga–Hunga Ha‘apai eruption on five Global Seismographic \
Network stations between 829 and 17734 km away, each with two co-sited instruments: a \
seismometer (LHZ) and a barometer (LDO).

The seismic records behave conventionally: surface waves peak at AFI about seven \
minutes after the origin and at PAB in Spain after about a hundred, propagating at \
kilometres per second. The pressure records carry the unusual signal. The eruption \
excited an atmospheric Lamb wave — a pressure pulse guided along the Earth's surface, \
travelling near the mean sound speed of the lower atmosphere. Its onset reaches AFI at \
0.47 h, RAR at 1.19 h, KIP at 4.23 h, ANMO at 8.32 h and PAB at 15.81 h; a straight \
line at 306 m/s fits all five onsets to within 27 km. Sorted by distance, the two \
moveouts share the screen, three orders of magnitude apart in speed.

PAB records the wave a second time: the pulse that left the source in the opposite \
direction arrives along the major arc, 22341 km, at 19.83 h — 313 m/s again. The first \
arrival at PAB (17734 km) is also larger than at ANMO at roughly half the distance. On \
a sphere, geometric spreading weakens a wavefront only out to 90° from the source; \
beyond that the front shortens again and the amplitude recovers toward the antipode.
"""
characteristics = [
  "one source in two media: seismic arrivals at km/s, an air wave at 306 m/s",
  "barometer channels (LDO) beside the seismometers at the same sites",
  "Lamb-wave onsets on a single straight line from 829 to 17734 km",
  "the major-arc arrival at PAB, and amplitude recovering beyond 90°",
  "a day-long window whose signals are hours apart, read with zoom and distance sort",
]
citation = """
Global Seismographic Network: IRIS/USGS network IU (doi:10.7914/SN/IU), distributed by \
EarthScope; openly licensed. Event origin from the USGS (us7000gc8r).
"""

# Distance order, so the air wave's moveout is the shape of the stack: it steps down
# the screen station by station over sixteen hours, which is the whole point.
[state]
sort = "distance"

[source]
# Two instruments per site: the seismometer (LHZ, location 00) and the barometer
# (LDO, location 31) that GSN stations run beside it. The dataset only says
# anything with both — one event recorded by two different physics at two very
# different speeds.
datacenter = "https://service.earthscope.org/fdsnws"
networks = ["IU"]
stations = "AFI,RAR,KIP,ANMO,PAB"
locations = "00,31"
channels = "LHZ,LDO"
# From 2h45m before the eruption, so there is quiet on screen to measure against,
# to 21h45m after it — long enough for the air wave to reach Spain the short way
# round and then again the long way.
start = "2022-01-15T01:30:00"
end = "2022-01-16T02:00:00"
event_id = "us7000gc8r"
