[project]
name = "snuffler-web-native-qt"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The pinned Pyrocko commit probes mixed-case backend names.
    # Matplotlib 3.9 moved backend discovery to a lowercase registry.
    "matplotlib<3.9",
    "numpy==2.4.3",
    "pyqt5==5.15.10",
    "pyqtwebengine>=5.15.7,<5.16",
    "pyrocko",
]

[dependency-groups]
parity = [
    "numpy==2.4.3",
    "protobuf==7.34.1",
    "pytest==8.4.2",
]

[tool.uv]
package = false
default-groups = []
# The package cooldown that produced uv.lock, carried in the project
# rather than left to ~/.config/uv/uv.toml. A relative span is recorded in the
# lock as `exclude-newer-span`, so an environment that does not set one — CI,
# a container, a fresh clone — reads the setting as *removed*, re-resolves, and
# then rejects the lock under `--locked`. Stating it here makes the lock
# verifiable anywhere, and keeps the policy under review with the code.
#
# Keep it equal to `min-age` in the repository's cooldown.toml.
# `cooldown --sync` writes that window only to the root uv.toml, and uv stops
# looking for configuration at this project's own pyproject.toml.
exclude-newer = "14 days"

[tool.uv.sources]
pyrocko = { path = "../sources/pyrocko", editable = true }
