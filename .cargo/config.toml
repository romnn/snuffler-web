# The clipboard API is still unstable, so web-sys requires this flag for copy
# (Ctrl+C) to work in the browser:
# https://rustwasm.github.io/docs/wasm-bindgen/web-sys/unstable-apis.html
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis"]

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[alias]
c = 'check --workspace --all-targets'

# linting
l = "clippy --all-targets --no-deps"
lint = "clippy --all-targets --no-deps"
fixit = "clippy --fix --allow-dirty --allow-staged --all-targets --no-deps"
