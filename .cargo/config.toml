# Flags for the wasm web target only.
#
# - web_sys_unstable_apis: the clipboard API is still unstable, so web-sys needs
#   this for copy (Ctrl+C) in the browser.
#   https://rustwasm.github.io/docs/wasm-bindgen/web-sys/unstable-apis.html
# - the rest are the wasm-bindgen-rayon threading flags: the egui app runs the
#   heavy resvg PNG export on a worker pool (the `threads` feature) so it never
#   blocks the UI. atomics/bulk-memory + a shared, IMPORTED memory (so every
#   worker shares it) + the TLS/heap symbols wasm-bindgen's threading pass needs.
#   We `strip` in release, which drops their names, so they must be exported
#   explicitly; __heap_base is the one extra vs the wasm-bindgen-rayon README,
#   needed only because we strip. (See https://github.com/RReverser/wasm-bindgen-rayon.)
#
# These stay in shared cargo config because they are wasm-only and inert for the
# host `cargo check`/`clippy` passes: there is no link step, so the link-args are
# ignored. The actual threaded LINK still needs `-Z build-std` so wasm std is
# rebuilt with atomics; that remains build-scoped in the `task serve` /
# `task build` workflows rather than in shared cargo config, so host-native test
# runs do not rebuild std.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg=web_sys_unstable_apis",
    "-Ctarget-feature=+atomics,+bulk-memory,+mutable-globals",
    "-Clink-arg=--shared-memory",
    "-Clink-arg=--max-memory=1073741824",
    "-Clink-arg=--import-memory",
    "-Clink-arg=--export=__wasm_init_tls",
    "-Clink-arg=--export=__tls_size",
    "-Clink-arg=--export=__tls_align",
    "-Clink-arg=--export=__tls_base",
    "-Clink-arg=--export=__heap_base",
]

[alias]
c = "check"

# Keep aliases composable: only invariant flags belong here, so taskfile targets
# can add `--workspace`, `--lib --tests`, `--target wasm32-unknown-unknown`, etc.
l = "clippy --no-deps"
lint = "clippy --no-deps"
fixit = "clippy --fix --allow-dirty --allow-staged --no-deps"

# Unused-dependency checks; `task unused` and `task unused:deep` call these.
#
# An alias must not be named after the subcommand it wraps: cargo resolves aliases before
# external subcommands, so `shear = "shear …"` would expand into itself.
#
# `unused` scans sources instead of building them, so it is fast, needs no toolchain, and covers
# every target plus `[dev-dependencies]` in one pass.
# Do not route it through cargo-fc: shear rejects the per-row `--features` flags cargo-fc passes,
# and feature combinations mean nothing to a scan that never compiles.
#
# `unused-deep` is the compile-based fallback rather than the default because it counts a
# dependency as used once any crate in the build graph has loaded it, which hides most unused
# edges on shared `[workspace.dependencies]`.
# It needs nightly, which rust-toolchain.toml already pins.
unused = "shear --deny-warnings"
unused-deep = "fc --maximal-features udeps --all-targets"
