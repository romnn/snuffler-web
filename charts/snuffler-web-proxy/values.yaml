# yaml-language-server: $schema=values.schema.json

# More HTTP targets `/cors` may forward to, on top of the FDSN data centers the app knows.
# Each is a URL, such as `https://example.org/fdsnws/dataselect/1/query`, matched by scheme,
# host, port and exact path.
allowHttpTargets: []
# More `host:port` TCP targets `/tcp` may connect to, on top of the SeedLink servers the app
# knows, such as `seedlink.example.org:18000`.
allowTcpTargets: []
# Timeout for outgoing HTTP and TCP connections, in milliseconds; unset, the proxy's own default
# of 10 seconds.
connectTimeoutMs: null

log:
  # `json`, one object per line for a log shipper, or `pretty` for reading in a terminal.
  format: json
  # A `RUST_LOG`-style filter, such as `debug` or `info,cors_proxy=trace`; empty, the proxy
  # logs its own crates at `info`.
  # One that does not parse stops the proxy at startup.
  filter: ""

otel:
  # An OpenTelemetry collector to export traces, metrics and logs to over OTLP gRPC, such as
  # `http://otel-collector.observability:4317`; empty, the proxy only logs.
  endpoint: ""
  # Whether log events go to the collector too; off keeps them to stderr, for a cluster whose log
  # shipper already collects it and would otherwise store every event twice.
  exportLogs: true

# Overrides the chart name in resource names and the `app.kubernetes.io/name` label.
nameOverride: ""
# Overrides the full resource name, which is otherwise the release name and the chart name.
fullnameOverride: ""
# Labels added to every resource.
commonLabels: {}

# Pod replicas; ignored while autoscaling is enabled.
replicaCount: 1
# Old ReplicaSets kept for `helm rollback`.
revisionHistoryLimit: 10
# The Deployment's update strategy, such as
# `{type: RollingUpdate, rollingUpdate: {maxUnavailable: 0}}`.
strategy: {}

image:
  repository: ghcr.io/romnn/snuffler-web/proxy
  # Defaults to the chart's appVersion.
  tag: ""
  # Pins the image by digest, such as `sha256:…`, and wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the full resource name when created, and to `default` otherwise.
  name: ""
  annotations: {}
  # The proxy never calls the Kubernetes API.
  automountServiceAccountToken: false

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

# The image runs the proxy as user 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

priorityClassName: ""
runtimeClassName: ""
# A live SeedLink relay ends when its pod stops; the browser reconnects to another replica.
terminationGracePeriodSeconds: 30
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

# Requests and limits for the container; left to the deployment, since they depend on the
# cluster and the traffic.
resources: {}

# The probes, each a Kubernetes probe plus `enabled`.
startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  failureThreshold: 30
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# More environment variables, such as `OTEL_RESOURCE_ATTRIBUTES`.
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []
initContainers: []
# Sidecar containers, beside the proxy.
extraContainers: []
lifecycle: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

service:
  type: ClusterIP
  port: 80
  # A fixed node port, for the `NodePort` and `LoadBalancer` types.
  nodePort: null
  clusterIP: ""
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  # A live SeedLink stream holds its WebSocket open for as long as it runs, past most ingress
  # controllers' default timeouts, such as ingress-nginx's
  # `nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"` and
  # `nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"`.
  annotations: {}
  labels: {}
  hosts: []
  #  - host: proxy.snuffler.example
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: proxy-snuffler-example-tls
  #    hosts:
  #      - proxy.snuffler.example

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # Utilization targets need resource requests to measure against.
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  # More HorizontalPodAutoscaler metrics, as Kubernetes writes them.
  metrics: []
  behavior: {}

podDisruptionBudget:
  enabled: false
  # One budget applies: `minAvailable` when set, else `maxUnavailable`.
  minAvailable: null
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: ""

# Isolates the pods to exactly the listed NetworkPolicy rules.
networkPolicy:
  enabled: false
  # Who may reach the proxy; by default anyone, on its HTTP port.
  ingress:
    - ports:
        - port: http
  # Where the proxy may connect: DNS, and every data center and SeedLink server it allows,
  # which are outside the cluster, so by default anywhere.
  egress:
    - {}

# The `helm test` pod, which fetches the health endpoint through the Service.
tests:
  enabled: true
  image: busybox:1.37
  resources: {}
