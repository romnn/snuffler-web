[project]
name = "snuffler-web-tooling"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mypy==1.18.2",
    "numpy==2.4.3",
    "protobuf==7.34.1",
    "ruff==0.14.8",
    "types-protobuf==7.34.1.20260518",
]

[dependency-groups]
codegen = ["mypy-protobuf==5.1.0"]

[tool.uv]
package = false
# The package cooldown that produced uv.lock lives in the committed uv.toml beside
# this file, which `cooldown --sync` writes from cooldown.toml and uv reads in place
# of an `exclude-newer` here.
# It must not be left to ~/.config/uv/uv.toml.
# A relative span is recorded in the lock as `exclude-newer-span`, so an environment
# that does not set one — CI, a container, a fresh clone — reads the setting as
# *removed*, re-resolves, and then rejects the lock under `--locked`.

[tool.mypy]
# The interpreter bridge.py actually runs on: the wasm CPython in our Pyodide
# build (pyodide-lock's info.python), not the host that runs mypy.
python_version = "3.14"
strict = true
files = ["web/bridge.py", "web/bootstrap.py", "web/seisbench_infer.py"]
mypy_path = ["web/proto", "typings"]
exclude = ["^web/proto/", "^pybuild/build/", "^sources/", "^target/"]

disallow_any_unimported = true
implicit_reexport = false
disallow_any_generics = true
disallow_subclassing_any = true
warn_unused_configs = true
warn_no_return = true

# The generated protobuf stubs subclass google.protobuf.Message; without the
# (optional) types-protobuf stubs that base is Any, which trips
# disallow_any_unimported/disallow_subclassing_any. Relax those for the generated
# modules so the type check stays green regardless of whether types-protobuf is
# present (the check:py task installs it; editors/CI may not).
[[tool.mypy.overrides]]
module = ["snuffler.bridge.v1.*"]
disallow_any_unimported = false
disallow_subclassing_any = false

# pyodide.http (pyfetch) and the `js` module only exist inside the Pyodide
# runtime and have no stubs; the bridge never puts their types in a signature, so
# this just lets the in-function imports resolve.
[[tool.mypy.overrides]]
module = ["pyodide.*", "js"]
ignore_missing_imports = true

# matplotlib has no stubs installed here; it is only used to render pyrocko's real
# figures headlessly (Agg) inside figure-drawing helpers, and its types never
# appear in a bridge signature (the figure is passed around as Any), so resolving
# the in-function imports is all that's needed.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# pyrocko.plot.cake_plot is pyrocko's own (untyped) matplotlib plotting module,
# reused verbatim to render the Cake figures; like matplotlib it is only called
# from figure helpers and never appears in a bridge signature.
[[tool.mypy.overrides]]
module = ["pyrocko.plot.*"]
ignore_missing_imports = true

# pyrocko.gf (Green's-functions engine: LocalEngine/DCSource/Target/Request) is used
# only inside the seismosizer helper to build + process synthetics; its types never
# appear in a bridge signature (everything is Any locals).
[[tool.mypy.overrides]]
module = ["pyrocko.gf", "pyrocko.gf.*"]
ignore_missing_imports = true

# pyrocko.moment_tensor (MomentTensor + kagan_angle) and pyrocko.io.quakeml (the
# QuakeML reader) are used only inside the catalog/beachball helpers to ferry
# focal mechanisms; their types never appear in a bridge signature (Any locals).
[[tool.mypy.overrides]]
module = ["pyrocko.moment_tensor", "pyrocko.io.quakeml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "pybuild/export_seisbench_models.py",
    "pybuild/setup.py",
    "qt/driver.py",
    "scripts/build-examples.py",
    "scripts/fetch-example.py",
    "scripts/fit-wiggle-themes.py",
    "tests/parity/**/*.py",
    "tests/codegen_missing_activity.py",
    "tests/seisbench_validate.py",
    "typings/**/*.pyi",
    "web/bootstrap.py",
    "web/bridge.py",
    "web/seisbench_infer.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# pyflakes (F) + the pycodestyle error subset ruff enables by default, plus
# import sorting (I) and bugbear (B). Line length is handled by `ruff format`, so
# the noisy E501 is intentionally left out.
select = ["E4", "E7", "E9", "F", "I", "B"]
# B009/B010 (constant getattr/setattr) conflict with the deliberate dynamic
# access this bridge uses to reach attributes missing from the scipy/pyrocko
# type stubs and to set custom attributes on sys.modules stub objects — the
# explicit type annotations there keep mypy correct.
ignore = ["B009", "B010"]
