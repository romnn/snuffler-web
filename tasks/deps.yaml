# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Dependency freshness, within the supply-chain cooldown (cooldown.toml), and mise's tools.

tasks:
  outdated:
    desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
    cmds:
      - "cooldown outdated --sync {{.CLI_ARGS}}"

  outdated:minor:
    desc: "list outdated deps within the current major only"
    cmds:
      - "cooldown outdated --no-major --sync {{.CLI_ARGS}}"

  upgrade:
    desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
    aliases: [update]
    cmds:
      - "cooldown upgrade --major --sync {{.CLI_ARGS}}"

  upgrade:minor:
    desc: "upgrade all deps within their current major, within the cooldown"
    cmds:
      - "cooldown upgrade --no-major --sync {{.CLI_ARGS}}"

  upgrade:latest:
    desc: "upgrade ignoring the cooldown window — use deliberately"
    prompt:
      - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly
        compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
    cmds:
      - "cooldown upgrade --latest {{.CLI_ARGS}}"

  mise:upgrade:
    desc: "upgrade mise-managed tools and refresh the lockfile"
    env:
      # mise caches remote version lists for an hour, which would hide a fresh release.
      MISE_FETCH_REMOTE_VERSIONS_CACHE: "0s"
      # mise's hosted version index trails GitHub releases even with the cache off.
      MISE_USE_VERSIONS_HOST: "0"
    cmds:
      - mise upgrade {{.CLI_ARGS}}
      - mise lock
